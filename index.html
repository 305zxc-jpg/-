/* Layout: full-bleed pixel canvas, HUD pinned top, spell tray + shop pinned bottom. One fixed 25-colour palette shared with the sprites; single deliberate night theme. */
:root{
  --ink:#f4f4f4;
  --muted:#94b0c2;
  --dark:#1a1c2c;
  --panel:#262b44;
  --panel2:#333c57;
  --edge:#566c86;
  --gold:#ffcd75;
  --gold2:#f2a93b;
  --hp:#b13e53;
  --font:"Galmuri11","Galmuri14",monospace;
  --font14:"Galmuri14","Galmuri11",monospace;
  --notch:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--dark);color:var(--ink);font-family:var(--font14);font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;font-smooth:never}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;font-size:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pxi{image-rendering:pixelated;width:36px;height:36px;display:block}
.pxi.sm{width:24px;height:24px;display:inline-block;vertical-align:middle}
.pxi.lg{width:48px;height:48px;margin:0 auto}
.pxi.xl{width:72px;height:72px;margin:0 auto}
/* shared pixel frame: dark outer line, lighter inner bevel, notched corners */
.card,#pop,#toast,.stat,#pauseBtn,.slot,.offer,.cell,.ghost,.big,#drawBtn,.lvrow,.act,.desc,.pill,.traits div,.statsgrid div,.hpwrap,.xpwrap,.rules summary,.tag{clip-path:var(--notch);border:3px solid var(--dark)}

#hud{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.row{display:flex;align-items:center;gap:8px}
.bars{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.hpwrap{position:relative;height:22px;background:var(--dark);box-shadow:inset 0 0 0 2px var(--panel2)}
.hpwrap::before{content:"♥";position:absolute;left:6px;top:50%;transform:translateY(-50%);font-family:var(--font);font-size:11px;color:var(--ink);z-index:2}
#hpbar{position:absolute;left:2px;top:2px;bottom:2px;width:100%;max-width:calc(100% - 4px);background:var(--hp);box-shadow:inset 0 3px 0 #ef7d57,inset 0 -3px 0 #6e1f3a;transition:width .1s steps(3)}
#shbar{position:absolute;left:2px;top:2px;height:6px;width:0;max-width:calc(100% - 4px);background:#73eff7;z-index:1}
#hptext{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font);font-size:11px;z-index:2;text-shadow:1px 1px 0 var(--dark)}
.xpwrap{height:12px;background:var(--dark);border-width:2px}
#xpbar{height:100%;width:0;background:#41a6f6;box-shadow:inset 0 2px 0 #73eff7;transition:width .15s steps(3)}
#timer{font-size:28px;min-width:76px;text-align:center;font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 var(--dark)}
#speedBtn{pointer-events:auto;width:40px;height:40px;background:var(--panel2);box-shadow:inset 0 -4px 0 var(--panel),inset 0 3px 0 var(--edge);font-family:var(--font);font-size:11px;clip-path:var(--notch);border:3px solid var(--dark)}

<script>
(()=>{
'use strict';
// ---------- data ----------
const TRAITS={
  fire:{name:'화염',color:'#ff7a45',fx:['모든 피해 +60%','피해 +160%, 처치 폭발, 처치 시 체력 흡수','피해 추가 ×2, 모든 공격이 불태움, 흡수 2배']},
  frost:{name:'냉기',color:'#6fd3ff',fx:['피해 +20%, 45% 둔화, 둔화된 적 받는 피해 +35%','피해 +50%, 65% 둔화, 적 받는 피해 +80%, 내가 받는 피해 -20%','피해 추가 ×2.2, 적 받는 피해 +150%, 내 피해 -35%, 3초마다 전체 빙결+얼음 보호막']},
  storm:{name:'폭풍',color:'#c79bff',fx:['재사용 대기 -30%, 피해 +30%','대기 -45%, 피해 +70%, 50% 두 번 발동, 회피 10%','피해 추가 ×1.6, 대기 -30%, 85% 두 번 발동, 매초 벼락, 회피 20%']},
  nature:{name:'자연',color:'#7ee08a',fx:['초당 1.5 회복, 체력 +40, 피해 +25%','초당 3.5 회복, 체력 +100, 피해 +60%, 이동 +15%','피해 추가 ×2, 받는 피해 -20%, 초당 6 회복, 가시 폭풍']},
  dark:{name:'어둠',color:'#d0507a',fx:['처치 시 체력 1 흡수, 피해 +30%','흡수 2, 피해 +70%, 저주 피해 +80%','피해 추가 ×2.5, 처치한 적이 영혼 폭발']},
  light:{name:'빛',color:'#fff1b0',fx:['피해 +20%, 초당 1.5 회복, 받는 피해 -10%','피해 +50%, 초당 3 회복, 받는 피해 -20%, 4초마다 빛 보호막','피해 추가 ×2, 받는 피해 -30%, 맞으면 빛 폭발로 반격']},
};
const RAR=[{name:'일반',col:'#a9a6d0'},{name:'희귀',col:'#5aa8ff'},{name:'전설',col:'#ffcf5a'},{name:'신화',col:'#ff6bd6'},{name:'복합',col:'#7ee8c8'}];
const M=[0,1,2,4]; // star power: 9 copies for ★3 should feel huge
const R=n=>Math.round(n);
const POW={blizzard:0.55,bloom:0.183,breath:0.702,chain:1.315,curse:1.945,eclipse:0.233,eruption:0.196,field:2.409,firebolt:2.912,firestorm:0.084,frostmine:2.056,frostring:2.195,frostwhirl:0.204,holybolt:1.534,holywater:0.45,icethorn:0.532,judgment:0.304,lance:1.485,lightshot:2.869,meteor:0.406,pillar:0.541,pollen:0.216,reaper:0.127,salamander:2.055,shadowbolt:6.942,shadowclone:5.058,shadowflame:0.576,snare:2.757,spore:2.237,steam:0.465,stormeye:0.341,stormorb:1.685,sun:0.057,thorns:0.735,thunder:0.127,thundertree:1.543,vampbat:5.976,voidorb:0.724,whirl:0.564,zero:0.169};let _pw=1;const Mp=s=>M[s]*_pw;
// growth spell: levels up only while equipped, can't merge, one copy at a time
const SEED_MAX=10,SEED_EVO=[4,7,10],seedNeed=lv=>30*lv,seedG=lv=>(1+.18*(lv-1))*(POW.seed||1),seedN=lv=>lv>=10?3:lv>=4?2:1;
const NONE_T={name:'무속성',color:'#d6d2ff'},TR=k=>TRAITS[k]||NONE_T;
const starTxt=it=>it.glv?`Lv${it.glv}`:'★'.repeat(it.star);
const ITEMS={

function mergeAll(){
  const out=[];let found=true;
  while(found){found=false;
    const g={};
    for(const it of allItems()){if(it.star>=3||it.glv)continue;const k=it.id+'|'+it.star;(g[k]=g[k]||[]).push(it);}
    for(const k in g){if(g[k].length>=3){
      const three=g[k].slice(0,3),target=three.find(x=>S.slots.includes(x))||three[0],[arr,idx]=locOf(target);
      for(const x of three){const l=locOf(x);l[0][l[1]]=null;}
      const nw=mk(three[0].id,three[0].star+1);arr[idx]=nw;
      out.push(nw);found=true;break;}}
  }

}

function genFloor(){

    if(cells.has(ckey(nx,ny)))continue;let nb=0;for(const e of Object.values(DIRS))if(cells.has(ckey(nx+e[0],ny+e[1])))nb++;if(nb>1)continue;cells.set(ckey(nx,ny),{x:nx,y:ny});}
  const rooms=[...cells.values()];for(const r of rooms){r.type='normal';r.cleared=false;r.visited=false;r.items=[];}
  const nbs=r=>Object.values(DIRS).filter(d=>cells.has(ckey(r.x+d[0],r.y+d[1]))).length;
  const dist=new Map([[ckey(0,0),0]]),q=[cells.get(ckey(0,0))];
  while(q.length){const c=q.shift();for(const d of Object.values(DIRS)){const k=ckey(c.x+d[0],c.y+d[1]);if(cells.has(k)&&!dist.has(k)){dist.set(k,dist.get(ckey(c.x,c.y))+1);q.push(cells.get(k));}}}
  const st0=cells.get(ckey(0,0));st0.type='start';st0.cleared=true;
  const others=rooms.filter(r=>r!==st0).sort((a,b)=>dist.get(ckey(b.x,b.y))-dist.get(ckey(a.x,a.y)));
  const deads=others.filter(r=>nbs(r)===1);
  const pick=list=>{const r=list.find(x=>x.type==='normal');return r;};
  const boss=deads[0]||others[0];boss.type='boss';
  (pick(deads)||pick(others)).type='treasure';
  (pick(deads)||pick(others)).type='shop';
  S.dg={cells,cur:null,pending:[],shotN:0,fireT:0,orbA:0,turretT:4,cleared:0,buyCD:0,stairs:false};
}
function roomAt(x,y){return S.dg.cells.get(ckey(x,y));}
function doorsOf(r){return Object.keys(DIRS).filter(k=>roomAt(r.x+DIRS[k][0],r.y+DIRS[k][1]));}
function roomOpen(){return S.dg.pending.length===0&&!S.enemies.some(e=>!e.dead&&e.type!=='goldgob');}
function dgPos(minDist=110){const p=S.p;for(let i=0;i<30;i++){const x=rnd(-RW/2+WALL+30,RW/2-WALL-30),y=rnd(-RH/2+WALL+30,RH/2-WALL-30);if(Math.hypot(x-p.x,y-p.y)>=minDist)return[x,y];}return[0,-RH/4];}
function enterRoom(r,dir){
  const p=S.p,d=S.dg;
  if(d.cur){d.cur.loot={gems:S.gems.map(g=>({...g,mag:false})),items:S.items.slice()};} // leftovers stay in the room
  S.gems=[];S.enemies=[];S.eproj=[];S.proj=[];S.tears=[];S.zones=[];S.mines=[];S.turrets=[];S.blasts=[];S.items=[];S.atk=[];S.clones=[];d.pending=[];d.stairs=!!r.stairs;
  d.cur=r;r.visited=true;
  if(r.loot){S.gems=r.loot.gems;S.items=r.loot.items;r.loot=null;}
  if(dir==='n'){p.x=0;p.y=RH/2-WALL-28;}else if(dir==='s'){p.x=0;p.y=-RH/2+WALL+28;}else if(dir==='w'){p.x=RW/2-WALL-28;p.y=0;}else if(dir==='e'){p.x=-RW/2+WALL+28;p.y=0;}else{p.x=0;p.y=0;}
  if(r.cleared)return;
  if(r.type==='normal'){if(r.waves==null)r.waves=Math.random()<.3+.12*S.floor?2:1;dgWave(r,1);}
  else if(r.type==='boss'){d.pending.push({type:'boss',x:0,y:-RH/4,t:1});toast(`보스 방! ${mapOf().boss}`);}
  else if(r.type==='treasure'){r.items=[{id:roll(),price:0,x:0,y:-20}];r.cleared=true;}
  else if(r.type==='shop'){const ids=[roll(),roll(),roll()];r.items=ids.map((id,i)=>({id,price:priceOf(id)+3,x:-110+i*110,y:-40}));r.items.push({heart:true,price:5,x:0,y:70});r.cleared=true;}
}
function dgWave(r,size){const d=S.dg,pool=FLOOR_POOL[S.floor],n=Math.round((5+S.floor*1.6+Math.floor(Math.random()*3)+Math.floor(d.cleared/3))*size);
  for(let i=0;i<n;i++){const [x,y]=dgPos();d.pending.push({type:pool[Math.floor(Math.random()*pool.length)],x,y,t:.6+i*.05});}
  if(Math.random()<.15+.08*S.floor){const [x,y]=dgPos(150);d.pending.push({type:'elite',x,y,t:.9});}}
function startDungeon(id){
  newGame(id,'meadow');S.mode='dungeon';S.floor=0;S.map=FLOORS[0];S.tears=[];S.enemies=[];
  genFloor();recompute(true);applyScale();enterRoom(roomAt(0,0),null);renderSlots();
  toast('1층 · 밤의 초원 — 방을 정복하고 보스를 찾으세요');
}
function nextFloor(){
  if(S.floor>=FLOORS.length-1){S.won=true;showEnd(true);return;}
  // nothing left behind on the old floor: bank gems, open chests
  let banked=0,chests=0;const bank=list=>{for(const g of list){if(g.chest)chests++;else{banked+=g.v;S.gem+=g.v*st.gemMul;gainXp(g.v);}}};
  bank(S.gems);S.gems=[];for(const r of S.dg.cells.values())if(r.loot){bank(r.loot.gems);r.loot=null;}
  for(let i=0;i<chests;i++)freeSummon();const bankMsg=banked||chests?` · 남은 보상 ◆${Math.round(banked)}${chests?` + 상자 ${chests}`:''}`:'';
  S.floor++;S.map=FLOORS[S.floor];groundPat=null;genFloor();enterRoom(roomAt(0,0),null);
  S.p.hp=Math.min(S.p.maxhp,S.p.hp+S.p.maxhp*.3);toast(`${S.floor+1}층 · ${MAPS[S.map].name}${bankMsg}`);shake(6);
}
function dgSpawnEnemy(type,x,y){

  if(type==='boss'){e.max=e.hp=BOSS_HP[S.floor];S.boss=e;}

}
function aimDir(){
  const p=S.p;

  let ax=0,ay=0;if(keys['arrowleft'])ax--;if(keys['arrowright'])ax++;if(keys['arrowup'])ay--;if(keys['arrowdown'])ay++;if(ax||ay){const l=Math.hypot(ax,ay);return[ax/l,ay/l];}
  if(mouseAim.on){const r=cv.getBoundingClientRect(),sx=(p.x-0)*SC+W/2,sy=(p.y-0)*SC+H/2,dx=mouseAim.x-r.left-sx,dy=mouseAim.y-r.top-sy,l=Math.hypot(dx,dy)||1;return[dx/l,dy/l];}
  if(META.aim!=='manual'){const t=nearestEnemies(1,700)[0];if(t){const dx=t.x-p.x,dy=t.y-p.y,l=Math.hypot(dx,dy)||1;return[dx/l,dy/l];}}
  return null;
}
function fireTears(dx,dy){

  const base=Math.atan2(dy,dx),n=v.multi,spread=n>1?Math.max(v.spread,.12):0;
  for(let i=0;i<n;i++){const a=base+(n>1?(i/(n-1)-.5)*spread*(n-1):0),sp=330*v.speed;
    S.tears.push({x:p.x,y:p.y-6,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,a,age:0,life:st.range*(v.boomer?1.4:1),dmg:7*(1+.06*(S.lv-1))*v.dmgMul*(giant?v.giantDmg:1),r:(giant?12:5)*v.size,pierce:v.pierce,hit:new Set(),giant,zapT:0,spikeT:0,split:v.split,mineCh:v.mine,returned:false});}

  if(v.voidEvery&&d.shotN%v.voidEvery===0)S.proj.push({k:'void',x:p.x,y:p.y,vx:dx*90,vy:dy*90,r:14,dmg:7*v.dmgMul*1.2,life:2.6,hitT:new Map(),pierce:999,col:'#5d275d',star:2});
  if(v.beamEvery&&d.shotN%v.beamEvery===0)doBeam(Math.atan2(dy,dx),7*v.dmgMul*5,22);
  if(v.strikeEvery&&d.shotN%v.strikeEvery===0){const t=nearestEnemies(1,500)[0];if(t){S.fx.push({k:'zap',x1:t.x+rnd(-20,20),y1:t.y-280,x2:t.x,y2:t.y,life:.22});hurt(t,7*v.dmgMul*3,'#e3c6ff');}}
}
function tearHit(b,e){

  if(v.root&&Math.random()<v.root&&e.type!=='boss')e.rootT=1.2;
  if(v.pillar&&Math.random()<v.pillar)S.fx.push({k:'dboom',x:e.x,y:e.y,t:.4,max:.4,r:44,dmg:dmg*2.5,col:'#fff1b0',pillar:true});
  if(v.burn){e.burnT=2.5;e.burnD=Math.max(e.burnD||0,dmg*v.burn);}
  if(v.slow)e.slowT=Math.max(e.slowT,1.2);
  if(v.freeze&&Math.random()<v.freeze)e.frozenT=Math.max(e.frozenT||0,.8);
  if(v.steam&&(e.slowT>0||e.frozenT>0))boom(e.x,e.y,40+8*v.steam,dmg*1.4*v.steam,'#f4f4f4');
  if(v.fireStrike&&Math.random()<v.fireStrike){S.fx.push({k:'zap',x1:e.x,y1:e.y-260,x2:e.x,y2:e.y,life:.2});zone(e.x,e.y,34,2,dmg*.25,'239,125,87','fire');}
  if(b.giant)boom(b.x,b.y,60,dmg*.8,v.col);

}
function tearSplit(b){const n=b.split;for(let i=0;i<n;i++){const a=b.a+i/n*6.283;S.tears.push({x:b.x,y:b.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,a,age:0,life:.35,dmg:b.dmg*.45,r:3.5,pierce:0,hit:new Set(b.hit),giant:false,zapT:0,spikeT:9,split:0,mineCh:0,child:true});}}
function tearEnd(b){const v=st.evo;
  if(!b.child){if(v.fmine&&Math.random()<v.fmine)S.mines.push({x:b.x,y:b.y,arm:.3,life:8,dmg:b.dmg*1.8,r:42,star:1,frost:true});
    if(v.pcloud&&Math.random()<v.pcloud){zone(b.x,b.y,38,2.5,b.dmg*.25,'167,240,112','poison');S.zones[S.zones.length-1].slow=true;}
    if(v.holyw&&Math.random()<v.holyw)zone(b.x,b.y,42,2.5,b.dmg*.25,'255,241,176','holy');}
  if(b.split>0)tearSplit(b);

  if(v.bloom)S.fx.push({k:'dboom',x:b.x,y:b.y,t:.15,max:.15,r:40+6*v.bloom,dmg:b.dmg*1.2*v.bloom,col:'#ef7d57',petals:v.bloom>=3});

  if(b.mineCh&&Math.random()<b.mineCh)S.mines.push({x:b.x,y:b.y,arm:.4,life:8,dmg:b.dmg*2,r:45,star:1});

function dungeonTick(dt){
  const p=S.p,d=S.dg,v=st.evo;
  // pending spawns appear after a short telegraph
  for(const q of d.pending){q.t-=dt;if(q.t<=0){q.done=true;dgSpawnEnemy(q.type,q.x,q.y);}}
  d.pending=d.pending.filter(q=>!q.done);
  // room cleared?
  if(!d.cur.cleared&&roomOpen()&&d.cur.type==='normal'&&d.cur.waves>1){d.cur.waves--;dgWave(d.cur,.7);toast('두 번째 무리가 몰려와요!');}
  if(!d.cur.cleared&&roomOpen()&&d.cur.type!=='start'){d.cur.cleared=true;d.cleared++;
    for(let i=0;i<2+S.floor;i++){const a=rnd(0,6.283);S.gems.push({x:p.x*.3+Math.cos(a)*40,y:p.y*.3+Math.sin(a)*40,v:1});}
    if(Math.random()<.3)S.items.push({k:'heal',x:0,y:0,life:9999,t:0});
    if(d.cur.type==='normal'&&Math.random()<.2)S.gems.push({x:0,y:-30,chest:true});
    S.dgTotal=(S.dgTotal||0)+1;
    if(d.cur.type==='boss'){d.cur.stairs=true;d.stairs=true;toast(S.floor>=FLOORS.length-1?'마지막 보스 처치! 계단으로 나가세요':'보스 처치! 계단이 열렸어요');}}
  // doors: push against an open doorway to move
  const minX=-RW/2+WALL+p.r,maxX=RW/2-WALL-p.r,minY=-RH/2+WALL+p.r,maxY=RH/2-WALL-p.r,open=roomOpen();
  const tryDoor=(k)=>{const n=roomAt(d.cur.x+DIRS[k][0],d.cur.y+DIRS[k][1]);if(n&&open)enterRoom(n,k);};
  if(p.y<=minY+.5&&Math.abs(p.x)<DOOR/2)tryDoor('n');else if(p.y>=maxY-.5&&Math.abs(p.x)<DOOR/2)tryDoor('s');
  else if(p.x<=minX+.5&&Math.abs(p.y)<DOOR/2)tryDoor('w');else if(p.x>=maxX-.5&&Math.abs(p.y)<DOOR/2)tryDoor('e');
  // pedestals (treasure / shop)
  d.buyCD=Math.max(0,d.buyCD-dt);
  for(const it of d.cur.items){if(it.taken||d2(it,p)>24*24)continue;
    if(S.gem<it.price){if(d.buyCD<=0){toast(`◆${it.price}이 필요해요`);d.buyCD=1.5;}continue;}
    S.gem-=it.price;it.taken=true;
    if(it.heart){const h=R(p.maxhp*.35);p.hp=Math.min(p.maxhp,p.hp+h);toast(`체력 +${h}`);}
    else{const r=giveItem(it.id);showPop(it.id,r.merged,r.sold);toast(`${ITEMS[it.id].name}: ${EVO_TXT[it.id]}`);}}
  d.cur.items=d.cur.items.filter(it=>!it.taken);
  // stairs
  if(d.stairs&&Math.hypot(p.x,p.y)<22)nextFloor();
  // basic attack
  d.fireT-=dt;const dir=aimDir();
  if(dir&&d.fireT<=0&&(!open||aim.on||mouseAim.on||keys['arrowleft']||keys['arrowright']||keys['arrowup']||keys['arrowdown'])){d.fireT=1/st.rate;fireTears(dir[0],dir[1]);}
  // tears
  for(const b of S.tears){b.age+=dt;b.life-=dt;
    if(v.homing&&!b.child){const t=nearestEnemiesFrom(b,1,220)[0];if(t){const want=Math.atan2(t.y-b.y,t.x-b.x),cur=Math.atan2(b.vy,b.vx);let df=((want-cur+Math.PI*3)%(Math.PI*2))-Math.PI;const na=cur+Math.max(-v.homing*dt*3,Math.min(v.homing*dt*3,df)),sp=Math.hypot(b.vx,b.vy);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;}}
    if(v.boomer&&!b.child&&b.age>st.range*.55){const dx=p.x-b.x,dy=p.y-b.y,l=Math.hypot(dx,dy)||1,sp=Math.hypot(b.vx,b.vy);b.vx=dx/l*sp;b.vy=dy/l*sp;if(l<14)b.life=0;}
    let ox=0,oy=0;if(v.wave&&!b.child){const w=Math.sin(b.age*14)*(10+4*v.wave),l=Math.hypot(b.vx,b.vy)||1;ox=-b.vy/l*w;oy=b.vx/l*w;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.dx=ox;b.dy=oy;
    const hx=b.x+ox,hy=b.y+oy,rr0=b.r*(1+v.grow*b.age*.6);
    if(v.zap&&!b.child){b.zapT-=dt;if(b.zapT<=0){b.zapT=.25;const t=nearestEnemiesFrom({x:hx,y:hy},1,70)[0];if(t){S.fx.push({k:'zap',x1:hx,y1:hy,x2:t.x,y2:t.y,life:.12});hurt(t,b.dmg*.3*v.zap,'#c79bff',true);}}}
    if(v.spikes&&!b.child){b.spikeT-=dt;if(b.spikeT<=0){b.spikeT=.12;S.fx.push({k:'dboom',x:hx,y:hy,t:.05,max:.06,r:16+3*v.spikes,dmg:b.dmg*.35*v.spikes,col:'#73eff7',spike:true,freeze:v.spikes>=3});}}
    if(Math.abs(hx)>RW/2-WALL||Math.abs(hy)>RH/2-WALL){if(v.boomer&&!b.child&&!b.returned){b.returned=true;b.age=st.range;}else b.life=0;}
    if(b.life<=0)continue;
    for(const e of near(hx,hy,rr0+30)){if(e.dead||b.hit.has(e))continue;const rr=e.r+rr0;if((e.x-hx)**2+(e.y-hy)**2>rr*rr)continue;b.hit.add(e);tearHit(b,e);if(--b.pierce<0){b.life=0;break;}}

  S.tears=S.tears.filter(b=>b.life>0);
  // orbiting ice shields block enemy bullets
  if(v.orbit){d.orbA+=dt*3.2;for(let i=0;i<v.orbit;i++){const a=d.orbA+i/v.orbit*6.283,ox=p.x+Math.cos(a)*36,oy=p.y+Math.sin(a)*36;
      for(const b of S.eproj){if((b.x-ox)**2+(b.y-oy)**2<14*14)b.life=0;}
      for(const e of near(ox,oy,30)){if(e.dead||e.orbT>S.t)continue;if((e.x-ox)**2+(e.y-oy)**2<(e.r+8)**2){e.orbT=S.t+.4;hurt(e,7*v.dmgMul,'#73eff7');}}}}

  if(v.scythe&&!roomOpen()){d.scyT=(d.scyT??3)-dt;if(d.scyT<=0){d.scyT=3.5-.5*v.scythe;doScythe(7*v.dmgMul*4,.12+.05*v.scythe);}}
  if(v.eclipse&&!roomOpen()){d.eclT=(d.eclT??2.5)-dt;if(d.eclT<=0){d.eclT=2.5;S.eclW=!S.eclW;doEclipse(7*v.dmgMul*3,100+15*v.eclipse,S.eclW);}}
  if(v.turret){d.turretT-=dt;if(d.turretT<=0&&!roomOpen()){d.turretT=v.turret;S.turrets.push({x:p.x,y:p.y,life:6,zt:0,dmg:7*v.dmgMul*1.2,star:1});}}
}
function nearestEnemiesFrom(o,n,maxR){const m2=maxR*maxR,arr=[];for(const e of near(o.x,o.y,maxR)){if(e.dead||e.type==='goldgob')continue;const q=d2(e,o);if(q<m2)arr.push([q,e]);}arr.sort((a,b)=>a[0]-b[0]);return arr.slice(0,n).map(a=>a[1]);}

  if(DG()){const raw=Math.max(.6,Math.min(1.6,Math.min(W/(RW+24),(H-200)/(RH+24))));const kpx=Math.max(1,Math.floor(2*raw*DPR));SC=kpx/(2*DPR);}
  else{const raw=Math.max(.7,Math.min(1.5,Math.min(W,H)/420)),kpx=Math.max(1,Math.round(2*raw*DPR));SC=kpx/(2*DPR);}

function drawMinimap(){

  for(let i=0;i<bands.length;i++){g.fillStyle=bands[i];g.fillRect(0,Math.floor(h*.62*i/bands.length),w,Math.ceil(h*.62/bands.length)+1);}
  for(let i=0;i<90;i++){const x=Math.floor(hash(i,1)*w),y=Math.floor(hash(i,2)*h*.55),on=Math.sin(t*(.6+hash(i,3)*1.5)+i)>-.3;if(!on)continue;g.fillStyle=hash(i,4)<.2?'#ffcd75':'#f4f4f4';g.fillRect(x,y,1,1);if(hash(i,5)<.08){g.fillRect(x-1,y,3,1);g.fillRect(x,y-1,1,3);}}
  const mx=Math.floor(w*.78),my=Math.floor(h*.15),mr=Math.max(5,Math.floor(Math.min(w,h)*.075));
  g.fillStyle='rgba(59,93,201,.18)';for(let r=mr*3;r>mr;r-=Math.max(2,Math.floor(mr*.5))){g.beginPath();g.arc(mx,my,r,0,6.283);g.fill();}
  for(let y=-mr;y<=mr;y++)for(let x=-mr;x<=mr;x++){const d=x*x+y*y;if(d<=mr*mr){const fl=performance.now()-moonFlash<160;g.fillStyle=d>(mr-1)*(mr-1)?(fl?'#f2a93b':'#94b0c2'):(fl?'#ffcd75':'#f4f4f4');g.fillRect(mx+x,my+y,1,1);}}
  g.fillStyle='#94b0c2';g.fillRect(mx-Math.floor(mr*.4),my-Math.floor(mr*.2),2,2);g.fillRect(mx+Math.floor(mr*.3),my+Math.floor(mr*.3),2,1);
  const hill=(base,amp,col,f,ph)=>{g.fillStyle=col;for(let x=0;x<w;x++){const y=Math.floor(h*base+Math.sin(x*f*q+ph)*amp/q+Math.sin(x*f*q*2.3+ph*1.7)*amp*.4/q);g.fillRect(x,y,1,h-y);}};
  hill(.5,22,'#29366f',.006,1);hill(.57,18,'#1f2944',.009,4);
  g.fillStyle='#1f2944';for(let i=0;i<14;i++){const x=Math.floor(hash(i,9)*w),base=Math.floor(h*.57+Math.sin(x*q*.009+4)*18/q+Math.sin(x*q*.009*2.3+6.8)*7.2/q),th=Math.floor((26+hash(i,8)*30)/q);for(let yy=0;yy<th;yy++){const hw2=Math.floor(yy*.32);g.fillRect(x-hw2,base-th+yy,hw2*2+1,1);}}
  hill(.64,12,'#1a1c2c',.012,2);
  for(let i=0;i<9;i++){if(Math.sin(t*1.5+i)<-.5)continue;g.fillStyle='#ffcd75';g.fillRect(Math.floor(hash(i,61)*w),Math.floor(h*.6+hash(i,62)*h*.08),1,1);}
  for(const f of FF){const x=Math.floor(((f.x*w+Math.sin(t*f.sp+f.ph)*6+t*3)%w+w)%w),y=Math.floor(f.y*h*.9),on=Math.sin(t*2*f.sp+f.ph);if(on<0)continue;g.fillStyle=on>.5?'#a7f070':'#38b764';g.fillRect(x,y,1,1);}
  ctx.imageSmoothingEnabled=false;ctx.drawImage(titleCv,0,0,w*q,h*q);
}

// ---------- hud ----------
let lastHud='';
function hud(){
  if(!S)return;
  const p=S.p,g=Math.floor(S.gem),c=Math.min(...S.shop.filter(Boolean).map(priceOf),99);
  const key=[DG()?S.floor:0,R(S.shield||0),R(p.maxhp),Math.floor(S.t),g,S.kills,c,S.newStock,S.lv,Math.floor(S.xp)].join('|');
  if(key===lastHud)return;lastHud=key;
  el.hpbar.style.width=(100*p.hp/p.maxhp)+'%';
  el.shbar.style.width=(100*Math.min(1,(S.shield||0)/p.maxhp))+'%';
  el.xpbar.style.width=(100*S.xp/xpNeed(S.lv))+'%';
  el.lvl.textContent=`Lv.${S.lv}`;
  el.hptext.textContent=`${R(p.hp)} / ${R(p.maxhp)}`;
  el.timer.textContent=DG()?`${S.floor+1}층`:fmt(S.t);
  el.gems.textContent=`◆ ${g}`;
  el.kills.textContent=`처치 ${S.kills}`;
  el.cost.textContent=DG()?'배치':c<99?`◆ ${c}~`:'품절';el.drawBtn.querySelector('span').textContent=DG()?'가방':'상점';
  el.drawBtn.classList.toggle('poor',g<c);
  let dot=el.drawBtn.querySelector('.dot');
  if(S.newStock&&!dot){dot=document.createElement('span');dot.className='dot';el.drawBtn.appendChild(dot);}
  else if(!S.newStock&&dot)dot.remove();
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
  if(mode==='play')for(let i=0;i<speedMul&&mode==='play';i++)update(dt);
  if(mode==='play'&&S&&S.perkQ>0)showPerk();
  if(popT>0){popT-=dt;if(popT<=0)el.pop.classList.remove('show');}
  if(toastT>0){toastT-=dt;if(toastT<=0)el.toast.classList.remove('show');}
  render();hud();
  el.overlay.classList.toggle('title',mode==='title');
  $('app').classList.toggle('titlemode',mode==='title');
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
})();
</script>
