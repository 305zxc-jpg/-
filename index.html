<title>별빛 소환사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: full-bleed canvas field, HUD pinned to the top, spell tray + summon button pinned to the bottom. Single deliberate night theme. */
:root{
  --night:#0f1226;
  --ink:#ece9ff;
  --muted:#9d9ac8;
  --gold:#ffcf5a;
  --panel:rgba(22,24,52,.86);
  --line:rgba(170,160,255,.22);
  --fire:#ff7a45;
  --frost:#6fd3ff;
  --storm:#c79bff;
  --nature:#7ee08a;
  --hp:#ff5d7a;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--display);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#hud{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
.bars{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.xpwrap{height:6px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden}
#xpbar{height:100%;width:0;background:linear-gradient(90deg,#8fd0ff,#c79bff);transition:width .2s}
#lvl{color:#8fd0ff}
.hpwrap{position:relative;height:18px;border-radius:9px;background:rgba(0,0,0,.45);border:1px solid var(--line);overflow:hidden}
#hpbar{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#ff3d64,var(--hp));transition:width .15s}
#hptext{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;text-shadow:0 1px 2px #000}
#timer{font-size:22px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#pauseBtn{pointer-events:auto;width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.stat{font-size:15px;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
#gems{color:var(--gold)}
#kills{color:var(--muted)}
#syn{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid currentColor;opacity:.55}
.pill.on{opacity:1;background:rgba(0,0,0,.6);box-shadow:0 0 10px -2px currentColor}

#tray{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:stretch;justify-content:center;background:linear-gradient(to top,rgba(10,11,28,.95),rgba(10,11,28,.6) 70%,transparent)}
#slots{display:grid;grid-template-columns:repeat(5,minmax(0,54px));gap:5px;min-width:0;align-content:center}
.slot{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;background:rgba(255,255,255,.04);border:1.5px dashed var(--line);display:grid;place-items:center;font-size:24px;padding:0}
.slot.full{border-style:solid;border-color:var(--tc);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tc) 28%,transparent),rgba(0,0,0,.35))}
.slot .st{position:absolute;bottom:1px;left:0;right:0;font-size:10px;color:var(--gold);letter-spacing:-1px;text-align:center}
.slot .rr{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%}
.slot.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
#drawBtn{min-width:80px;border-radius:16px;background:linear-gradient(160deg,#ffd970,#ff9f43);color:#2a1600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 #b4621a,0 0 18px rgba(255,190,80,.4);font-size:20px;padding:6px 10px}
#drawBtn b{font-size:14px;font-weight:normal;background:rgba(0,0,0,.18);border-radius:99px;padding:1px 8px}
#drawBtn:disabled{filter:grayscale(.8) brightness(.6);box-shadow:0 4px 0 #333}
#drawBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b4621a}
#drawBtn{position:relative}
#drawBtn.poor{filter:saturate(.45) brightness(.8)}
#drawBtn .dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--hp);border:2px solid var(--night)}
.shop{gap:10px}
.shophead{display:flex;justify-content:space-between;align-items:center}
.lvrow{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border-radius:12px;padding:6px 6px 6px 12px;text-align:left}
.lvrow .lv{font-size:16px;color:var(--gold);flex:none}
.lvrow .odds{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 8px;font-size:11px;font-variant-numeric:tabular-nums}
.lvrow .nx{flex:none;font-size:11px;color:var(--muted);text-align:right;line-height:1.3}
.bal{color:var(--gold);font-size:24px;font-variant-numeric:tabular-nums}
.card p.small{font-size:13px;line-height:1.4}
.offers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.offer{position:relative;border-radius:14px;padding:8px 3px 6px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--tc) 22%,transparent),rgba(0,0,0,.35));border:1.5px solid var(--tc);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:118px;min-width:0}
.offer .ic{font-size:26px;line-height:1.1}
.offer .nm{font-size:12px;line-height:1.2;word-break:keep-all}
.offer .meta{font-size:10px}
.offer .bd{font-size:10px;color:var(--muted);line-height:1.25;word-break:keep-all}
.offer .sy{font-size:10px;line-height:1.2;word-break:keep-all}
.offer.myth{background:radial-gradient(circle at 50% 30%,rgba(255,107,214,.35),rgba(80,40,140,.35));border-color:#ff6bd6;animation:myth 2s linear infinite}
@keyframes myth{0%,100%{box-shadow:0 0 14px -2px #ff6bd6}50%{box-shadow:0 0 22px 0 #8fd0ff}}
.offer.merge{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(255,207,90,.5)}
.offer.merge .bd{color:var(--gold)}
.offer .pr{margin-top:auto;font-size:12px;background:rgba(0,0,0,.35);border-radius:99px;padding:1px 7px;color:var(--gold)}
.offer:disabled{opacity:.45;cursor:default}
.offer.empty{border-style:dashed;border-color:var(--line);background:none;color:var(--muted);justify-content:center;font-size:11px;word-break:keep-all}
.offer.empty b{color:var(--gold);font-weight:normal}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.cell{aspect-ratio:1;border-radius:10px;font-size:22px;background:rgba(255,255,255,.04);border:1.5px dashed var(--line);position:relative;padding:0;max-width:100%;transition:transform .1s}
.cell.has{border-style:solid;border-color:var(--tc);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tc) 24%,transparent),rgba(0,0,0,.35))}
.eq .cell{border-width:2px}
.eq .cell.has{box-shadow:0 0 12px -3px var(--tc)}
.cell.sel{outline:2px solid var(--gold);outline-offset:1px;transform:scale(.92)}
.cell.target:not(.sel){border-color:rgba(255,207,90,.45)}
.cell small{position:absolute;bottom:1px;left:0;right:0;font-size:9px;color:var(--gold);letter-spacing:-1px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;text-align:left;margin-bottom:-4px}
.lbl span{font-size:12px;color:var(--muted)}
.act{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:14px;background:rgba(0,0,0,.3);border-radius:12px;padding:6px 6px 6px 12px;text-align:left;min-height:44px;box-sizing:border-box}
.act .ghost{padding:7px 10px;font-size:14px;flex:none}
.act p{font-size:12px}
.ghost.on{border-color:var(--gold);color:var(--gold)}
.ghost:disabled{opacity:.45}

#pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;background:var(--panel);border:2px solid var(--tc,var(--line));border-radius:18px;padding:14px 22px;text-align:center;min-width:160px;box-shadow:0 0 30px -6px var(--tc,transparent)}
#pop.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#pop .ic{font-size:40px}
#pop .nm{font-size:20px}
#pop .sub{font-size:13px;color:var(--muted)}
#pop .mg{font-size:16px;color:var(--gold)}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translateX(-50%);font-size:15px;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}

#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,9,24,.72);backdrop-filter:blur(3px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 20px;width:min(380px,100%);max-height:calc(100% - 40px);overflow:auto;display:flex;flex-direction:column;gap:12px;text-align:center}
.card h1{margin:0;font-size:34px;font-weight:normal;color:var(--gold);text-shadow:0 0 18px rgba(255,207,90,.45);text-wrap:balance}
.card h2{margin:0;font-size:24px;font-weight:normal;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.how{display:grid;gap:8px;text-align:left;font-size:14px;line-height:1.45}
.how div{display:flex;gap:10px;align-items:flex-start}
.how span:first-child{font-size:20px;line-height:1.1;width:26px;text-align:center;flex:none}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left;font-size:12px}
.traits div{border:1px solid currentColor;border-radius:10px;padding:6px 8px;line-height:1.4}
.traits small{color:var(--ink);opacity:.8;display:block}
.big{font-size:20px;padding:12px;border-radius:14px;background:linear-gradient(160deg,#ffd970,#ff9f43);color:#2a1600;box-shadow:0 4px 0 #b4621a}
.ghost{font-size:16px;padding:10px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.btns{display:flex;gap:8px}
.btns button{flex:1}
.statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statsgrid div{background:rgba(0,0,0,.3);border-radius:12px;padding:8px;font-variant-numeric:tabular-nums}
.statsgrid b{display:block;font-weight:normal;font-size:22px}
.statsgrid span{font-size:12px;color:var(--muted)}
.info-ic{font-size:52px;line-height:1}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid currentColor;margin:0 2px}
.desc{background:rgba(0,0,0,.3);border-radius:12px;padding:10px;font-size:14px;line-height:1.5;text-align:left}
.desc .nx{color:var(--muted);font-size:13px}
.spl{font-size:13px;color:var(--muted);margin-top:4px}
.spl.on{color:var(--gold)}
/* ---- polish layer ---- */
.hpwrap{height:17px;border-radius:9px;background:linear-gradient(#0b0c1e,#1a1c3a);border:1.5px solid rgba(255,140,160,.35);box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4)}
#hpbar{background:linear-gradient(180deg,#ff94a8 0%,#ff4d6d 55%,#cf2749 100%);box-shadow:0 0 10px rgba(255,77,109,.6)}
#hpbar::after{content:"";position:absolute;left:5px;right:5px;top:2px;height:4px;border-radius:3px;background:rgba(255,255,255,.32)}
.hpwrap::before{content:"♥";position:absolute;left:7px;top:50%;transform:translateY(-54%);font-size:11px;color:#fff;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#hptext{z-index:1}
.xpwrap{height:7px;background:#0b0c1e;border:1px solid rgba(143,208,255,.28)}
#xpbar{background:linear-gradient(90deg,#5ec8ff,#b48cff);box-shadow:0 0 8px rgba(143,208,255,.7)}
#timer{font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 14px rgba(160,150,255,.5)}
#pauseBtn{background:linear-gradient(180deg,rgba(64,68,138,.92),rgba(24,26,60,.92));border:1px solid rgba(190,180,255,.35);box-shadow:0 2px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14)}
.stat{font-size:14px;padding:3px 10px;border-radius:99px;background:rgba(10,12,32,.66);border:1px solid rgba(170,160,255,.2);text-shadow:none}
#lvl{color:#a6e0ff;border-color:rgba(143,208,255,.45)}
#gems{border-color:rgba(255,207,90,.45)}
#tray{background:linear-gradient(to top,rgba(7,8,22,.97),rgba(7,8,22,.72) 62%,transparent)}
.slot{border-radius:13px;background:rgba(255,255,255,.03);border:1.5px dashed rgba(170,160,255,.25);text-shadow:0 2px 3px rgba(0,0,0,.55)}
.slot.full,.cell.has{border:2px solid var(--tc);background:radial-gradient(circle at 50% 32%,color-mix(in srgb,var(--tc) 38%,transparent),rgba(8,9,24,.92) 78%);box-shadow:0 0 14px -4px var(--tc),inset 0 1px 0 rgba(255,255,255,.2),inset 0 -6px 10px rgba(0,0,0,.4);text-shadow:0 2px 3px rgba(0,0,0,.55)}
.slot .st{bottom:-7px;left:50%;right:auto;transform:translateX(-50%);background:#1b1533;border:1px solid rgba(255,207,90,.55);border-radius:99px;padding:0 5px;font-size:9px;line-height:13px;white-space:nowrap}
.slot .rr{box-shadow:0 0 6px currentColor}
#drawBtn{border-radius:18px;background:linear-gradient(180deg,#ffe48a 0%,#ffb84d 55%,#ef8722 100%);box-shadow:0 4px 0 #a5520f,0 0 22px rgba(255,180,70,.45),inset 0 2px 0 rgba(255,255,255,.55);text-shadow:0 1px 0 rgba(255,255,255,.45)}
#drawBtn:active{box-shadow:0 1px 0 #a5520f,inset 0 2px 0 rgba(255,255,255,.55)}
#overlay{background:radial-gradient(ellipse at 50% 40%,rgba(20,24,62,.62),rgba(4,5,16,.86))}
#app.titlemode #hud,#app.titlemode #tray{visibility:hidden}
.titlecard{background:linear-gradient(180deg,rgba(30,34,80,.72),rgba(12,14,36,.82));backdrop-filter:blur(4px);align-self:end;margin-bottom:max(28px,env(safe-area-inset-bottom,0px))}
.best{color:var(--gold)!important}
.rules{text-align:left;display:flex;flex-direction:column;gap:10px}
.rules summary{cursor:pointer;color:#c9c4ff;font-size:15px;text-align:center;list-style:none;padding:6px;border-radius:10px;border:1px solid rgba(190,180,255,.25)}
.rules summary::-webkit-details-marker{display:none}
.rules[open] summary{margin-bottom:10px}
.rules .traits{margin-top:10px}
#overlay.title{background:linear-gradient(180deg,rgba(6,8,24,.15),rgba(6,8,24,.5));backdrop-filter:none}
.card{background:linear-gradient(180deg,rgba(40,44,96,.95),rgba(15,17,42,.97));border:1px solid rgba(190,180,255,.28);box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.card h1{font-size:42px;background:linear-gradient(180deg,#fff7cc,#ffcf5a 45%,#ff983a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a2a00) drop-shadow(0 0 16px rgba(255,190,80,.45));text-shadow:none;letter-spacing:.02em;line-height:1.15}
.kicker{font-size:12px;letter-spacing:.28em;color:#aab5ff;margin-bottom:-6px}
.big{background:linear-gradient(180deg,#ffe48a,#ffb84d 55%,#ef8722);box-shadow:0 4px 0 #a5520f,inset 0 2px 0 rgba(255,255,255,.55),0 8px 20px rgba(255,160,60,.25);text-shadow:0 1px 0 rgba(255,255,255,.45)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #a5520f,inset 0 2px 0 rgba(255,255,255,.55)}
.ghost{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.offer{background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--tc) 32%,transparent),rgba(10,11,30,.92) 80%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -8px 14px rgba(0,0,0,.38)}
.offer .ic,#pop .ic,.info-ic{filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.lvrow,.act,.desc,.statsgrid div{background:rgba(6,7,20,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
#toast{background:linear-gradient(180deg,rgba(44,48,104,.94),rgba(18,20,48,.94));border:1px solid rgba(190,180,255,.3);box-shadow:0 6px 20px rgba(0,0,0,.45)}
#pop{background:linear-gradient(180deg,rgba(40,44,96,.96),rgba(15,17,42,.97))}
.pill.on{background:rgba(8,9,24,.7)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="row">
      <div class="bars"><div class="hpwrap"><div id="hpbar"></div><span id="hptext">100 / 100</span></div><div class="xpwrap"><div id="xpbar"></div></div></div>
      <div id="timer">00:00</div>
      <button id="pauseBtn" aria-label="일시정지">❚❚</button>
    </div>
    <div class="row"><span class="stat" id="lvl">Lv.1</span><span class="stat" id="gems">◆ 0</span><span class="stat" id="kills">처치 0</span></div>
    <div id="syn"></div>
  </div>
  <div id="toast"></div>
  <div id="pop"></div>
  <div id="tray">
    <div id="slots"></div>
    <button id="drawBtn" aria-label="상점 열기"><span>상점</span><b id="cost">◆ 3~</b></button>
  </div>
  <div id="overlay"></div>
</div>

<script>
(()=>{
'use strict';
// ---------- data ----------
const TRAITS={
  fire:{name:'화염',color:'#ff7a45',fx:['모든 피해 +30%','피해 +60%, 처치한 적이 폭발']},
  frost:{name:'냉기',color:'#6fd3ff',fx:['맞은 적 40% 둔화','60% 둔화, 둔화된 적 받는 피해 +30%']},
  storm:{name:'폭풍',color:'#c79bff',fx:['재사용 대기 -25%','-40%, 25% 확률로 한 번 더 발동']},
  nature:{name:'자연',color:'#7ee08a',fx:['초당 2 회복, 최대 체력 +30','초당 5 회복, 체력 +80, 이동 +10%']},
};
const RAR=[{name:'일반',col:'#a9a6d0'},{name:'희귀',col:'#5aa8ff'},{name:'전설',col:'#ffcf5a'},{name:'신화',col:'#ff6bd6'}];
const M=[0,1,1.8,3.2];
const R=n=>Math.round(n);
const ITEMS={
  firebolt:{name:'불꽃탄',icon:'🔥',trait:'fire',rar:0,w:1,desc:s=>`가장 가까운 적 ${s}명에게 불꽃을 쏩니다. 피해 ${R(13*M[s])}`},
  meteor:{name:'운석 낙하',icon:'☄️',trait:'fire',rar:2,w:1,desc:s=>`적 무리 위에 운석 ${s}개를 떨어뜨립니다. 범위 피해 ${R(45*M[s])}`},
  fireorb:{name:'화염 구슬',icon:'🔮',trait:'fire',rar:2,w:0,desc:s=>`모든 피해 +${[0,12,25,45][s]}%`},
  frostring:{name:'서리 고리',icon:'❄️',trait:'frost',rar:0,w:1,desc:s=>`얼음 조각 ${2+s}개가 주위를 돕니다. 피해 ${R(7*M[s])}`},
  lance:{name:'얼음 창',icon:'🧊',trait:'frost',rar:1,w:1,desc:s=>`움직이는 방향으로 관통하는 창 ${s}개. 피해 ${R(20*M[s])}`},
  frostarmor:{name:'서리 갑옷',icon:'🛡️',trait:'frost',rar:1,w:0,desc:s=>`받는 피해 -${[0,12,22,35][s]}%`},
  chain:{name:'연쇄 번개',icon:'⚡',trait:'storm',rar:1,w:1,desc:s=>`번개가 적 ${2+s}명 사이를 튑니다. 피해 ${R(15*M[s])}`},

      out.push(nw);found=true;break;}}

// ---------- helpers ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
const d2=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy};
const CELL=64;let grid=new Map();
function buildGrid(){grid=new Map();for(const e of S.enemies){const k=((e.x/CELL)|0)+','+((e.y/CELL)|0);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(e);}}
function near(x,y,r){
  const out=[],x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let i=x0;i<=x1;i++)for(let j=y0;j<=y1;j++){
    // match truncation used in buildGrid for negatives
    const a=grid.get(i+','+j);if(a)for(const e of a)out.push(e);}
  return out;
}
// buildGrid uses |0 (truncate); use floor everywhere instead for consistency
function cellKey(x,y){return Math.floor(x/CELL)+','+Math.floor(y/CELL)}
buildGrid=function(){grid=new Map();for(const e of S.enemies){if(e.dead)continue;const k=cellKey(e.x,e.y);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(e);}};

function nearestEnemies(n,maxR){
  const p=S.p,m2=maxR*maxR,arr=[];
  for(const e of S.enemies){if(e.dead)continue;const q=d2(e,p);if(q<m2)arr.push([q,e]);}
  arr.sort((a,b)=>a[0]-b[0]);return arr.slice(0,n).map(a=>a[1]);
}
function inView(){const hw=W/2/SC,hh=H/2/SC,p=S.p;return S.enemies.filter(e=>!e.dead&&Math.abs(e.x-p.x)<hw&&Math.abs(e.y-p.y)<hh);}
function addText(x,y,txt,col){if(S.texts.length>70)S.texts.shift();S.texts.push({x:x+rnd(-6,6),y,txt,col,life:.7,big:typeof txt==='number'&&txt>=40});}
function burst(x,y,trait,n){const c=TRAITS[trait].color;for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(60,220);S.fx.push({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,.7),col:c});}}

function hurt(e,dmg,col){
  if(e.dead)return false;
  dmg*=st.dmg;if(e.slowT>0)dmg*=st.amp;if(e.frozenT>0&&st.zeroAmp)dmg*=1.5;e.hp-=dmg;e.flash=.08;
  if(st.slow)e.slowT=1.2;
  if(st.ignite&&Math.random()<st.ignite){e.burnT=3;e.burnD=Math.max(e.burnD||0,dmg*.35);}
  addText(e.x,e.y-e.r,R(dmg),col);
  if(e.hp<=0){kill(e);return true;}
  return false;
}
const scale=()=>1+S.t/150;
function boom(x,y,r,dmg,col){if(S.blasts.length<150)S.blasts.push({x,y,r,dmg,col});}
function shards(x,y,n,dmg,col,pierce=0,a0=Math.random()*6.283){
  for(let i=0;i<n;i++){const a=a0+i*6.283/n;S.proj.push({k:'shard',x,y,vx:Math.cos(a)*360,vy:Math.sin(a)*360,r:5,dmg,life:.7,pierce,hit:new Set(),col});}
}
function zone(x,y,r,life,dmg,col,kind){if(S.zones.length<60)S.zones.push({x,y,r,life,max:life,dmg,col,tick:0,kind});}
function freezeIn(x,y,r,t){for(const e of near(x,y,r+30)){if(e.dead)continue;if(d2(e,{x,y})<(r+e.r)**2)e.frozenT=Math.max(e.frozenT||0,t);}}
function kill(e){
  e.dead=true;S.kills++;
  if(S.fx.length<700){S.fx.push({k:'puff',x:e.x,y:e.y,r:e.r,life:.35,col:ETYPES[e.type].col});for(let i=0;i<4;i++){const a=rnd(0,6.283),v=rnd(40,140);S.fx.push({k:'spark',x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.25,.5),col:ETYPES[e.type].col});}}
  if(e.type==='elite')shake(7);
  if(st.shatter&&e.frozenT>0)boom(e.x,e.y,55,16*scale(),'#bdf0ff');
  if(st.blast&&S.blasts.length<120)S.blasts.push({x:e.x,y:e.y});
  if(e.type==='elite'){S.gems.push({x:e.x,y:e.y,chest:true});burst(e.x,e.y,'fire',30);}
  else{const dp=Math.max(.02,.3*Math.exp(-S.t/150)); // drop chance falls as hordes grow
    if(e.type==='golem'){if(Math.random()<Math.min(1,dp*1.5))S.gems.push({x:e.x,y:e.y,v:3,big:true});}
    else if(Math.random()<dp)S.gems.push({x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),v:1});}
  if(S.gems.length>500){ // fold oldest gems into one to keep things fast
    let sum=0;const keep=[];for(let i=0;i<S.gems.length;i++){const g=S.gems[i];if(i<200&&!g.chest)sum+=g.v;else keep.push(g);}
    keep.push({x:S.p.x+rnd(-200,200),y:S.p.y+rnd(-200,200),v:sum,big:true});S.gems=keep;}
}

// ---------- enemies ----------
const ETYPES={
  slime:{hp:12,sp:55,r:11,dmg:5,col:'#6bd36b'},
  bat:{hp:7,sp:105,r:8,dmg:4,col:'#b07cff'},
  golem:{hp:60,sp:38,r:18,dmg:11,col:'#c9a27a'},
  elite:{hp:450,sp:62,r:26,dmg:22,col:'#ff5d7a'},
};
function spawn(type){
  const t=S.t;
  if(!type){const r=Math.random();type=t<45?'slime':t<120?(r<.7?'slime':'bat'):(r<.45?'slime':r<.75?'bat':'golem');}
  const T=ETYPES[type],a=rnd(0,6.283),dist=Math.hypot(W,H)/2/SC+40;
  const sc=1+t/70;
  S.enemies.push({type,x:S.p.x+Math.cos(a)*dist,y:S.p.y+Math.sin(a)*dist,hp:T.hp*sc,max:T.hp*sc,sp:T.sp*(type==='bat'?1:1+t/1200),r:T.r,dmg:T.dmg*(1+t/400),col:T.col,flash:0,slowT:0,ringT:0,thornT:0,wob:rnd(0,6)});
}

// ---------- field items ----------
const FIELD={
  heal:{icon:'❤️',col:'255,93,122',w:3},
  magnet:{icon:'🧲',col:'143,208,255',w:2},
  bomb:{icon:'💣',col:'255,150,60',w:2},
  bag:{icon:'💰',col:'255,207,90',w:3},
};
function spawnItem(){
  const keys=Object.keys(FIELD),tot=keys.reduce((a,k)=>a+FIELD[k].w,0);let r=Math.random()*tot,k=keys[0];
  for(const kk of keys){r-=FIELD[kk].w;if(r<0){k=kk;break;}}
  const a=rnd(0,6.283),d=Math.max(120,rnd(140,Math.min(W,H)/2/SC-30));
  S.items.push({k,x:S.p.x+Math.cos(a)*d,y:S.p.y+Math.sin(a)*d,life:35,t:rnd(0,6)});
  if(S.items.length>6)S.items.shift();
}
function useItem(f){
  const p=S.p;
  if(f.k==='heal'){const v=R(p.maxhp*.35);p.hp=Math.min(p.maxhp,p.hp+v);addText(p.x,p.y-30,'+'+v,'#7ee08a');toast('회복 물약! 체력 +'+v);}
  else if(f.k==='magnet'){for(const g of S.gems)g.mag=true;toast('자석! 모든 결정을 끌어와요');}
  else if(f.k==='bomb'){S.fx.push({k:'chill',life:.5,col:'255,170,80'});shake(9);for(const e of inView())hurt(e,60*(1+S.t/90),'#ffb04a');toast('폭탄! 화면의 적에게 큰 피해');}
  else if(f.k==='bag'){const v=12+Math.floor(S.t/60)*3;S.gem+=v;gainXp(v);toast(`결정 주머니! ◆ +${v}`);}
  S.fx.push({k:'nova',x:f.x,y:f.y,r:50,life:.35,col:FIELD[f.k].col});
}

// ---------- weapons ----------
function fireWeapon(it){
  const s=it.star,m=M[s],p=S.p;
  switch(it.id){
    case'firebolt':{const ts=nearestEnemies(s,520);if(!ts.length)return false;
      for(const e of ts){const a=Math.atan2(e.y-p.y,e.x-p.x);S.proj.push({k:'bolt',x:p.x,y:p.y,vx:Math.cos(a)*430,vy:Math.sin(a)*430,r:6,dmg:13*m,life:1.5,pierce:0,hit:new Set(),col:'#ff7a45',star:s});}return true;}
    case'lance':{const base=Math.atan2(p.fy,p.fx);
      for(let i=0;i<s;i++){const a=base+(i-(s-1)/2)*.18;S.proj.push({k:'lance',x:p.x,y:p.y,vx:Math.cos(a)*540,vy:Math.sin(a)*540,r:8,dmg:20*m,life:1.1,pierce:99,hit:new Set(),col:'#6fd3ff',a,star:s});}return true;}
    case'chain':{const v=inView();if(!v.length)return false;
      let cur=v[Math.floor(Math.random()*v.length)],from={x:p.x,y:p.y};const hit=new Set();
      const jumps=(2+s)*(s>=3?2:1);
      for(let i=0;i<jumps&&cur;i++){S.fx.push({k:'zap',x1:from.x,y1:from.y,x2:cur.x,y2:cur.y,life:.18});hit.add(cur);
        if(s>=3)cur.frozenT=Math.max(cur.frozenT||0,.4);if(s>=2)boom(cur.x,cur.y,40,6*m,'#c79bff');
        hurt(cur,15*m,'#c79bff');from=cur;
        let nb=null,bd=170*170;for(const e of near(cur.x,cur.y,170)){if(hit.has(e)||e.dead)continue;const q=d2(e,cur);if(q<bd){bd=q;nb=e;}}cur=nb;}return true;}
    case'whirl':{const t=nearestEnemies(1,500)[0];const base=t?Math.atan2(t.y-p.y,t.x-p.x):Math.atan2(p.fy,p.fx);
      for(let i=0;i<s;i++){const a=base+(i-(s-1)/2)*.5;S.proj.push({k:'boom',x:p.x,y:p.y,vx:Math.cos(a)*380,vy:Math.sin(a)*380,r:15,dmg:12*m,life:2.2,age:0,pierce:999,hitT:new Map(),col:'#c79bff',star:s});}return true;}
    case'sun':{const rad=150+20*s,hits=near(p.x,p.y,rad+30).filter(e=>!e.dead&&d2(e,p)<(rad+e.r)**2);if(!hits.length)return false;
      S.fx.push({k:'nova',x:p.x,y:p.y,r:rad,life:.45});shake(4);for(const e of hits)hurt(e,55*m,'#ffd23f');
      if(s>=2)shards(p.x,p.y,s>=3?12:6,15*m,'#ffb04a',1);return true;}
    case'zero':{const v=inView();if(!v.length)return false;S.fx.push({k:'chill',life:.5});
      for(const e of v){e.frozenT=1.2+.4*s;hurt(e,20*m,'#bdf0ff');}return true;}
    case'thunder':{const v=inView();if(!v.length)return false;
      for(let i=0;i<3+2*s;i++){const e=v[Math.floor(Math.random()*v.length)];if(e.dead)continue;S.fx.push({k:'zap',x1:e.x+rnd(-40,40),y1:e.y-320,x2:e.x,y2:e.y,life:.25});
        if(s>=2){let nb=null,bd=150*150;for(const o of near(e.x,e.y,150)){if(o===e||o.dead)continue;const q=d2(o,e);if(q<bd){bd=q;nb=o;}}
          if(nb){S.fx.push({k:'zap',x1:e.x,y1:e.y,x2:nb.x,y2:nb.y,life:.2});hurt(nb,17*m,'#e3c6ff');}}
        if(s>=3)boom(e.x,e.y,50,12*m,'#e3c6ff');
        hurt(e,28*m,'#e3c6ff');}return true;}
    case'meteor':{const v=inView();
      for(let i=0;i<s;i++){const e=v.length?v[Math.floor(Math.random()*v.length)]:null;
        S.fx.push({k:'meteor',x:e?e.x:p.x+rnd(-200,200),y:e?e.y:p.y+rnd(-200,200),t:.7,max:.7,r:75,dmg:45*m,star:s});}return true;}
  }
  return false;
}
const BASECD={firebolt:.8,lance:1.3,chain:1.5,whirl:2.2,meteor:2.6,sun:3,zero:6,thunder:1.2};

// ---------- update ----------
function update(dt){
  S.t+=dt;const p=S.p;
  // move
  let mx=0,my=0;
  if(keys['a']||keys['arrowleft'])mx--;if(keys['d']||keys['arrowright'])mx++;
  if(keys['w']||keys['arrowup'])my--;if(keys['s']||keys['arrowdown'])my++;
  if(joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>6){const k=Math.min(1,l/50);mx=dx/l*k;my=dy/l*k;}}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  if(ml>.05){p.fx=mx/Math.max(ml,1e-6);p.fy=my/Math.max(ml,1e-6);const n=Math.hypot(p.fx,p.fy);p.fx/=n;p.fy/=n;}
  p.x+=mx*st.speed*dt;p.y+=my*st.speed*dt;p.mv=ml;if(ml>.05){S.walk=(S.walk||0)+dt*11;if(Math.abs(mx)>.2)S.face=mx>0?1:-1;}
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*28);
  p.inv=Math.max(0,p.inv-dt);
  p.hp=Math.min(p.maxhp,p.hp+st.regen*dt);

  // spawn
  S.spawnAcc+=dt*(1.8+S.t/22);
  while(S.spawnAcc>=1){S.spawnAcc--;if(S.enemies.length<320)spawn();}
  if(S.t>=S.nextStock){S.nextStock+=RESTOCK;const intr=Math.min(5,Math.floor(S.gem/10));S.gem+=intr;
    if(!S.locked){restock();S.newStock=true;}
    toast(`${S.locked?'상점 잠금 유지':'상점에 새 물건이 들어왔어요'}${intr?` · 이자 ◆+${intr}`:''}`);}
  if(S.t>=S.nextItem){S.nextItem+=rnd(16,24);spawnItem();}
  if(S.t>=S.nextElite){S.nextElite+=75;spawn('elite');toast('강한 적이 나타났어요! 쓰러뜨리면 보물상자');}

  buildGrid();

  for(const it of S.eq){const I=ITEMS[it.id];if(!I.w||!BASECD[it.id])continue;
    it.cd-=dt;if(it.cd<=0){if(fireWeapon(it)){it.cd=BASECD[it.id]*st.cd;if(st.echo&&Math.random()<st.echo){fireWeapon(it);addText(S.p.x,S.p.y-34,'연속 발동!','#c79bff');}}else it.cd=.15;}}

  for(let n=0;n<60&&S.blasts.length;n++){const b=S.blasts.shift(),r=b.r||55,col=b.col||'#ffb04a';S.fx.push({k:'blast',x:b.x,y:b.y,life:.3,r,col});
    for(const e of near(b.x,b.y,r+30)){if(e.dead)continue;const rr=r+e.r;if(d2(e,b)<rr*rr)hurt(e,b.dmg||12*scale(),col);}}

  if(st.trail&&ml>.05){S.trailT=(S.trailT||0)-dt;if(S.trailT<=0){S.trailT=.3;zone(p.x,p.y,st.trail>=3?30:22,1.6,st.trail>=3?9:5,'199,155,255','wind');}}
  if(st.pulse){S.pulseT=(S.pulseT||10)-dt;if(S.pulseT<=0){S.pulseT=10;const v=R(p.maxhp*(st.pulse>=3?.15:.1));p.hp=Math.min(p.maxhp,p.hp+v);addText(p.x,p.y-30,'+'+v,'#7ee08a');
    S.fx.push({k:'nova',x:p.x,y:p.y,r:160,life:.5,col:'126,224,138'});
    for(const e of near(p.x,p.y,190)){if(e.dead)continue;const dx=e.x-p.x,dy=e.y-p.y,l=Math.hypot(dx,dy)||1;if(l<160+e.r){e.x+=dx/l*70;e.y+=dy/l*70;if(st.pulse>=3)hurt(e,30*scale(),'#7ee08a');}}}}
  // zones (burning ground, wind trail, twisters)
  for(const z of S.zones){z.life-=dt;z.tick-=dt;if(z.tick<=0){z.tick=.3;for(const e of near(z.x,z.y,z.r+30)){if(e.dead)continue;if(d2(e,z)<(z.r+e.r)**2)hurt(e,z.dmg,`rgb(${z.col})`);}}}

      for(let i=0;i<n;i++){const a=S.ringA+i*6.283/n,ox=p.x+Math.cos(a)*rad,oy=p.y+Math.sin(a)*rad;

      if(it.star>=3){it.shT=(it.shT||0)-dt;if(it.shT<=0){it.shT=2;for(let i=0;i<n;i++){const a=S.ringA+i*6.283/n;shards(p.x+Math.cos(a)*rad,p.y+Math.sin(a)*rad,1,8*M[3],'#bdf0ff',0,a);}}}}
    if(it.id==='thorns'){const rad=55+15*it.star;
      for(const e of near(p.x,p.y,rad+30)){if(e.dead||e.thornT>S.t)continue;const rr=rad+e.r;if(d2(e,p)<rr*rr){e.thornT=S.t+.35;if(it.star>=3)e.slowT=Math.max(e.slowT,.5);if(hurt(e,5*M[it.star],'#7ee08a')&&it.star>=2)shards(e.x,e.y,it.star>=3?8:4,6*M[it.star],'#7ee08a');}}}
  }

  // projectiles
  for(const b of S.proj){
    b.life-=dt;
    if(b.k==='boom'){b.age+=dt;if(b.age>.55&&!b.turned){b.turned=true;if(b.star>=2)b.r*=1.6;if(b.star>=3)zone(b.x,b.y,34,2,b.dmg*.5,'199,155,255','twister');}
      if(b.age>.55){const a=Math.atan2(p.y-b.y,p.x-b.x),sp=Math.min(520,380+b.age*200);b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;if(b.age>.7&&d2(b,p)<400)b.life=0;}}

  S.enemies=S.enemies.filter(e=>!e.dead);

  // gems
  const pr=st.pickup;
  for(const g of S.gems){
    const q=d2(g,p);
    if(g.mag||q<pr*pr){g.mag=true;const l=Math.sqrt(q)||1,sp=Math.max(260,600-l);g.x+=(p.x-g.x)/l*sp*dt;g.y+=(p.y-g.y)/l*sp*dt;}
    if(q<22*22){g.got=true;
      if(g.chest){S.gem+=20;gainXp(20);toast('보물상자! 무료 마법 + ◆20');freeSummon();}
      else{const v=g.v*(st.dbl&&Math.random()<st.dbl?2:1);S.gem+=v*st.gemMul;gainXp(v);}}
  }
  S.gems=S.gems.filter(g=>!g.got);
  for(const f of S.items){f.life-=dt;if(d2(f,p)<(p.r+16)**2){f.life=0;useItem(f);}}
  S.items=S.items.filter(f=>f.life>0);

  // fx
  for(const f of S.fx){
    if(f.k==='meteor'){f.t-=dt;if(f.t<=0&&!f.done){f.done=true;f.life=.35;
      for(const e of near(f.x,f.y,f.r+30)){const rr=f.r+e.r;if(d2(e,f)<rr*rr)hurt(e,f.dmg,'#ffb04a');}
      burst(f.x,f.y,'fire',22);shake(f.mini?1.5:3.5);
      if(!f.mini&&f.star>=2)zone(f.x,f.y,62,2.5,f.dmg*.12,'255,120,40','fire');
      if(!f.mini&&f.star>=3)for(let i=0;i<3;i++){const a=i*2.094+rnd(0,1);S.fx.push({k:'meteor',mini:true,x:f.x+Math.cos(a)*90,y:f.y+Math.sin(a)*90,t:.4,max:.4,r:42,dmg:f.dmg*.35});}}
      if(f.done)f.life-=dt;}
    else{f.life-=dt;if(f.k==='spark'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92;}}
  }
  S.fx=S.fx.filter(f=>f.k==='meteor'?(!f.done||f.life>0):f.life>0);
  for(const t of S.texts){t.life-=dt;t.y-=40*dt;}
  S.texts=S.texts.filter(t=>t.life>0);

  if(p.hp<=0&&(st.revives||0)>S.revUsed){S.revUsed++;p.hp=p.maxhp*.5;p.inv=2.5;
    for(const e of near(p.x,p.y,220)){const dx=e.x-p.x,dy=e.y-p.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*140;e.y+=dy/l*140;}
    S.fx.push({k:'nova',x:p.x,y:p.y,r:220,life:.6,col:'126,224,138'});burst(p.x,p.y,'nature',50);toast('세계수의 가호로 부활했어요!');shake(8);
    if(st.reviveStar>=2)for(const e of near(p.x,p.y,290)){if(!e.dead&&d2(e,p)<290*290)hurt(e,100*scale(),'#7ee08a');}
    if(st.reviveStar>=3)p.inv=5;}
  if(p.hp<=0){p.hp=0;showEnd(false);}
  else if(S.t>=600){S.won=true;showEnd(true);}
}

function decoSpr(k){return makeSprite('deco'+k,30,26,DECO[k]);}
function groundTile(){return makeSprite('ground',256,256,g=>{
  g.fillStyle='#131a32';g.fillRect(0,0,256,256);
  const wrap=(fn,x,y,m)=>{for(const dx of [-256,0,256])for(const dy of [-256,0,256]){const X=x+dx,Y=y+dy;if(X>-m&&X<256+m&&Y>-m&&Y<256+m)fn(X,Y);}};
  for(let i=0;i<22;i++){const x=hash(i,7)*256,y=hash(i,8)*256,r=24+hash(i,9)*56,dark=hash(i,10)<.5;
    wrap((X,Y)=>{const c=g.createRadialGradient(X,Y,0,X,Y,r);c.addColorStop(0,dark?'rgba(6,9,22,.45)':'rgba(40,70,90,.32)');c.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=c;g.fillRect(X-r,Y-r,r*2,r*2);},x,y,r);}
  for(let i=0;i<80;i++){const x=hash(i,21)*256,y=hash(i,22)*256,h=4+hash(i,23)*6,a=.1+hash(i,24)*.2,lean=(hash(i,25)-.5)*4;
    wrap((X,Y)=>{g.strokeStyle=`rgba(${hash(i,26)<.5?'90,170,130':'110,150,200'},${a})`;g.lineWidth=1.1;g.beginPath();g.moveTo(X,Y);g.quadraticCurveTo(X+lean*.3,Y-h*.6,X+lean,Y-h);g.moveTo(X+1.5,Y);g.quadraticCurveTo(X+1.5+lean*.2,Y-h*.4,X+2+lean*.6,Y-h*.7);g.stroke();},x,y,12);}
  for(let i=0;i<26;i++){const x=hash(i,31)*256,y=hash(i,32)*256;wrap((X,Y)=>{g.fillStyle=`rgba(150,160,200,${.12+hash(i,33)*.15})`;g.beginPath();ell(g,X,Y,1.6+hash(i,34)*1.5,1+hash(i,35));g.fill();},x,y,4);}
  for(let i=0;i<14;i++){const x=hash(i,41)*256,y=hash(i,42)*256,c=['255,170,210','255,230,140','190,170,255'][i%3];wrap((X,Y)=>{g.fillStyle=`rgba(${c},.5)`;g.beginPath();ell(g,X,Y,1.4,1.4);g.fill();},x,y,3);}
});}
let groundPat=null;

function drawPlayer(p){
  const fs=S.face||1,mv=p.mv||0,bob=mv>.05?Math.abs(Math.sin(S.walk||0))*2.2:Math.sin(S.t*2)*.6,x=p.x,y=p.y-bob;
  ctx.fillStyle='rgba(0,0,0,.32)';ctx.beginPath();ell(ctx,p.x,p.y+13,12-bob*.8,4);ctx.fill();
  // staff
  const sx=x+fs*12,sy=y+6;ctx.strokeStyle='#6b4423';ctx.lineWidth=2.6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy+6);ctx.lineTo(sx+fs*2,sy-26);ctx.stroke();
  ctx.fillStyle='#fff3b8';ctx.beginPath();ell(ctx,sx+fs*2,sy-29,3.6,3.6);ctx.fill();
  // robe
  ctx.beginPath();ctx.moveTo(x-7,y-6);ctx.lineTo(x+7,y-6);ctx.quadraticCurveTo(x+12,y+4,x+12,y+11);ctx.quadraticCurveTo(x,y+14,x-12,y+11);ctx.quadraticCurveTo(x-12,y+4,x-7,y-6);ctx.closePath();
  const rg=ctx.createLinearGradient(x,y-6,x,y+12);rg.addColorStop(0,'#5a62e8');rg.addColorStop(1,'#272b86');ctx.fillStyle=rg;ctx.fill();ctx.strokeStyle='#161a55';ctx.lineWidth=1.2;ctx.stroke();
  ctx.strokeStyle='#ffcf5a';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x-11.5,y+10.5);ctx.quadraticCurveTo(x,y+13.5,x+11.5,y+10.5);ctx.stroke();
  ctx.fillStyle='#ffcf5a';ctx.fillRect(x-7,y+1,14,1.8);
  // hand
  ctx.fillStyle='#ffe2c4';ctx.beginPath();ell(ctx,sx-fs*1,sy+1,2.4,2.4);ctx.fill();
  // face
  ctx.beginPath();ell(ctx,x+fs,y-9,6.6,6.2);ctx.fillStyle='#ffe2c4';ctx.fill();ctx.strokeStyle='#c99a78';ctx.lineWidth=.8;ctx.stroke();
  ctx.fillStyle='#22163a';ctx.beginPath();ell(ctx,x+fs*3.4,y-9,1.1,1.5);ell(ctx,x+fs*-.6,y-9,1.1,1.5);ctx.fill();
  ctx.fillStyle='rgba(255,120,150,.45)';ctx.beginPath();ell(ctx,x+fs*5,y-6.5,1.5,.9);ctx.fill();
  // hat
  const sway=Math.sin(S.t*3)*1.5+(mv>.05?-fs*2:0);
  ctx.beginPath();ell(ctx,x+fs,y-13.5,12.5,3.6);ctx.fillStyle='#3a3fb4';ctx.fill();
  ctx.beginPath();ctx.moveTo(x+fs-8,y-14);ctx.quadraticCurveTo(x+fs*-1,y-26,x-fs*7+sway,y-34);ctx.quadraticCurveTo(x+fs*4,y-25,x+fs+8,y-14);ctx.closePath();
  const hg=ctx.createLinearGradient(x-8,y-34,x+8,y-14);hg.addColorStop(0,'#7c82ff');hg.addColorStop(1,'#3a3fb4');ctx.fillStyle=hg;ctx.fill();ctx.strokeStyle='#1d2070';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#ffcf5a';ctx.beginPath();const stx=x+fs*1.5,sty=y-20;for(let k=0;k<10;k++){const a=-1.5708+k*.6283,rr=k%2?1.3:3.2;ctx.lineTo(stx+Math.cos(a)*rr,sty+Math.sin(a)*rr);}ctx.closePath();ctx.fill();
}

const FF=[];for(let i=0;i<34;i++)FF.push({x:Math.random(),y:Math.random(),ph:Math.random()*6.28,sp:.3+Math.random()*.6,par:.25+Math.random()*.5});
function drawFireflies(px,py,t){
  ctx.globalCompositeOperation='lighter';
  for(const f of FF){const wx=W+60,wy=H+60;let x=((f.x*wx-px*SC*f.par+Math.sin(t*f.sp+f.ph)*30)%wx+wx)%wx-30,y=((f.y*wy-py*SC*f.par+Math.cos(t*f.sp*.8+f.ph)*24)%wy+wy)%wy-30;
    const a=.25+.35*Math.max(0,Math.sin(t*2*f.sp+f.ph));glow(x,y,7,'200,255,170',a);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

// ---------- render ----------
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(!S){drawTitleBg();return;}
  const p=S.p,hw=W/2/SC,hh=H/2/SC,t=S.t;
  const shx=S.shake>0?rnd(-1,1)*S.shake:0,shy=S.shake>0?rnd(-1,1)*S.shake:0,camX=p.x+shx,camY=p.y+shy;
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*(W/2-SC*camX),DPR*(H/2-SC*camY));
  // ground
  if(!groundPat){groundPat=ctx.createPattern(groundTile(),'repeat');if(groundPat.setTransform&&window.DOMMatrix)groundPat.setTransform(new DOMMatrix().scale(1/SR));}
  ctx.fillStyle=groundPat;ctx.fillRect(camX-hw-4,camY-hh-4,hw*2+8,hh*2+8);
  // decorations on a coarse grid
  const D=170,glowDeco=[];
  for(let i=Math.floor((camX-hw)/D)-1;i<=Math.floor((camX+hw)/D)+1;i++)for(let j=Math.floor((camY-hh)/D)-1;j<=Math.floor((camY+hh)/D)+1;j++){
    const h=hash(i*3+11,j*7+5);if(h>.34)continue;const k=Math.floor(hash(j+99,i)*DECO.length),x=i*D+hash(i,j+3)*D,y=j*D+hash(j,i+5)*D;
    blit(decoSpr(k),x,y);if(DECO_GLOW[k])glowDeco.push([x,y+2,DECO_GLOW[k]]);}
  // thorns aura: vine ring with leaves
  for(const it of S.eq)if(it.id==='thorns'){const rad=55+15*it.star;ctx.fillStyle='rgba(126,224,138,.07)';ctx.beginPath();ell(ctx,p.x,p.y,rad,rad);ctx.fill();
    ctx.strokeStyle='rgba(90,190,110,.55)';ctx.lineWidth=2.2;ctx.beginPath();for(let a=0;a<=6.3;a+=.12){const rr=rad+Math.sin(a*9+t*2)*3;ctx.lineTo(p.x+Math.cos(a)*rr,p.y+Math.sin(a)*rr);}ctx.stroke();
    ctx.fillStyle='#7ee08a';ctx.beginPath();for(let k=0;k<12;k++){const a=k*.5236+t*.6;ell(ctx,p.x+Math.cos(a)*rad,p.y+Math.sin(a)*rad,4,2,a+.8);}ctx.fill();}
  // zones (base layer)
  for(const z of S.zones){const k=Math.min(1,z.life/z.max*2);
    if(z.kind==='fire'){ctx.fillStyle=`rgba(40,12,6,${.45*k})`;ctx.beginPath();ell(ctx,z.x,z.y,z.r,z.r*.8);ctx.fill();}
    else if(z.kind==='twister'){ctx.save();ctx.translate(z.x,z.y);ctx.rotate(t*10);ctx.strokeStyle=`rgba(${z.col},${.85*k})`;ctx.lineWidth=2.5;for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(0,0,z.r*(.3+i*.24),i*1.4,i*1.4+3.4);ctx.stroke();}ctx.restore();}
    else{ctx.strokeStyle=`rgba(${z.col},${.5*k})`;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(z.x,z.y,z.r*.7,t*6,t*6+2.4);ctx.stroke();ctx.beginPath();ctx.arc(z.x,z.y,z.r*.4,t*6+3,t*6+5);ctx.stroke();}}
  // meteor target markers
  for(const f of S.fx)if(f.k==='meteor'&&!f.done){const k=1-f.t/f.max;ctx.fillStyle=`rgba(255,90,40,${.06+.16*k})`;ctx.beginPath();ell(ctx,f.x,f.y,f.r,f.r*.8);ctx.fill();
    ctx.strokeStyle=`rgba(255,140,60,${.5+.4*k})`;ctx.lineWidth=2;ctx.setLineDash([8,6]);ctx.lineDashOffset=-t*40;ctx.beginPath();ell(ctx,f.x,f.y,f.r*(1.1-.1*k),f.r*.8*(1.1-.1*k));ctx.stroke();ctx.setLineDash([]);}
  // gems + chests
  const gs=gemSpr();
  for(const g of S.gems){if(g.chest){blit(chestSpr(),g.x,g.y-2+Math.sin(t*3)*1.5);continue;}const s=g.big?1.5:1;blit(gs,g.x,g.y+Math.sin(t*4+g.x*.1)*1.2,s,s);}
  // field items
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='18px system-ui, sans-serif';
  for(const f of S.items){const bob=Math.sin(t*3+f.t)*3;if(f.life<6&&Math.floor(f.life*6)%2===0)continue;
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ell(ctx,f.x,f.y+14,11,3.5);ctx.fill();
    ctx.fillStyle='rgba(16,20,48,.85)';ctx.strokeStyle=`rgba(${FIELD[f.k].col},.9)`;ctx.lineWidth=2;ctx.beginPath();ell(ctx,f.x,f.y+bob,14,14);ctx.fill();ctx.stroke();
    ctx.fillText(FIELD[f.k].icon,f.x,f.y+bob+1);}
  ctx.textBaseline='alphabetic';
  // enemy shadows (one path)
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();
  for(const e of S.enemies){if(e.type==='bat')ell(ctx,e.x,e.y+e.r+9,e.r*.8,e.r*.28);else ell(ctx,e.x,e.y+e.r*.88,e.r*1.08,e.r*.34);}
  ctx.fill();
  // enemies
  const pupils=[];
  for(const e of S.enemies){
    const T=ESPR[e.type],v=e.flash>0?'f':e.frozenT>0?'z':'n';
    if(e.type==='bat'){const f=Math.floor(t*14+e.wob*3)%2,by=Math.sin(t*8+e.wob)*2;blit(enemySprite('bat',v,f),e.x,e.y+by);if(e.slowT>0&&v==='n'){ctx.globalAlpha=.45;blit(enemySprite('bat','z',f),e.x,e.y+by);ctx.globalAlpha=1;}continue;}
    let sx=1,sy=1;if(e.type!=='golem'&&v!=='z'){const q=Math.sin(t*6+e.wob)*.07;sx=1+q;sy=1-q;}
    const spr=enemySprite(e.type,v),r=e.r,by=e.type==='golem'?Math.abs(Math.sin(t*4+e.wob))*-1.5:0;
    const cy=e.y-r*T.oy*sy+(1-sy)*spr.h*.5+by;
    blit(spr,e.x,cy,sx,sy);
    if(e.slowT>0&&v==='n'){ctx.globalAlpha=.4;blit(enemySprite(e.type,'z'),e.x,cy,sx,sy);ctx.globalAlpha=1;}
    if(e.type!=='golem'&&v!=='f'){const dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;pupils.push(e.x,e.y-r*.08*sy+(1-sy)*r*.4,dx/l*r*.08,dy/l*r*.08,r);}
    if(e.type==='elite'||e.type==='golem'){const w=r*2,y0=e.y-r-(e.type==='elite'?r*.9:12);ctx.fillStyle='rgba(10,8,20,.75)';ctx.fillRect(e.x-r-1,y0-1,w+2,6);ctx.fillStyle=e.type==='elite'?'#ff4d6d':'#ffb347';ctx.fillRect(e.x-r,y0,w*Math.max(0,e.hp/e.max),4);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(e.x-r,y0,w*Math.max(0,e.hp/e.max),1.4);}
  }
  ctx.fillStyle='#1a1030';ctx.beginPath();
  for(let i=0;i<pupils.length;i+=5){const x=pupils[i],y=pupils[i+1],ox=pupils[i+2],oy=pupils[i+3],r=pupils[i+4];ell(ctx,x-r*.36+ox,y+oy,r*.11,r*.14);ell(ctx,x+r*.36+ox,y+oy,r*.11,r*.14);}
  ctx.fill();
  // frost ring crystals
  for(const it of S.eq)if(it.id==='frostring'){const n=2+it.star;for(let i=0;i<n;i++){const a=S.ringA+i*6.283/n,ox=p.x+Math.cos(a)*78,oy=p.y+Math.sin(a)*78;
    ctx.save();ctx.translate(ox,oy);ctx.rotate(a*2);ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(4.5,0);ctx.lineTo(0,10);ctx.lineTo(-4.5,0);ctx.closePath();
    const cg=ctx.createLinearGradient(-4,-10,4,10);cg.addColorStop(0,'#ffffff');cg.addColorStop(1,'#5cc8ff');ctx.fillStyle=cg;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=.8;ctx.stroke();ctx.restore();}}
  // projectile cores
  for(const b of S.proj){
    if(b.k==='bolt'){ctx.fillStyle='#fff6d0';ctx.beginPath();ell(ctx,b.x,b.y,b.r*.75,b.r*.75);ctx.fill();}
    else if(b.k==='lance'){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a);ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(4,-5);ctx.lineTo(-14,-2.5);ctx.lineTo(-14,2.5);ctx.lineTo(4,5);ctx.closePath();
      const lg=ctx.createLinearGradient(-14,0,18,0);lg.addColorStop(0,'rgba(120,210,255,.2)');lg.addColorStop(1,'#ffffff');ctx.fillStyle=lg;ctx.fill();ctx.restore();}
    else if(b.k==='shard'){ctx.fillStyle='#ffffff';ctx.beginPath();ell(ctx,b.x,b.y,b.r*.6,b.r*.6);ctx.fill();}
    else if(b.k==='boom'){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(t*14);ctx.strokeStyle='#efe2ff';ctx.lineWidth=3;ctx.lineCap='round';
      for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(0,0,b.r*(.45+k*.27),k*2.1,k*2.1+1.9);ctx.stroke();}ctx.restore();}
  }
  // player
  if(!(p.inv>0&&Math.floor(t*20)%2===0))drawPlayer(p);
  // soft base fx
  for(const f of S.fx){
    if(f.k==='puff'){const k=f.life/.35;ctx.fillStyle=`rgba(${rgbOf(f.col)},${.35*k})`;ctx.beginPath();ell(ctx,f.x,f.y,f.r*(1.6-k*.6),f.r*(1.6-k*.6)*.85);ctx.fill();}
    else if(f.k==='meteor'&&f.done){const k=f.life/.35;ctx.fillStyle=`rgba(30,10,4,${.5*k})`;ctx.beginPath();ell(ctx,f.x,f.y,f.r*.9,f.r*.7);ctx.fill();}
  }

  // ===== light pass (additive) =====
  ctx.globalCompositeOperation='lighter';
  glow(p.x,p.y,110,RGB.moon,.16);
  for(const [x,y,c] of glowDeco)glow(x,y,24,c,.3+.12*Math.sin(t*2+x));
  for(const z of S.zones){const k=Math.min(1,z.life/z.max*2);
    if(z.kind==='fire'){glow(z.x,z.y,z.r*1.25,RGB.fire,.45*k);for(let i=0;i<2;i++){const a=Math.random()*6.283,d=Math.random()*z.r*.8;glow(z.x+Math.cos(a)*d,z.y+Math.sin(a)*d*.8-Math.random()*8,6,'255,190,90',.8*k);}}
    else glow(z.x,z.y,z.r*1.1,z.col,.22*k);}
  for(const g of S.gems){if(g.chest){glow(g.x,g.y,40,RGB.gold,.45+.15*Math.sin(t*4));continue;}const tw=.22+.18*Math.max(0,Math.sin(t*3+g.x*.37+g.y*.11));glow(g.x,g.y,g.big?14:9,RGB.gold,tw);}
  for(const f of S.items){glow(f.x,f.y,30,FIELD[f.k].col,.35+.15*Math.sin(t*4+f.t));}
  for(const e of S.enemies){
    if(e.burnT>0){glow(e.x,e.y-e.r*.3,e.r*1.6,RGB.fire,.55);glow(e.x+rnd(-e.r,e.r)*.6,e.y-e.r-rnd(0,6),4,'255,200,100',.9);}
    if(e.frozenT>0)glow(e.x,e.y,e.r*1.5,RGB.frost,.35);
    if(e.type==='elite')glow(e.x,e.y,e.r*2.4,RGB.red,.3+.12*Math.sin(t*5));
    else if(e.type==='golem')glow(e.x,e.y-e.r*.3,e.r*.9,'255,150,50',.18);}
  for(const it of S.eq)if(it.id==='frostring'){const n=2+it.star;for(let i=0;i<n;i++){const a=S.ringA+i*6.283/n;glow(p.x+Math.cos(a)*78,p.y+Math.sin(a)*78,16,RGB.frost,.6);}}
  for(const b of S.proj){
    if(b.k==='bolt'){glow(b.x,b.y,18,RGB.fire,.9);glow(b.x-b.vx*.025,b.y-b.vy*.025,12,RGB.fire,.5);glow(b.x-b.vx*.05,b.y-b.vy*.05,8,RGB.fire,.3);}
    else if(b.k==='lance'){glow(b.x,b.y,18,RGB.frost,.7);glow(b.x-b.vx*.03,b.y-b.vy*.03,12,RGB.frost,.35);}
    else if(b.k==='shard')glow(b.x,b.y,10,rgbOf(b.col),.85);
    else if(b.k==='boom')glow(b.x,b.y,b.r*1.8,RGB.storm,.5);}
  {const fs=S.face||1;glow(p.x+fs*14,p.y-23,16,RGB.gold,.75+.2*Math.sin(t*5));}
  for(const f of S.fx){
    if(f.k==='zap'){const a=Math.min(1,f.life/.18),pts=[[f.x1,f.y1]];for(let i=1;i<6;i++){const k=i/6;pts.push([f.x1+(f.x2-f.x1)*k+rnd(-9,9),f.y1+(f.y2-f.y1)*k+rnd(-9,9)]);}pts.push([f.x2,f.y2]);
      ctx.globalAlpha=a;ctx.lineCap='round';ctx.lineJoin='round';
      for(const [w,c] of [[8,'rgba(170,120,255,.35)'],[3.2,'rgba(220,200,255,.9)'],[1.4,'#ffffff']]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();for(const [x,y] of pts)ctx.lineTo(x,y);ctx.stroke();}
      glow(f.x2,f.y2,22,RGB.storm,.8*a);}
    else if(f.k==='nova'){const k=Math.min(1,f.life/.45),c=f.col||'255,210,90',rr=f.r*(1.05-.35*k);ctx.globalAlpha=k;ctx.strokeStyle=`rgba(${c},.85)`;ctx.lineWidth=9*k+2;ctx.beginPath();ell(ctx,f.x,f.y,rr,rr);ctx.stroke();glow(f.x,f.y,rr*1.1,c,.35*k);}
    else if(f.k==='blast'){const k=f.life/.3,r=(f.r||55),c=rgbOf(f.col||'#ff9640');glow(f.x,f.y,r*1.3,c,.75*k);ctx.globalAlpha=k;ctx.strokeStyle=`rgba(${c},.9)`;ctx.lineWidth=3;ctx.beginPath();ell(ctx,f.x,f.y,r*(1.1-k*.5),r*(1.1-k*.5));ctx.stroke();}
    else if(f.k==='meteor'&&!f.done){const k=1-f.t/f.max,mx=f.x+90*(1-k),my=f.y-260*(1-k),sz=f.mini?.6:1;
      for(let i=4;i>=0;i--)glow(mx+i*7*sz,my-i*20*sz,(18-i*2.5)*sz,RGB.fire,.55-i*.08);glow(mx,my,12*sz,'255,240,200',.9);}
    else if(f.k==='meteor'&&f.done){const k=f.life/.35;glow(f.x,f.y,f.r*1.5,RGB.fire,.9*k);glow(f.x,f.y,f.r*.6,'255,240,200',.7*k);}
    else if(f.k==='spark'){glow(f.x,f.y,5,rgbOf(f.col),Math.min(1,f.life*2.2));}
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // damage text
  ctx.textAlign='center';ctx.lineJoin='round';
  for(const tx of S.texts){const pop=1+Math.max(0,tx.life-.55)*4,big=tx.big;ctx.font=`${big?17:12}px Jua, system-ui, sans-serif`;
    ctx.globalAlpha=Math.min(1,tx.life*2.2);ctx.save();ctx.translate(tx.x,tx.y);ctx.scale(pop,pop);ctx.lineWidth=3;ctx.strokeStyle='rgba(8,6,20,.85)';ctx.strokeText(tx.txt,0,0);ctx.fillStyle=big?'#fff3b0':tx.col;ctx.fillText(tx.txt,0,0);ctx.restore();}
  ctx.globalAlpha=1;
  // ===== screen space =====
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawFireflies(camX,camY,t);
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.28,W/2,H/2,Math.max(W,H)*.72);vg.addColorStop(0,'rgba(5,6,20,0)');vg.addColorStop(1,'rgba(5,6,20,.62)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(p.hp/p.maxhp<.3){const a=.18+.12*Math.sin(t*6);const hv=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.7);hv.addColorStop(0,'rgba(255,40,70,0)');hv.addColorStop(1,`rgba(255,40,70,${a})`);ctx.fillStyle=hv;ctx.fillRect(0,0,W,H);}
  for(const f of S.fx)if(f.k==='chill'){ctx.fillStyle=`rgba(${f.col||'160,225,255'},${.32*f.life/.5})`;ctx.fillRect(0,0,W,H);}
  if(joy.on&&mode==='play'){const r=cv.getBoundingClientRect(),ox=joy.ox-r.left,oy=joy.oy-r.top;let dx=joy.x-joy.ox,dy=joy.y-joy.oy;const l=Math.hypot(dx,dy);if(l>50){dx=dx/l*50;dy=dy/l*50;}
    ctx.fillStyle='rgba(20,24,60,.35)';ctx.strokeStyle='rgba(200,195,255,.35)';ctx.lineWidth=2;ctx.beginPath();ell(ctx,ox,oy,52,52);ctx.fill();ctx.stroke();
    const kg=ctx.createRadialGradient(ox+dx-5,oy+dy-6,2,ox+dx,oy+dy,22);kg.addColorStop(0,'rgba(255,255,255,.75)');kg.addColorStop(1,'rgba(160,150,255,.45)');ctx.fillStyle=kg;ctx.beginPath();ell(ctx,ox+dx,oy+dy,21,21);ctx.fill();}
}
function drawTitleBg(){
  const t=performance.now()/1000;
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#060920');gr.addColorStop(.55,'#141a40');gr.addColorStop(1,'#232a5e');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  for(let i=0;i<130;i++){const x=hash(i,1)*W,y=hash(i,2)*H*.75,tw=.25+.75*Math.abs(Math.sin(t*(.4+hash(i,3))+i)),s=hash(i,4)<.15?2:1.2;ctx.fillStyle=`rgba(255,245,215,${.7*tw})`;ctx.fillRect(x,y,s,s);}
  const mr=Math.min(W,H)*.07,mx=W*.8,my=H*.15;
  ctx.globalCompositeOperation='lighter';glow(mx,my,mr*5,'150,160,255',.35);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#fff6dc';ctx.beginPath();ell(ctx,mx,my,mr,mr);ctx.fill();ctx.fillStyle='rgba(200,190,160,.35)';ctx.beginPath();ell(ctx,mx-mr*.3,my-mr*.2,mr*.2,mr*.2);ell(ctx,mx+mr*.35,my+mr*.25,mr*.14,mr*.14);ell(ctx,mx+mr*.1,my-mr*.45,mr*.1,mr*.1);ctx.fill();
  const hill=(base,amp,col,f,ph)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+10;x+=10)ctx.lineTo(x,H*base+Math.sin(x*f+ph)*amp+Math.sin(x*f*2.3+ph*1.7)*amp*.4);ctx.lineTo(W,H);ctx.closePath();ctx.fill();};
  hill(.5,22,'#151c45',.006,1);hill(.57,18,'#0d1233',.009,4);
  ctx.fillStyle='#0d1233';for(let i=0;i<14;i++){const x=hash(i,9)*W,base=H*.57+Math.sin(x*.009+4)*18+Math.sin(x*.009*2.3+6.8)*7.2,h=26+hash(i,8)*30;ctx.beginPath();ctx.moveTo(x-h*.28,base+6);ctx.lineTo(x,base-h);ctx.lineTo(x+h*.28,base+6);ctx.fill();}
  hill(.64,12,'#080b22',.012,2);
  ctx.globalCompositeOperation='lighter';for(let i=0;i<9;i++){const x=hash(i,61)*W,y=H*.6+hash(i,62)*H*.08;glow(x,y,10,'255,200,120',.35+.25*Math.sin(t*1.5+i));}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  drawFireflies(t*14,0,t);
}

// ---------- hud ----------
let lastHud='';
function hud(){
  if(!S)return;
  const p=S.p,g=Math.floor(S.gem),c=Math.min(...S.shop.filter(Boolean).map(priceOf),99);
  const key=[R(p.hp),R(p.maxhp),Math.floor(S.t),g,S.kills,c,S.newStock,S.lv,Math.floor(S.xp)].join('|');
  if(key===lastHud)return;lastHud=key;
  el.hpbar.style.width=(100*p.hp/p.maxhp)+'%';
  el.xpbar.style.width=(S.lv>=MAXLV?100:100*S.xp/xpNeed(S.lv))+'%';
  el.lvl.textContent=`Lv.${S.lv}`;
  el.hptext.textContent=`${R(p.hp)} / ${R(p.maxhp)}`;
  el.timer.textContent=fmt(S.t);
  el.gems.textContent=`◆ ${g}`;
  el.kills.textContent=`처치 ${S.kills}`;
  el.cost.textContent=c<99?`◆ ${c}~`:'품절';
  el.drawBtn.classList.toggle('poor',g<c);
  let dot=el.drawBtn.querySelector('.dot');
  if(S.newStock&&!dot){dot=document.createElement('span');dot.className='dot';el.drawBtn.appendChild(dot);}
  else if(!S.newStock&&dot)dot.remove();
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
  if(mode==='play')update(dt);
  if(popT>0){popT-=dt;if(popT<=0)el.pop.classList.remove('show');}
  if(toastT>0){toastT-=dt;if(toastT<=0)el.toast.classList.remove('show');}
  render();hud();
  el.overlay.classList.toggle('title',mode==='title');
  $('app').classList.toggle('titlemode',mode==='title');
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
})();
</script>
