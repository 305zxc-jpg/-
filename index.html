/* Layout: full-bleed pixel canvas, HUD pinned top, spell tray + shop pinned bottom. One fixed 25-colour palette shared with the sprites; single deliberate night theme. */
:root{
  --ink:#f4f4f4;
  --muted:#94b0c2;
  --dark:#1a1c2c;
  --panel:#262b44;
  --panel2:#333c57;
  --edge:#566c86;
  --gold:#ffcd75;
  --gold2:#f2a93b;
  --hp:#b13e53;
  --font:"Galmuri11","Galmuri14",monospace;
  --font14:"Galmuri14","Galmuri11",monospace;
  --notch:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--dark);color:var(--ink);font-family:var(--font14);font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;font-smooth:never}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;font-size:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pxi{image-rendering:pixelated;width:36px;height:36px;display:block}
.pxi.sm{width:24px;height:24px;display:inline-block;vertical-align:middle}
.pxi.lg{width:48px;height:48px;margin:0 auto}
.pxi.xl{width:72px;height:72px;margin:0 auto}
/* shared pixel frame: dark outer line, lighter inner bevel, notched corners */
.card,#pop,#toast,.stat,#pauseBtn,.slot,.offer,.cell,.ghost,.big,#drawBtn,.lvrow,.act,.desc,.pill,.traits div,.statsgrid div,.hpwrap,.xpwrap,.rules summary,.tag{clip-path:var(--notch);border:3px solid var(--dark)}

#hud{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.row{display:flex;align-items:center;gap:8px}
.bars{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.hpwrap{position:relative;height:22px;background:var(--dark);box-shadow:inset 0 0 0 2px var(--panel2)}
.hpwrap::before{content:"♥";position:absolute;left:6px;top:50%;transform:translateY(-50%);font-family:var(--font);font-size:11px;color:var(--ink);z-index:2}
#hpbar{position:absolute;left:2px;top:2px;bottom:2px;width:100%;max-width:calc(100% - 4px);background:var(--hp);box-shadow:inset 0 3px 0 #ef7d57,inset 0 -3px 0 #6e1f3a;transition:width .1s steps(3)}
#shbar{position:absolute;left:2px;top:2px;height:6px;width:0;max-width:calc(100% - 4px);background:#73eff7;z-index:1}
#hptext{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font);font-size:11px;z-index:2;text-shadow:1px 1px 0 var(--dark)}
.xpwrap{height:12px;background:var(--dark);border-width:2px}
#xpbar{height:100%;width:0;background:#41a6f6;box-shadow:inset 0 2px 0 #73eff7;transition:width .15s steps(3)}

<script>
(()=>{
'use strict';
// ---------- data ----------
const TRAITS={
  fire:{name:'화염',color:'#ff7a45',fx:['모든 피해 +60%','피해 +160%, 처치 폭발, 처치 시 체력 흡수','피해 추가 ×2, 모든 공격이 불태움, 흡수 2배']},
  frost:{name:'냉기',color:'#6fd3ff',fx:['피해 +20%, 45% 둔화, 둔화된 적 받는 피해 +35%','피해 +50%, 65% 둔화, 적 받는 피해 +80%, 내가 받는 피해 -20%','피해 추가 ×2.2, 적 받는 피해 +150%, 내 피해 -35%, 3초마다 전체 빙결+얼음 보호막']},
  storm:{name:'폭풍',color:'#c79bff',fx:['재사용 대기 -30%, 피해 +30%','대기 -45%, 피해 +70%, 50% 두 번 발동, 회피 10%','피해 추가 ×1.6, 대기 -30%, 85% 두 번 발동, 매초 벼락, 회피 20%']},
  nature:{name:'자연',color:'#7ee08a',fx:['초당 1.5 회복, 체력 +40, 피해 +25%','초당 3.5 회복, 체력 +100, 피해 +60%, 이동 +15%','피해 추가 ×2, 받는 피해 -20%, 초당 6 회복, 가시 폭풍']},
  dark:{name:'어둠',color:'#d0507a',fx:['처치 시 체력 1 흡수, 피해 +30%','흡수 2, 피해 +70%, 저주 피해 +80%','피해 추가 ×2.5, 처치한 적이 영혼 폭발']},
  light:{name:'빛',color:'#fff1b0',fx:['피해 +20%, 초당 1.5 회복, 받는 피해 -10%','피해 +50%, 초당 3 회복, 받는 피해 -20%, 4초마다 빛 보호막','피해 추가 ×2, 받는 피해 -30%, 맞으면 빛 폭발로 반격']},
};
const RAR=[{name:'일반',col:'#a9a6d0'},{name:'희귀',col:'#5aa8ff'},{name:'전설',col:'#ffcf5a'},{name:'신화',col:'#ff6bd6'},{name:'복합',col:'#7ee8c8'}];
const M=[0,1,2,4]; // star power: 9 copies for ★3 should feel huge
const R=n=>Math.round(n);
const POW={blizzard:0.55,bloom:0.183,breath:0.702,chain:1.315,curse:1.945,eclipse:0.233,eruption:0.196,field:2.409,firebolt:2.912,firestorm:0.084,frostmine:2.056,frostring:2.195,frostwhirl:0.204,holybolt:1.534,holywater:0.45,icethorn:0.532,judgment:0.304,lance:1.485,lightshot:2.869,meteor:0.406,pillar:0.541,pollen:0.216,reaper:0.127,salamander:2.055,shadowbolt:6.942,shadowclone:5.058,shadowflame:0.576,snare:2.757,spore:2.237,steam:0.465,stormeye:0.341,stormorb:1.685,sun:0.057,thorns:0.735,thunder:0.127,thundertree:1.543,vampbat:5.976,voidorb:0.724,whirl:0.564,zero:0.169};let _pw=1;const Mp=s=>M[s]*_pw;
const ITEMS={
  firebolt:{name:'불꽃탄',trait:'fire',rar:0,w:1,desc:s=>`가장 가까운 적 ${s}명에게 불꽃을 쏩니다. 피해 ${R(13*Mp(s))}`},
  meteor:{name:'운석 낙하',trait:'fire',rar:2,w:1,desc:s=>`적 무리 위에 운석 ${s}개를 떨어뜨립니다. 범위 피해 ${R(45*Mp(s))}`},

function mergeAll(){
  const out=[];let found=true;
  while(found){found=false;
    const g={};
    for(const it of allItems()){if(it.star>=3)continue;const k=it.id+'|'+it.star;(g[k]=g[k]||[]).push(it);}
    for(const k in g){if(g[k].length>=3){
      const three=g[k].slice(0,3),target=three.find(x=>S.slots.includes(x))||three[0],[arr,idx]=locOf(target);
      for(const x of three){const l=locOf(x);l[0][l[1]]=null;}
      const nw=mk(three[0].id,three[0].star+1);arr[idx]=nw;
      out.push(nw);found=true;break;}}
  }
  return out;
}

function genFloor(){
  const cells=new Map();cells.set(ckey(0,0),{x:0,y:0});
  const target=8+S.floor+Math.floor(Math.random()*3);let tries=0;
  while(cells.size<target&&tries++<800){const arr=[...cells.values()],c=arr[Math.floor(Math.random()*arr.length)],d=Object.values(DIRS)[Math.floor(Math.random()*4)],nx=c.x+d[0],ny=c.y+d[1];
    if(cells.has(ckey(nx,ny)))continue;let nb=0;for(const e of Object.values(DIRS))if(cells.has(ckey(nx+e[0],ny+e[1])))nb++;if(nb>1)continue;cells.set(ckey(nx,ny),{x:nx,y:ny});}
  const rooms=[...cells.values()];for(const r of rooms){r.type='normal';r.cleared=false;r.visited=false;r.items=[];}
  const nbs=r=>Object.values(DIRS).filter(d=>cells.has(ckey(r.x+d[0],r.y+d[1]))).length;
  const dist=new Map([[ckey(0,0),0]]),q=[cells.get(ckey(0,0))];
  while(q.length){const c=q.shift();for(const d of Object.values(DIRS)){const k=ckey(c.x+d[0],c.y+d[1]);if(cells.has(k)&&!dist.has(k)){dist.set(k,dist.get(ckey(c.x,c.y))+1);q.push(cells.get(k));}}}
  const st0=cells.get(ckey(0,0));st0.type='start';st0.cleared=true;
  const others=rooms.filter(r=>r!==st0).sort((a,b)=>dist.get(ckey(b.x,b.y))-dist.get(ckey(a.x,a.y)));
  const deads=others.filter(r=>nbs(r)===1);
  const pick=list=>{const r=list.find(x=>x.type==='normal');return r;};
  const boss=deads[0]||others[0];boss.type='boss';
  (pick(deads)||pick(others)).type='treasure';
  (pick(deads)||pick(others)).type='shop';
  S.dg={cells,cur:null,pending:[],shotN:0,fireT:0,orbA:0,turretT:4,cleared:0,buyCD:0,stairs:false};
}

function enterRoom(r,dir){

  S.gems=[];S.enemies=[];S.eproj=[];S.proj=[];S.tears=[];S.zones=[];S.mines=[];S.turrets=[];S.blasts=[];S.items=[];S.atk=[];S.clones=[];d.pending=[];d.stairs=!!r.stairs;
  d.cur=r;r.visited=true;

function dgWave(r,size){const d=S.dg,pool=FLOOR_POOL[S.floor],n=Math.round((5+S.floor*1.6+Math.floor(Math.random()*3)+Math.floor(d.cleared/3))*size);

  if(f.k==='heal'){const v=R(p.maxhp*.35);p.hp=Math.min(p.maxhp,p.hp+v);addText(p.x,p.y-30,'+'+v,'#7ee08a');toast('회복 물약! 체력 +'+v);}
  else if(f.k==='magnet'){for(const g of S.gems)g.mag=true;toast('자석! 모든 결정을 끌어와요');}
  else if(f.k==='bomb'){S.fx.push({k:'chill',life:.5,col:'255,170,80'});shake(9);for(const e of inView())hurt(e,60*(1+S.t/90),'#ffb04a');toast('폭탄! 화면의 적에게 큰 피해');}
  else if(f.k==='bag'){const v=12+Math.floor(S.t/60)*3;S.gem+=v;gainXp(v);toast(`결정 주머니! ◆ +${v}`);}
  S.fx.push({k:'nova',x:f.x,y:f.y,r:50,life:.35,col:FIELD[f.k].col});
}

// ---------- update ----------
function update(dt){
  S.t+=dt;const p=S.p;
  // move
  let mx=0,my=0;
  const dgm=DG();
  if(keys['a']||(!dgm&&keys['arrowleft']))mx--;if(keys['d']||(!dgm&&keys['arrowright']))mx++;
  if(keys['w']||(!dgm&&keys['arrowup']))my--;if(keys['s']||(!dgm&&keys['arrowdown']))my++;
  if(joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>6){const k=Math.min(1,l/50);mx=dx/l*k;my=dy/l*k;}}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  if(ml>.05){p.fx=mx/Math.max(ml,1e-6);p.fy=my/Math.max(ml,1e-6);const n=Math.hypot(p.fx,p.fy);p.fx/=n;p.fy/=n;}
  const spdMul=(S.pslow>0?.6:1)*(S.sand>0?.75:1);S.pslow=Math.max(0,(S.pslow||0)-dt);
  p.x+=mx*st.speed*spdMul*dt;p.y+=my*st.speed*spdMul*dt;
  if(dgm){p.x=Math.max(-RW/2+WALL+p.r,Math.min(RW/2-WALL-p.r,p.x));p.y=Math.max(-RH/2+WALL+p.r,Math.min(RH/2-WALL-p.r,p.y));}p.mv=ml;if(ml>.05){S.walk=(S.walk||0)+dt*11;if(Math.abs(mx)>.2)S.face=mx>0?1:-1;}
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*28);
  p.inv=Math.max(0,p.inv-dt);
  p.hp=Math.min(p.maxhp,p.hp+st.regen*dt);

  if(!dgm){ // survival-only schedule
  // spawn
  S.spawnAcc+=dt*(2+S.t/16);
  while(S.spawnAcc>=1){S.spawnAcc--;if(S.enemies.length<420)spawn();}
  if(S.t>=S.nextStock){S.nextStock+=restockT();const intr=Math.min(intCap(),Math.floor(S.gem/10));S.gem+=intr;
    restock();S.newStock=true;
    toast(`상점에 새 물건이 들어왔어요${intr?` · 이자 ◆+${intr}`:''}`);}
  if(S.t>=S.nextItem){S.nextItem+=rnd(16,24);spawnItem();}
  // map hazards
  if(S.map==='desert'){S.sand=Math.max(0,(S.sand||0)-dt);S.sandT=(S.sandT??90)-dt;if(S.sandT<=0){S.sandT=70;S.sand=12;toast('모래폭풍! 잠시 느려져요');}}

    else if(e.type==='charger'){ // glare along a line, then charge it

      else if(e.aimT>0){e.aimT-=dt;if(e.aimT<=0){e.dash=.55;e.hitDash=false;}}
      else if(e.stun>0){e.stun-=dt;}
      else{e.x+=dx/l*sp*dt;e.y+=dy/l*sp*dt;e.cd-=dt;if(e.cd<=0&&l<330){e.cd=4;e.aimT=.8;e.ddx=dx/l;e.ddy=dy/l;}}}
    else if(e.type==='archer'){ // keeps range, draws an aim line, fires a 3-arrow fan
      if(e.aimT>0){e.aimT-=dt;const a0=Math.atan2(p.y-e.y,p.x-e.x);e.aimA=a0;if(e.aimT<=0){for(const o of [-.18,0,.18]){const a=a0+o;S.eproj.push({x:e.x,y:e.y,vx:Math.cos(a)*270,vy:Math.sin(a)*270,r:4,dmg:e.dmg,life:2.4,col:'#f4f4f4',arrow:true});}}}
      else{const dir=l<190?-1:l>260?1:0;e.x+=(dx/l*dir+(-dy/l)*.4)*sp*dt;e.y+=(dy/l*dir+(dx/l)*.4)*sp*dt;e.cd-=dt;if(e.cd<=0&&l<460){e.cd=2.8;e.aimT=.6;}}}
    else if(e.type==='turtle'){ // tucks in (flashing), then sprays spikes all around
      if(e.wind>0){e.wind-=dt;e.flash=Math.floor(e.wind*12)%2?.05:0;if(e.wind<=0){const n=10,o=(e.spin=(e.spin||0)+.31);for(let i=0;i<n;i++){const a=o+i/n*6.283;S.eproj.push({x:e.x,y:e.y,vx:Math.cos(a)*150,vy:Math.sin(a)*150,r:5,dmg:e.dmg*.8,life:3,col:'#a7f070'});}}}
      else{e.x+=dx/l*sp*dt;e.y+=dy/l*sp*dt;e.cd-=dt;if(e.cd<=0&&l<380){e.cd=3.2;e.wind=.5;}}}
    else if(e.type==='goldgob'){ // runs away; escapes if not caught in time
      e.life-=dt;const wob=Math.sin(S.t*3+e.wob)*.6;e.x+=(-dx/l+(-dy/l)*wob)*sp*dt;e.y+=(-dy/l+(dx/l)*wob)*sp*dt;
      if(Math.random()<.3)S.fx.push({k:'spark',x:e.x,y:e.y,vx:rnd(-30,30),vy:rnd(-30,30),life:.4,col:'#ffcd75'});
      if(e.life<=0||l>900){e.dead=true;S.fx.push({k:'puff',x:e.x,y:e.y,r:14,life:.35,col:'#ffcd75'});toast('황금 고블린이 도망쳤어요…');}}
    else if(e.type==='imp'){ // blinks next to the player
      if(e.stun>0)e.stun-=dt;else{e.x+=dx/l*sp*dt;e.y+=dy/l*sp*dt;}
      e.tp-=dt;if(e.tp<=0&&l<420){e.tp=4;const a=rnd(0,6.283);S.fx.push({k:'puff',x:e.x,y:e.y,r:12,life:.35,col:'#b13e53'});e.x=p.x+Math.cos(a)*110;e.y=p.y+Math.sin(a)*110;e.stun=.45;S.fx.push({k:'puff',x:e.x,y:e.y,r:14,life:.35,col:'#ef7d57'});}}
    else{e.x+=dx/l*sp*dt;e.y+=dy/l*sp*dt;}
    if(l<e.r+p.r&&e.hitCD<=0&&e.type!=='shroom'&&e.type!=='goldgob'){e.hitCD=1;if(st.armorNova&&S.t>(S.armorCD||0)){S.armorCD=S.t+3;freezeIn(p.x,p.y,120,1);S.fx.push({k:'nova',x:p.x,y:p.y,r:120,life:.4,col:'160,225,255'});if(st.armorNova>=3)hurt(e,40*scale(),'#bdf0ff');}
      if(st.glacier){e.frozenT=Math.max(e.frozenT||0,1);if(st.glacier>=2)hurt(e,25*scale(),'#73eff7');}
      hitPlayer(e.dmg,2.5);}
    if(l>1600&&e.type!=='boss'&&e.type!=='goldgob'){e.dead=true;} // far away stragglers are dropped (respawned by flow)
  }
  // telegraphed area attacks (troll boulders)
  for(const a of S.atk){a.t-=dt;if(a.t<=0&&!a.done){a.done=true;S.fx.push({k:'blast',x:a.x,y:a.y,life:.3,r:a.r,col:'#94b0c2'});shake(4);if(d2(a,p)<(a.r+p.r)**2)hitPlayer(a.dmg,5);
      for(const e of near(a.x,a.y,a.r+20)){if(!e.dead&&e.type!=='troll'&&d2(e,a)<a.r*a.r)e.slowT=Math.max(e.slowT,.5);}}}
  S.atk=S.atk.filter(a=>!a.done);
  // enemy bullets
  for(const b of S.eproj){b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(d2(b,p)<(p.r+b.r)**2){b.life=0;hitPlayer(b.dmg,2);if(b.slow)S.pslow=1.5;}}
  S.eproj=S.eproj.filter(b=>b.life>0);
  // light separation
  for(const [,a] of grid){if(a.length<2)continue;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length&&j<i+6;j++){const e=a[i],f=a[j];const dx=f.x-e.x,dy=f.y-e.y,q=dx*dx+dy*dy,rr=e.r+f.r;if(q>0&&q<rr*rr){const l=Math.sqrt(q),push=(rr-l)/2/l;e.x-=dx*push;e.y-=dy*push;f.x+=dx*push;f.y+=dy*push;}}}
  if(dgm)for(const e of S.enemies){e.x=Math.max(-RW/2+WALL+e.r,Math.min(RW/2-WALL-e.r,e.x));e.y=Math.max(-RH/2+WALL+e.r,Math.min(RH/2-WALL-e.r,e.y));}
  S.enemies=S.enemies.filter(e=>!e.dead);

  // gems
  const pr=st.pickup;
  for(const g of S.gems){
    const q=d2(g,p);
    if(g.mag||q<pr*pr){g.mag=true;const l=Math.sqrt(q)||1,sp=Math.max(260,600-l);g.x+=(p.x-g.x)/l*sp*dt;g.y+=(p.y-g.y)/l*sp*dt;}
    if(q<22*22){g.got=true;
      if(g.chest){S.gem+=20;gainXp(20);toast('보물상자! 무료 마법 + ◆20');freeSummon();}
      else{const v=g.v*(st.dbl&&Math.random()<st.dbl?2:1);S.gem+=v*st.gemMul;gainXp(v);}}
  }
  S.gems=S.gems.filter(g=>!g.got);
  for(const f of S.items){f.life-=dt;if(d2(f,p)<(p.r+16)**2){f.life=0;useItem(f);}}
  S.items=S.items.filter(f=>f.life>0);

  // fx
  for(const f of S.fx){
    if(f.k==='meteor'){f.t-=dt;if(f.t<=0&&!f.done){f.done=true;f.life=.35;
      for(const e of near(f.x,f.y,f.r+30)){const rr=f.r+e.r;if(d2(e,f)<rr*rr)hurt(e,f.dmg,'#ffb04a');}
      burst(f.x,f.y,'fire',22);shake(f.mini?1.5:3.5);
      if(!f.mini&&f.star>=2)zone(f.x,f.y,62,2.5,f.dmg*.12,'255,120,40','fire');
      if(!f.mini&&f.star>=3)for(let i=0;i<3;i++){const a=i*2.094+rnd(0,1);S.fx.push({k:'meteor',mini:true,x:f.x+Math.cos(a)*90,y:f.y+Math.sin(a)*90,t:.4,max:.4,r:42,dmg:f.dmg*.35});}}
      if(f.done)f.life-=dt;}
    else if(f.k==='dboom'){f.t-=dt;if(f.t<=0&&!f.done){f.done=true;f.life=.3;
      if(f.scythe)doScythe(f.scythe,f.thr);if(f.eclipse)doEclipse(f.eclipse,f.er,f.white);
      for(const e of near(f.x,f.y,f.r+30)){if(e.dead||d2(e,f)>(f.r+e.r)**2)continue;if(f.spike)e.slowT=Math.max(e.slowT,1.2);if(f.freeze)e.frozenT=Math.max(e.frozenT||0,.7);hurt(e,f.dmg,f.col);}
      S.fx.push({k:'blast',x:f.x,y:f.y,life:.3,r:f.r,col:f.col});if(f.heal){p.hp=Math.min(p.maxhp,p.hp+f.heal);}if(f.petals)shards(f.x,f.y,6,f.dmg*.3,'#ffcd75');}
      if(f.done)f.life-=dt;}
    else{f.life-=dt;if(f.k==='spark'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92;}}
  }
  S.fx=S.fx.filter(f=>(f.k==='meteor'||f.k==='dboom')?(!f.done||f.life>0):f.life>0);
  for(const t of S.texts){t.life-=dt;t.y-=40*dt;}
  S.texts=S.texts.filter(t=>t.life>0);

  if(p.hp<=0&&(st.revives||0)>S.revUsed){S.revUsed++;p.hp=p.maxhp*.5;p.inv=2.5;
    for(const e of near(p.x,p.y,220)){const dx=e.x-p.x,dy=e.y-p.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*140;e.y+=dy/l*140;}
    S.fx.push({k:'nova',x:p.x,y:p.y,r:220,life:.6,col:'126,224,138'});burst(p.x,p.y,'nature',50);toast('세계수의 가호로 부활했어요!');shake(8);
    if(st.reviveStar>=2)for(const e of near(p.x,p.y,290)){if(!e.dead&&d2(e,p)<290*290)hurt(e,100*scale(),'#7ee08a');}
    if(st.reviveStar>=3)p.inv=5;}
  if(p.hp<=0){p.hp=0;showEnd(false);}
  else if(!dgm&&S.t>=600){S.won=true;showEnd(true);}
}

function ell(g,x,y,rx,ry,rot=0){g.moveTo(x+rx*Math.cos(rot),y+rx*Math.sin(rot));g.ellipse(x,y,rx,ry,rot,0,6.283);}
function slimeBody(g,cx,cy,r,light,dark,line){
  g.beginPath();g.moveTo(cx-r*1.12,cy+r*.72);
  g.bezierCurveTo(cx-r*1.3,cy-r*.25,cx-r*.72,cy-r*1.08,cx,cy-r*1.08);
  g.bezierCurveTo(cx+r*.72,cy-r*1.08,cx+r*1.3,cy-r*.25,cx+r*1.12,cy+r*.72);
  g.quadraticCurveTo(cx,cy+r*1.04,cx-r*1.12,cy+r*.72);g.closePath();
  g.fillStyle=dark;g.fill();g.save();g.clip();g.fillStyle=light;g.beginPath();ell(g,cx-r*.15,cy-r*.35,r*1.15,r*.85);g.fill();g.restore();
  g.fillStyle='#f4f4f4';g.beginPath();ell(g,cx-r*.5,cy-r*.6,r*.22,r*.13,-.55);g.fill();
}

  g.fillStyle='#f2a93b';g.fillRect(cx-r*.5,ty-1,r,r*.16);g.fillStyle='#41a6f6';g.fillRect(cx-1,ty-r*.22,2.2,2.2);
  g.fillStyle='#f4f4f4';g.beginPath();ell(g,cx-r*.36,cy-r*.05,r*.2,r*.24);ell(g,cx+r*.36,cy-r*.05,r*.2,r*.24);g.fill();
  g.fillStyle='#1a1c2c';g.beginPath();ell(g,cx-r*.32,cy,r*.1,r*.13);ell(g,cx+r*.32,cy,r*.1,r*.13);g.fill();
  g.fillStyle='#6e1f3a';g.beginPath();g.moveTo(cx-r*.62,cy-r*.45);g.lineTo(cx-r*.15,cy-r*.28);g.lineTo(cx-r*.15,cy-r*.18);g.lineTo(cx-r*.62,cy-r*.32);g.closePath();g.moveTo(cx+r*.62,cy-r*.45);g.lineTo(cx+r*.15,cy-r*.28);g.lineTo(cx+r*.15,cy-r*.18);g.lineTo(cx+r*.62,cy-r*.32);g.closePath();g.fill();
  g.fillStyle='#ff8fc8';g.fillRect(cx-r*.8,cy+r*.25,r*.25,r*.1);g.fillRect(cx+r*.55,cy+r*.25,r*.25,r*.1);}

function remapCanvas(src,map){if(!map||!Object.keys(map).length)return src;const c=newCanvas(src.width,src.height),g=c.getContext('2d');g.drawImage(src,0,0);const id=g.getImageData(0,0,c.width,c.height),d=id.data;
  const tbl={};for(const [a,b] of Object.entries(map)){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);tbl[x]=[y>>16,(y>>8)&255,y&255];}
  for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;const key=(d[i]<<16)|(d[i+1]<<8)|d[i+2],t=tbl[key];if(t){d[i]=t[0];d[i+1]=t[1];d[i+2]=t[2];}}g.putImageData(id,0,0);return c;}

function drawBoss(g,w,h){drawGolem(g,w,h,19,0);const cx=w/2,top=h/2-19*.9;g.fillStyle='#ffcd75';g.beginPath();g.moveTo(cx-12,top+1);g.lineTo(cx-13,top-9);g.lineTo(cx-6,top-4);g.lineTo(cx,top-11);g.lineTo(cx+6,top-4);g.lineTo(cx+13,top-9);g.lineTo(cx+12,top+1);g.closePath();g.fill();
  g.fillStyle='#b13e53';g.fillRect(cx-1.5,top-6,3,3);g.fillStyle='#b13e53';g.fillRect(cx-19*.55,h/2-19*.38,19*.28,19*.16);g.fillRect(cx+19*.27,h/2-19*.38,19*.28,19*.16);}
function summGrid(id,frame){const pal=SUMMONERS[id].pal;return GRID[frame?'playerB':'playerA'].map(r=>[...r].map(ch=>pal[ch]||ch).join(''));}
function playerSpr(frame,face){const id=(S&&S.summ)||'apprentice';return art('pl'+id+frame+face,()=>{const b=fromGrid(summGrid(id,frame));return face<0?flipped(b):b;});}
const portraitURLs={};function portrait(id){return portraitURLs[id]||(portraitURLs[id]=fromGrid(summGrid(id,0)).toDataURL());}
function enemySpr(type,v,f=0){const mid=(S&&S.map)||'meadow';return art(`e${mid}${type}${v}${f}`,()=>{let base;
  if(type==='slime')base=fromGrid(GRID[f?'slimeB':'slimeA']);
  else if(type==='bat')base=fromGrid(GRID[f?'batB':'batA']);
  else if(type==='golem')base=pixelize(24,24,(g,w,h)=>drawGolem(g,w,h,9,f));
  else if(type==='eye')base=fromGrid(GRID.eye);
  else if(type==='shroom')base=fromGrid(GRID.shroom);
  else if(type==='boss')base=pixelize(52,56,drawBoss);
  else if(type==='scorpion')base=fromGrid(GRID.scorpion);
  else if(type==='snowball'||type==='snowlet')base=fromGrid(GRID.snowball);
  else if(type==='imp')base=fromGrid(GRID.imp);
  else if(type==='goldgob')base=fromGrid(GRID.goldgob);
  else if(['troll','charger','archer','turtle'].includes(type))base=fromGrid(GRID[type]);
  else base=pixelize(36,38,(g,w,h)=>drawElite(g,w,h,13));
  if(!['scorpion','snowball','snowlet','imp','goldgob'].includes(type))base=remapCanvas(base,MAPS[mid].remap);
  return tinted(base,v);});}
function shadowSpr(rw){return art('sh'+rw,()=>{const rh=Math.max(1,Math.round(rw*.35)),c=newCanvas(rw*2,rh*2),g=c.getContext('2d');g.fillStyle='rgba(10,10,20,.4)';
  for(let y=0;y<rh*2;y++)for(let x=0;x<rw*2;x++){if(((x+.5-rw)/rw)**2+((y+.5-rh)/rh)**2<1)g.fillRect(x,y,1,1);}return c;});}
// stepped "pixel light" glow
function glowSpr(col,res){return art('g'+col+res,()=>{const s=res*2,c=newCanvas(s,s),g=c.getContext('2d');
  for(let y=0;y<s;y++)for(let x=0;x<s;x++){const d=Math.hypot(x+.5-res,y+.5-res)/res;if(d>=1)continue;const a=d<.3?.85:d<.55?.5:d<.8?.24:.09;g.fillStyle=`rgba(${col},${a})`;g.fillRect(x,y,1,1);}return c;});}
function glow(x,y,r,col,a=1){if(a<=0)return;const res=r<10?3:r<20?5:r<40?7:r<80?10:14;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(glowSpr(col,res),x-r,y-r,r*2,r*2);}
function discSpr(res){return art('disc'+res,()=>{const s=res*2,c=newCanvas(s,s),g=c.getContext('2d');g.fillStyle='#fff';for(let y=0;y<s;y++)for(let x=0;x<s;x++)if(Math.hypot(x+.5-res,y+.5-res)<res)g.fillRect(x,y,1,1);return c;});}
function pxDisc(x,y,r,col,a){const res=Math.max(3,Math.min(40,Math.round(r/PX)));const c=art('disc'+res+col,()=>{const b=discSpr(res),t=newCanvas(b.width,b.height),g=t.getContext('2d');g.drawImage(b,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,t.width,t.height);return t;});ctx.globalAlpha=a;ctx.drawImage(c,x-r,y-r*.85,r*2,r*1.7);ctx.globalAlpha=1;}
function pxRing(x,y,r,col,a=1,sz=PX*1.5,dash=-1){ctx.globalAlpha=Math.min(1,a);ctx.fillStyle=col;const n=Math.max(10,Math.round(6.283*r/(sz*1.25)));
  for(let i=0;i<n;i++){if(dash>=0&&((i+dash)%4)<1.5)continue;const an=i/n*6.283;ctx.fillRect(Math.round(x+Math.cos(an)*r-sz/2),Math.round(y+Math.sin(an)*r*.85-sz/2),sz,sz);}ctx.globalAlpha=1;}
function pxLine(pts,col,sz){ctx.fillStyle=col;for(let i=1;i<pts.length;i++){const [x1,y1]=pts[i-1],[x2,y2]=pts[i],n=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)/(sz*.7)));for(let k=0;k<=n;k++){const q=k/n;ctx.fillRect(Math.round(x1+(x2-x1)*q-sz/2),Math.round(y1+(y2-y1)*q-sz/2),sz,sz);}}}
function groundTile(mid){mid=mid||(S&&S.map)||'meadow';const P=MAPS[mid].ground;return art('ground'+mid,()=>{const N=64,c=newCanvas(N,N),g=c.getContext('2d');g.fillStyle=P.base;g.fillRect(0,0,N,N);
  const put=(x,y,col)=>{g.fillStyle=col;g.fillRect(((x%N)+N)%N,((y%N)+N)%N,1,1);};
  for(let i=0;i<260;i++)put(Math.floor(hash(i,1)*N),Math.floor(hash(i,2)*N),hash(i,3)<.55?P.n1:P.n2);
  for(let i=0;i<9;i++){const x=Math.floor(hash(i,4)*N),y=Math.floor(hash(i,5)*N);for(let k=0;k<14;k++)put(x+Math.floor(hash(i,k+6)*7)-3,y+Math.floor(hash(k,i+30)*5)-2,P.blot);}
  if(P.tiles){g.fillStyle='#1a1c2c';for(let y=0;y<N;y+=16){g.fillRect(0,y,N,1);for(let x=(y/16%2)*8;x<N;x+=16)g.fillRect(x,y,1,16);}}
  for(let i=0;i<26;i++){const x=Math.floor(hash(i,11)*N),y=Math.floor(hash(i,12)*N),cl=hash(i,13)<.5?P.tuft[0]:P.tuft[1],hi=P.hi;
    put(x,y,cl);put(x,y-1,cl);put(x-1,y-2,cl);put(x+1,y-1,hi);put(x+2,y-2,hi);if(hash(i,14)<.5){put(x+3,y,cl);put(x+3,y-1,hi);}}
  for(let i=0;i<7;i++){const x=Math.floor(hash(i,21)*N),y=Math.floor(hash(i,22)*N);put(x,y,P.peb[0]);put(x+1,y,P.peb[1]);put(x,y+1,P.peb[2]);}
  for(let i=0;i<6;i++){const x=Math.floor(hash(i,31)*N),y=Math.floor(hash(i,32)*N),col=P.dots[i%3];put(x,y,col);put(x,y+1,P.tuft[1]);}
  return c;});}
let groundPat=null;
function snapK(){return SC*DPR;}
function blitA(c,x,y){const k=snapK(),w=c.width*PX,h=c.height*PX;ctx.drawImage(c,Math.round((x-w/2)*k)/k,Math.round((y-h/2)*k)/k,w,h);}

const FF=[];for(let i=0;i<34;i++)FF.push({x:Math.random(),y:Math.random(),ph:Math.random()*6.28,sp:.3+Math.random()*.6,par:.25+Math.random()*.5});
function drawFireflies(px,py,t,scale){
  for(const f of FF){const wx=W+60,wy=H+60;let x=((f.x*wx-px*scale*f.par+Math.sin(t*f.sp+f.ph)*30)%wx+wx)%wx-30,y=((f.y*wy-py*scale*f.par+Math.cos(t*f.sp*.8+f.ph)*24)%wy+wy)%wy-30;
    const on=Math.sin(t*2*f.sp+f.ph);if(on<-.2)continue;const s=Math.max(2,Math.round(PX*scale));ctx.globalAlpha=on>.4?.9:.45;ctx.fillStyle='#a7f070';ctx.fillRect(Math.round(x),Math.round(y),s,s);
    ctx.globalAlpha=on>.4?.25:.1;ctx.fillRect(Math.round(x)-s,Math.round(y)-s,s*3,s*3);}
  ctx.globalAlpha=1;
}

// ---------- render ----------
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.imageSmoothingEnabled=false;
  if(!S){drawTitleBg();return;}
  const p=S.p,hw=W/2/SC,hh=H/2/SC,t=S.t,k=snapK();
  const dgm=DG();let camX=(dgm?0:p.x)+(S.shake>0?rnd(-1,1)*S.shake:0),camY=(dgm?0:p.y)+(S.shake>0?rnd(-1,1)*S.shake:0);
  camX=Math.round(camX*k)/k;camY=Math.round(camY*k)/k;
  ctx.setTransform(DPR*SC,0,0,DPR*SC,Math.round(DPR*(W/2-SC*camX)),Math.round(DPR*(H/2-SC*camY)));ctx.imageSmoothingEnabled=false;
  // ground
  if(!groundPat||groundPat._m!==S.map){groundPat=ctx.createPattern(groundTile(),'repeat');groundPat._m=S.map;if(groundPat.setTransform&&window.DOMMatrix)groundPat.setTransform(new DOMMatrix().scale(PX));}
  ctx.fillStyle=groundPat;ctx.fillRect(camX-hw-8,camY-hh-8,hw*2+16,hh*2+16);
  // decorations
  const D=170,glowDeco=[];
  for(let i=Math.floor((camX-hw)/D)-1;i<=Math.floor((camX+hw)/D)+1;i++)for(let j=Math.floor((camY-hh)/D)-1;j<=Math.floor((camY+hh)/D)+1;j++){
    if(hash(i*3+11,j*7+5)>.34)continue;const kk=Math.floor(hash(j+99,i)*decoCount()),x=i*D+hash(i,j+3)*D,y=j*D+hash(j,i+5)*D;
    blitA(decoSpr(kk),x,y);if(decoGlow(kk))glowDeco.push([x,y,decoGlow(kk)]);}
  if(dgm)drawRoomBack(t);
  // thorns aura
  for(const it of S.eq)if(it.id==='thorns'){const rad=55+15*it.star;pxDisc(p.x,p.y,rad,'#38b764',.08);pxRing(p.x,p.y,rad,'#38b764',.8,PX*1.5,Math.floor(t*6));
    ctx.fillStyle='#a7f070';for(let q=0;q<10;q++){const a=q*.628+t*.7;ctx.fillRect(Math.round(p.x+Math.cos(a)*rad-2),Math.round(p.y+Math.sin(a)*rad*.85-2),4,4);}}
  // zones
  for(const z of S.zones){const kz=Math.min(1,z.life/z.max*2);
    if(z.kind==='fire'){pxDisc(z.x,z.y,z.r,'#6e1f3a',.55*kz);pxDisc(z.x,z.y,z.r*.7,'#b13e53',.35*kz);
      ctx.fillStyle='#ffcd75';for(let q=0;q<3;q++){const a=Math.random()*6.283,d=Math.random()*z.r*.8;ctx.fillRect(Math.round(z.x+Math.cos(a)*d),Math.round(z.y+Math.sin(a)*d*.8-Math.random()*10),PX,PX*2);}}
    else if(z.kind==='vortex'){pxDisc(z.x,z.y,z.r,'#41a6f6',.15*kz);for(let q=0;q<3;q++)pxRing(z.x,z.y,z.r*(.3+q*.3),q===1?'#a77bf3':'#73eff7',.8*kz,PX*1.5,Math.floor(t*16+q*3));}
    else if(z.kind==='frost'){pxDisc(z.x,z.y,z.r,'#41a6f6',.18*kz);pxRing(z.x,z.y,z.r,'#73eff7',.6*kz,PX,Math.floor(t*8));ctx.fillStyle='#f4f4f4';for(let q=0;q<5;q++){const a=Math.random()*6.283,d=Math.random()*z.r;ctx.fillRect(Math.round(z.x+Math.cos(a)*d),Math.round(z.y+Math.sin(a)*d*.85),PX,PX);}}
    else if(z.kind==='holy'){pxDisc(z.x,z.y,z.r,'#fff1b0',.18*kz);pxRing(z.x,z.y,z.r,'#ffcd75',.7*kz,PX,Math.floor(t*8));ctx.fillStyle='#f4f4f4';if(Math.random()<.6)ctx.fillRect(Math.round(z.x+rnd(-z.r,z.r)*.7),Math.round(z.y+rnd(-z.r,z.r)*.6),PX,PX*2);}
    else if(z.kind==='poison'){pxDisc(z.x,z.y,z.r,'#38b764',.25*kz);ctx.fillStyle='#a7f070';for(let q=0;q<2;q++){const a=Math.random()*6.283,d=Math.random()*z.r*.8;ctx.fillRect(Math.round(z.x+Math.cos(a)*d),Math.round(z.y+Math.sin(a)*d*.8-Math.random()*8),PX,PX);}}
    else if(z.kind==='twister'){for(let q=0;q<3;q++)pxRing(z.x,z.y-q*6,z.r*(.35+q*.28),q===1?'#f4f4f4':'#a77bf3',.85*kz,PX,Math.floor(t*14+q*2));}
    else pxRing(z.x,z.y,z.r*.6,'#a77bf3',.55*kz,PX,Math.floor(t*10));}
  if(st.nature5){const nr=st.nature6?220:140;pxDisc(p.x,p.y,nr,'#38b764',.1);pxRing(p.x,p.y,nr,'#a7f070',.9,PX*1.5,Math.floor(t*10));pxRing(p.x,p.y,110,'#38b764',.6,PX,Math.floor(-t*8));}
  // thunder trees + pending seeds/spikes
  for(const tr of S.turrets){if(tr.life<2&&Math.floor(t*8)%2)continue;blitA(shadowSpr(8),tr.x,tr.y+10);const c=icon('thundertree'),k2=snapK();ctx.drawImage(c,Math.round((tr.x-c.width*PX*.75)*k2)/k2,Math.round((tr.y-c.height*PX*1.5+8)*k2)/k2,c.width*PX*1.5,c.height*PX*1.5);}
  for(const f of S.fx)if(f.k==='dboom'&&!f.done){if(f.seed){ctx.fillStyle=Math.floor(t*8)%2?'#ef7d57':'#38b764';ctx.fillRect(Math.round(f.x)-3,Math.round(f.y)-3,6,6);pxRing(f.x,f.y,f.r*(1-f.t/f.max),'#ffcd75',.6,PX);}else if(f.t<.08){ctx.fillStyle='#73eff7';ctx.fillRect(Math.round(f.x)-3,Math.round(f.y)-10,6,12);ctx.fillStyle='#f4f4f4';ctx.fillRect(Math.round(f.x)-1,Math.round(f.y)-12,2,4);}}
  for(const h of S.hz){if(h.k==='lava'){const q=Math.min(1,h.t/1.5,(h.max-h.t)/.6);pxDisc(h.x,h.y,h.r,'#b13e53',.55*q);pxDisc(h.x,h.y,h.r*.65,'#ef7d57',.45*q);ctx.fillStyle='#ffcd75';if(Math.random()<.5)ctx.fillRect(Math.round(h.x+rnd(-h.r,h.r)*.6),Math.round(h.y+rnd(-h.r,h.r)*.5),PX,PX);}
    else{const q=1-h.t/h.max;pxRing(h.x,h.y,h.r,'#73eff7',.5+.5*q,PX*1.5,Math.floor(t*12));const fy=h.y-200*(1-q);ctx.fillStyle='#f4f4f4';ctx.fillRect(Math.round(h.x)-2,Math.round(fy)-10,4,14);ctx.fillStyle='#73eff7';ctx.fillRect(Math.round(h.x)-2,Math.round(fy)+2,4,4);}}
  // spore mines
  for(const mn of S.mines){if(mn.arm<=0&&Math.floor(t*4)%2)continue;blitA(icon(mn.frost?'frostmine':'spore'),mn.x,mn.y);}
  // meteor markers
  for(const f of S.fx)if(f.k==='meteor'&&!f.done){const q=1-f.t/f.max;pxDisc(f.x,f.y,f.r,'#b13e53',.12+.18*q);pxRing(f.x,f.y,f.r,'#ef7d57',.9,PX*1.5,Math.floor(t*12));}
  // gems + chests
  const gs=art('gem',()=>fromGrid(GRID.gem));
  for(const g of S.gems){if(g.chest){blitA(art('chest',()=>fromGrid(GRID.chest)),g.x,g.y-(Math.floor(t*3)%2)*PX);continue;}
    const b=(Math.floor(t*3+g.x*.05)%2)*PX*.5;if(g.big){const c=gs,k2=snapK();ctx.drawImage(c,Math.round((g.x-c.width*PX*.75)*k2)/k2,Math.round((g.y-b-c.height*PX*.75)*k2)/k2,c.width*PX*1.5,c.height*PX*1.5);}else blitA(gs,g.x,g.y-b);}
  // field items
  for(const f of S.items){if(f.life<6&&Math.floor(f.life*6)%2===0)continue;const by=(Math.floor(t*3+f.t)%2)*PX;
    blitA(shadowSpr(6),f.x,f.y+14);pxRing(f.x,f.y-by,17,`rgb(${FIELD[f.k].col})`,.9,PX,Math.floor(t*8));blitA(icon(f.k),f.x,f.y-by);}
  // enemy shadows
  for(const e of S.enemies){if(e.type==='bat')blitA(shadowSpr(4),e.x,e.y+e.r+9);else blitA(shadowSpr(Math.max(4,Math.round(e.r*.55))),e.x,e.y+e.r*.85);}
  // enemies
  for(const e of S.enemies){
    const v=e.flash>0&&Math.floor(t*30+e.wob)%2===0?'f':e.frozenT>0?'z':'n';let f=0,oy=0;
    if(e.type==='slime')f=Math.floor(t*4+e.wob)%2;
    else if(e.type==='bat'){f=Math.floor(t*10+e.wob*3)%2;oy=-Math.round(Math.sin(t*6+e.wob)*2);}
    else if(e.type==='golem')f=Math.floor(t*3+e.wob)%2;
    else if(e.type==='eye')oy=-Math.round(Math.sin(t*3+e.wob)*3);
    else oy=-(Math.floor(t*3+e.wob)%2)*PX;
    if(v==='z')f=0;
    const spr=enemySpr(e.type,v,f),cy=e.type==='elite'?e.y-e.r*.35:e.type==='boss'?e.y-e.r*.25:e.y-(e.type==='slime'?2:0);
    if(e.type==='snowlet'){const k2=snapK();ctx.drawImage(spr,Math.round((e.x-spr.width*PX*.3)*k2)/k2,Math.round((cy+oy-spr.height*PX*.3)*k2)/k2,spr.width*PX*.6,spr.height*PX*.6);}else blitA(spr,e.x,cy+oy);
    if(e.slowT>0&&v==='n'){ctx.globalAlpha=.4;blitA(enemySpr(e.type,'z',f),e.x,cy+oy);ctx.globalAlpha=1;}
    if(e.type==='charger'&&e.stun>0){ctx.fillStyle='#ffcd75';for(let q=0;q<3;q++){const a=t*6+q*2.1;ctx.fillRect(Math.round(e.x+Math.cos(a)*14)-2,Math.round(e.y-e.r-8+Math.sin(a)*4)-2,4,4);}}
    if(e.type==='elite'||e.type==='golem'||e.type==='boss'){const w=Math.round(e.r*2),x0=Math.round(e.x-e.r),y0=Math.round(e.y-e.r-(e.type==='elite'?e.r*1.15:14));
      ctx.fillStyle='#1a1c2c';ctx.fillRect(x0-2,y0-2,w+4,8);ctx.fillStyle='#333c57';ctx.fillRect(x0,y0,w,4);
      ctx.fillStyle=e.type==='elite'?'#b13e53':'#ef7d57';ctx.fillRect(x0,y0,Math.round(w*Math.max(0,e.hp/e.max)),4);ctx.fillStyle=e.type==='elite'?'#ff8fc8':'#ffcd75';ctx.fillRect(x0,y0,Math.round(w*Math.max(0,e.hp/e.max)),2);}
  }
  // enemy bullets
  for(const e of S.enemies){
    if(e.type==='charger'&&e.aimT>0){ctx.globalAlpha=.4+.4*(Math.floor(t*10)%2);const pts=[[e.x,e.y],[e.x+e.ddx*300,e.y+e.ddy*300]];pxLine(pts,'#b13e53',PX*3);ctx.globalAlpha=1;}
    if(e.type==='archer'&&e.aimT>0&&e.aimA!=null){ctx.globalAlpha=.55;const pts=[[e.x,e.y],[e.x+Math.cos(e.aimA)*240,e.y+Math.sin(e.aimA)*240]];pxLine(pts,'#ff8fc8',PX);ctx.globalAlpha=1;}}
  for(const a of S.atk){const q=1-a.t/a.max;pxDisc(a.x,a.y,a.r,'#b13e53',.12+.3*q);pxRing(a.x,a.y,a.r,'#ef7d57',.8,PX*1.5,Math.floor(t*10));
    const fq=Math.max(0,(q-.4)/.6),bx=a.sx+(a.x-a.sx)*fq,by=a.sy+(a.y-a.sy)*fq-Math.sin(Math.PI*fq)*90;const rk=art('rock',()=>fromGrid(GRID.rock));
    blitA(shadowSpr(6),a.x+(a.sx-a.x)*(1-fq),a.y+(a.sy-a.y)*(1-fq)+4);ctx.drawImage(rk,Math.round(bx-rk.width*1.5),Math.round(by-rk.height*1.5),rk.width*PX*1.5,rk.height*PX*1.5);}
  for(const b of S.eproj){if(b.arrow){const l=Math.hypot(b.vx,b.vy)||1,ux=b.vx/l,uy=b.vy/l;pxLine([[b.x-ux*10,b.y-uy*10],[b.x,b.y]],'#1a1c2c',PX*2);pxLine([[b.x-ux*9,b.y-uy*9],[b.x,b.y]],'#f4f4f4',PX);continue;}
    const s2=b.big?10:8;ctx.fillStyle='#1a1c2c';ctx.fillRect(Math.round(b.x-s2/2)-2,Math.round(b.y-s2/2)-2,s2+4,s2+4);ctx.fillStyle=b.col||(b.big?'#b13e53':'#ff8fc8');ctx.fillRect(Math.round(b.x-s2/2),Math.round(b.y-s2/2),s2,s2);ctx.fillStyle='#f4f4f4';ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-1,2,2);}
  // frost ring crystals
  const cr=art('crystal',()=>fromGrid(GRID.crystal));
  for(const it of S.eq)if(it.id==='frostring'){const n=2+it.star;for(let q=0;q<n;q++){const a=S.ringA+q*6.283/n;blitA(cr,p.x+Math.cos(a)*78,p.y+Math.sin(a)*78);}}
  // projectiles
  const fb=art('fireball',()=>fromGrid(GRID.fireball,false)),ln=art('lance',()=>fromGrid(GRID.lance,false)),bm=art('boomer',()=>fromGrid(GRID.boomer));
  for(const b of S.proj){
    if(b.k==='bolt')blitA(fb,b.x,b.y);
    else if(b.k==='lance'){ctx.save();ctx.translate(Math.round(b.x),Math.round(b.y));ctx.rotate(Math.round(b.a/(Math.PI/8))*(Math.PI/8));ctx.drawImage(ln,-ln.width*PX/2,-ln.height*PX/2,ln.width*PX,ln.height*PX);ctx.restore();}
    else if(b.k==='shard'){ctx.fillStyle=b.col;ctx.fillRect(Math.round(b.x)-3,Math.round(b.y)-3,6,6);ctx.fillStyle='#f4f4f4';ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-1,2,2);}
    else if(b.k==='flame'){const q=b.life/b.max,sz=Math.round((q>.5?8:q>.25?6:4));ctx.fillStyle=b.purple?(q>.6?'#ff8fc8':q>.3?'#d0507a':'#5d275d'):q>.6?'#ffcd75':q>.3?'#ef7d57':'#b13e53';ctx.fillRect(Math.round(b.x-sz/2),Math.round(b.y-sz/2),sz,sz);}
    else if(b.k==='steam'){ctx.fillStyle='#f4f4f4';ctx.fillRect(Math.round(b.x)-5,Math.round(b.y)-5,10,10);ctx.fillStyle='#73eff7';ctx.fillRect(Math.round(b.x)-5,Math.round(b.y)+1,10,4);ctx.fillStyle='#ef7d57';ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-5,4,4);}

    else if(b.k==='lshot'){const l=Math.hypot(b.vx,b.vy)||1;pxLine([[b.x-b.vx/l*14,b.y-b.vy/l*14],[b.x,b.y]],'#fff1b0',PX*2);pxLine([[b.x-b.vx/l*8,b.y-b.vy/l*8],[b.x,b.y]],'#f4f4f4',PX);}
    else if(b.k==='void'){pxDisc(b.x,b.y,b.r,'#1a1c2c',.95);pxRing(b.x,b.y,b.r+3,'#d0507a',.9,PX,Math.floor(t*12));pxRing(b.x,b.y,b.r*2.2,'#5d275d',.5,PX,Math.floor(-t*10));}
    else if(b.k==='orb')blitA(art('orb',()=>fromGrid(GRID.orb)),b.x,b.y-(Math.floor(t*6)%2)*PX);

// title scene drawn at quarter resolution, then scaled up crisp
let titleCv=null;
function drawTitleBg(){
  const t=performance.now()/1000,q=4,w=Math.ceil(W/q),h=Math.ceil(H/q);
  if(!titleCv||titleCv.width!==w||titleCv.height!==h)titleCv=newCanvas(w,h);
  const g=titleCv.getContext('2d');
  const bands=['#0f1024','#141631','#1a1c3a','#202448','#262b56','#2c3263'];
  for(let i=0;i<bands.length;i++){g.fillStyle=bands[i];g.fillRect(0,Math.floor(h*.62*i/bands.length),w,Math.ceil(h*.62/bands.length)+1);}
  for(let i=0;i<90;i++){const x=Math.floor(hash(i,1)*w),y=Math.floor(hash(i,2)*h*.55),on=Math.sin(t*(.6+hash(i,3)*1.5)+i)>-.3;if(!on)continue;g.fillStyle=hash(i,4)<.2?'#ffcd75':'#f4f4f4';g.fillRect(x,y,1,1);if(hash(i,5)<.08){g.fillRect(x-1,y,3,1);g.fillRect(x,y-1,1,3);}}
  const mx=Math.floor(w*.78),my=Math.floor(h*.15),mr=Math.max(5,Math.floor(Math.min(w,h)*.075));
  g.fillStyle='rgba(59,93,201,.18)';for(let r=mr*3;r>mr;r-=Math.max(2,Math.floor(mr*.5))){g.beginPath();g.arc(mx,my,r,0,6.283);g.fill();}
  for(let y=-mr;y<=mr;y++)for(let x=-mr;x<=mr;x++){const d=x*x+y*y;if(d<=mr*mr){const fl=performance.now()-moonFlash<160;g.fillStyle=d>(mr-1)*(mr-1)?(fl?'#f2a93b':'#94b0c2'):(fl?'#ffcd75':'#f4f4f4');g.fillRect(mx+x,my+y,1,1);}}
  g.fillStyle='#94b0c2';g.fillRect(mx-Math.floor(mr*.4),my-Math.floor(mr*.2),2,2);g.fillRect(mx+Math.floor(mr*.3),my+Math.floor(mr*.3),2,1);
  const hill=(base,amp,col,f,ph)=>{g.fillStyle=col;for(let x=0;x<w;x++){const y=Math.floor(h*base+Math.sin(x*f*q+ph)*amp/q+Math.sin(x*f*q*2.3+ph*1.7)*amp*.4/q);g.fillRect(x,y,1,h-y);}};
  hill(.5,22,'#29366f',.006,1);hill(.57,18,'#1f2944',.009,4);
  g.fillStyle='#1f2944';for(let i=0;i<14;i++){const x=Math.floor(hash(i,9)*w),base=Math.floor(h*.57+Math.sin(x*q*.009+4)*18/q+Math.sin(x*q*.009*2.3+6.8)*7.2/q),th=Math.floor((26+hash(i,8)*30)/q);for(let yy=0;yy<th;yy++){const hw2=Math.floor(yy*.32);g.fillRect(x-hw2,base-th+yy,hw2*2+1,1);}}
  hill(.64,12,'#1a1c2c',.012,2);
  for(let i=0;i<9;i++){if(Math.sin(t*1.5+i)<-.5)continue;g.fillStyle='#ffcd75';g.fillRect(Math.floor(hash(i,61)*w),Math.floor(h*.6+hash(i,62)*h*.08),1,1);}
  for(const f of FF){const x=Math.floor(((f.x*w+Math.sin(t*f.sp+f.ph)*6+t*3)%w+w)%w),y=Math.floor(f.y*h*.9),on=Math.sin(t*2*f.sp+f.ph);if(on<0)continue;g.fillStyle=on>.5?'#a7f070':'#38b764';g.fillRect(x,y,1,1);}
  ctx.imageSmoothingEnabled=false;ctx.drawImage(titleCv,0,0,w*q,h*q);
}

// ---------- hud ----------
let lastHud='';
function hud(){
  if(!S)return;
  const p=S.p,g=Math.floor(S.gem),c=Math.min(...S.shop.filter(Boolean).map(priceOf),99);
  const key=[DG()?S.floor:0,R(S.shield||0),R(p.maxhp),Math.floor(S.t),g,S.kills,c,S.newStock,S.lv,Math.floor(S.xp)].join('|');
  if(key===lastHud)return;lastHud=key;
  el.hpbar.style.width=(100*p.hp/p.maxhp)+'%';
  el.shbar.style.width=(100*Math.min(1,(S.shield||0)/p.maxhp))+'%';
  el.xpbar.style.width=(100*S.xp/xpNeed(S.lv))+'%';
  el.lvl.textContent=`Lv.${S.lv}`;
  el.hptext.textContent=`${R(p.hp)} / ${R(p.maxhp)}`;
  el.timer.textContent=DG()?`${S.floor+1}층`:fmt(S.t);
  el.gems.textContent=`◆ ${g}`;
  el.kills.textContent=`처치 ${S.kills}`;
  el.cost.textContent=DG()?'배치':c<99?`◆ ${c}~`:'품절';el.drawBtn.querySelector('span').textContent=DG()?'가방':'상점';
  el.drawBtn.classList.toggle('poor',g<c);
  let dot=el.drawBtn.querySelector('.dot');
  if(S.newStock&&!dot){dot=document.createElement('span');dot.className='dot';el.drawBtn.appendChild(dot);}
  else if(!S.newStock&&dot)dot.remove();
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
  if(mode==='play')for(let i=0;i<speedMul&&mode==='play';i++)update(dt);
  if(mode==='play'&&S&&S.perkQ>0)showPerk();
  if(popT>0){popT-=dt;if(popT<=0)el.pop.classList.remove('show');}
  if(toastT>0){toastT-=dt;if(toastT<=0)el.toast.classList.remove('show');}
  render();hud();
  el.overlay.classList.toggle('title',mode==='title');
  $('app').classList.toggle('titlemode',mode==='title');
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
})();
