<title>별빛 소환사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: full-bleed canvas field, HUD pinned to the top, spell tray + summon button pinned to the bottom. Single deliberate night theme. */
:root{
  --night:#0f1226;
  --ink:#ece9ff;
  --muted:#9d9ac8;
  --gold:#ffcf5a;
  --panel:rgba(22,24,52,.86);
  --line:rgba(170,160,255,.22);
  --fire:#ff7a45;
  --frost:#6fd3ff;
  --storm:#c79bff;
  --nature:#7ee08a;
  --hp:#ff5d7a;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--display);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#hud{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
.bars{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.xpwrap{height:6px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden}
#xpbar{height:100%;width:0;background:linear-gradient(90deg,#8fd0ff,#c79bff);transition:width .2s}
#lvl{color:#8fd0ff}
.hpwrap{position:relative;height:18px;border-radius:9px;background:rgba(0,0,0,.45);border:1px solid var(--line);overflow:hidden}
#hpbar{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#ff3d64,var(--hp));transition:width .15s}
#hptext{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;text-shadow:0 1px 2px #000}
#timer{font-size:22px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#pauseBtn{pointer-events:auto;width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.stat{font-size:15px;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
#gems{color:var(--gold)}
#kills{color:var(--muted)}
#syn{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid currentColor;opacity:.55}
.pill.on{opacity:1;background:rgba(0,0,0,.6);box-shadow:0 0 10px -2px currentColor}

#tray{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:stretch;justify-content:center;background:linear-gradient(to top,rgba(10,11,28,.95),rgba(10,11,28,.6) 70%,transparent)}
#slots{display:grid;grid-template-columns:repeat(5,minmax(0,54px));gap:5px;min-width:0;align-content:center}
.slot{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;background:rgba(255,255,255,.04);border:1.5px dashed var(--line);display:grid;place-items:center;font-size:24px;padding:0}
.slot.full{border-style:solid;border-color:var(--tc);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tc) 28%,transparent),rgba(0,0,0,.35))}
.slot .st{position:absolute;bottom:1px;left:0;right:0;font-size:10px;color:var(--gold);letter-spacing:-1px;text-align:center}
.slot .rr{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%}
.slot.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
#drawBtn{min-width:80px;border-radius:16px;background:linear-gradient(160deg,#ffd970,#ff9f43);color:#2a1600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 #b4621a,0 0 18px rgba(255,190,80,.4);font-size:20px;padding:6px 10px}
#drawBtn b{font-size:14px;font-weight:normal;background:rgba(0,0,0,.18);border-radius:99px;padding:1px 8px}
#drawBtn:disabled{filter:grayscale(.8) brightness(.6);box-shadow:0 4px 0 #333}
#drawBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b4621a}
#drawBtn{position:relative}
#drawBtn.poor{filter:saturate(.45) brightness(.8)}
#drawBtn .dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--hp);border:2px solid var(--night)}
.shop{gap:10px}
.shophead{display:flex;justify-content:space-between;align-items:center}
.lvrow{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border-radius:12px;padding:6px 6px 6px 12px;text-align:left}
.lvrow .lv{font-size:16px;color:var(--gold);flex:none}
.lvrow .odds{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 8px;font-size:11px;font-variant-numeric:tabular-nums}
.lvrow .nx{flex:none;font-size:11px;color:var(--muted);text-align:right;line-height:1.3}
.bal{color:var(--gold);font-size:24px;font-variant-numeric:tabular-nums}
.card p.small{font-size:13px;line-height:1.4}
.offers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.offer{position:relative;border-radius:14px;padding:8px 3px 6px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--tc) 22%,transparent),rgba(0,0,0,.35));border:1.5px solid var(--tc);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:118px;min-width:0}
.offer .ic{font-size:26px;line-height:1.1}
.offer .nm{font-size:12px;line-height:1.2;word-break:keep-all}
.offer .meta{font-size:10px}
.offer .bd{font-size:10px;color:var(--muted);line-height:1.25;word-break:keep-all}
.offer .sy{font-size:10px;line-height:1.2;word-break:keep-all}
.offer.myth{background:radial-gradient(circle at 50% 30%,rgba(255,107,214,.35),rgba(80,40,140,.35));border-color:#ff6bd6;animation:myth 2s linear infinite}
@keyframes myth{0%,100%{box-shadow:0 0 14px -2px #ff6bd6}50%{box-shadow:0 0 22px 0 #8fd0ff}}
.offer.merge{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(255,207,90,.5)}
.offer.merge .bd{color:var(--gold)}
.offer .pr{margin-top:auto;font-size:12px;background:rgba(0,0,0,.35);border-radius:99px;padding:1px 7px;color:var(--gold)}
.offer:disabled{opacity:.45;cursor:default}
.offer.empty{border-style:dashed;border-color:var(--line);background:none;color:var(--muted);justify-content:center;font-size:11px;word-break:keep-all}
.offer.empty b{color:var(--gold);font-weight:normal}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.cell{aspect-ratio:1;border-radius:10px;font-size:22px;background:rgba(255,255,255,.04);border:1.5px dashed var(--line);position:relative;padding:0;max-width:100%;transition:transform .1s}
.cell.has{border-style:solid;border-color:var(--tc);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tc) 24%,transparent),rgba(0,0,0,.35))}
.eq .cell{border-width:2px}
.eq .cell.has{box-shadow:0 0 12px -3px var(--tc)}
.cell.sel{outline:2px solid var(--gold);outline-offset:1px;transform:scale(.92)}
.cell.target:not(.sel){border-color:rgba(255,207,90,.45)}
.cell small{position:absolute;bottom:1px;left:0;right:0;font-size:9px;color:var(--gold);letter-spacing:-1px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;text-align:left;margin-bottom:-4px}
.lbl span{font-size:12px;color:var(--muted)}
.act{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:14px;background:rgba(0,0,0,.3);border-radius:12px;padding:6px 6px 6px 12px;text-align:left;min-height:44px;box-sizing:border-box}
.act .ghost{padding:7px 10px;font-size:14px;flex:none}
.act p{font-size:12px}
.ghost.on{border-color:var(--gold);color:var(--gold)}
.ghost:disabled{opacity:.45}

#pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;background:var(--panel);border:2px solid var(--tc,var(--line));border-radius:18px;padding:14px 22px;text-align:center;min-width:160px;box-shadow:0 0 30px -6px var(--tc,transparent)}
#pop.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#pop .ic{font-size:40px}
#pop .nm{font-size:20px}
#pop .sub{font-size:13px;color:var(--muted)}
#pop .mg{font-size:16px;color:var(--gold)}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translateX(-50%);font-size:15px;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}

#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,9,24,.72);backdrop-filter:blur(3px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 20px;width:min(380px,100%);max-height:calc(100% - 40px);overflow:auto;display:flex;flex-direction:column;gap:12px;text-align:center}
.card h1{margin:0;font-size:34px;font-weight:normal;color:var(--gold);text-shadow:0 0 18px rgba(255,207,90,.45);text-wrap:balance}
.card h2{margin:0;font-size:24px;font-weight:normal;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.how{display:grid;gap:8px;text-align:left;font-size:14px;line-height:1.45}
.how div{display:flex;gap:10px;align-items:flex-start}
.how span:first-child{font-size:20px;line-height:1.1;width:26px;text-align:center;flex:none}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left;font-size:12px}
.traits div{border:1px solid currentColor;border-radius:10px;padding:6px 8px;line-height:1.4}
.traits small{color:var(--ink);opacity:.8;display:block}
.big{font-size:20px;padding:12px;border-radius:14px;background:linear-gradient(160deg,#ffd970,#ff9f43);color:#2a1600;box-shadow:0 4px 0 #b4621a}
.ghost{font-size:16px;padding:10px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.btns{display:flex;gap:8px}
.btns button{flex:1}
.statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statsgrid div{background:rgba(0,0,0,.3);border-radius:12px;padding:8px;font-variant-numeric:tabular-nums}
.statsgrid b{display:block;font-weight:normal;font-size:22px}
.statsgrid span{font-size:12px;color:var(--muted)}
.info-ic{font-size:52px;line-height:1}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid currentColor;margin:0 2px}
.desc{background:rgba(0,0,0,.3);border-radius:12px;padding:10px;font-size:14px;line-height:1.5;text-align:left}
.desc .nx{color:var(--muted);font-size:13px}
.spl{font-size:13px;color:var(--muted);margin-top:4px}
.spl.on{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="row">
      <div class="bars"><div class="hpwrap"><div id="hpbar"></div><span id="hptext">100 / 100</span></div><div class="xpwrap"><div id="xpbar"></div></div></div>
      <div id="timer">00:00</div>
      <button id="pauseBtn" aria-label="일시정지">❚❚</button>
    </div>
    <div class="row"><span class="stat" id="lvl">Lv.1</span><span class="stat" id="gems">◆ 0</span><span class="stat" id="kills">처치 0</span></div>
    <div id="syn"></div>
  </div>
  <div id="toast"></div>
  <div id="pop"></div>
  <div id="tray">
    <div id="slots"></div>
    <button id="drawBtn" aria-label="상점 열기"><span>상점</span><b id="cost">◆ 3~</b></button>
  </div>
  <div id="overlay"></div>
</div>

<script>
(()=>{
'use strict';
// ---------- data ----------
const TRAITS={
  fire:{name:'화염',color:'#ff7a45',fx:['모든 피해 +30%','피해 +60%, 처치한 적이 폭발']},
  frost:{name:'냉기',color:'#6fd3ff',fx:['맞은 적 40% 둔화','60% 둔화, 둔화된 적 받는 피해 +30%']},
  storm:{name:'폭풍',color:'#c79bff',fx:['재사용 대기 -25%','-40%, 25% 확률로 한 번 더 발동']},
  nature:{name:'자연',color:'#7ee08a',fx:['초당 2 회복, 최대 체력 +30','초당 5 회복, 체력 +80, 이동 +10%']},
};
const RAR=[{name:'일반',col:'#a9a6d0'},{name:'희귀',col:'#5aa8ff'},{name:'전설',col:'#ffcf5a'},{name:'신화',col:'#ff6bd6'}];
const M=[0,1,1.8,3.2];
const R=n=>Math.round(n);
const ITEMS={
  firebolt:{name:'불꽃탄',icon:'🔥',trait:'fire',rar:0,w:1,desc:s=>`가장 가까운 적 ${s}명에게 불꽃을 쏩니다. 피해 ${R(13*M[s])}`},
  meteor:{name:'운석 낙하',icon:'☄️',trait:'fire',rar:2,w:1,desc:s=>`적 무리 위에 운석 ${s}개를 떨어뜨립니다. 범위 피해 ${R(45*M[s])}`},
  fireorb:{name:'화염 구슬',icon:'🔮',trait:'fire',rar:2,w:0,desc:s=>`모든 피해 +${[0,12,25,45][s]}%`},
  frostring:{name:'서리 고리',icon:'❄️',trait:'frost',rar:0,w:1,desc:s=>`얼음 조각 ${2+s}개가 주위를 돕니다. 피해 ${R(7*M[s])}`},
  lance:{name:'얼음 창',icon:'🧊',trait:'frost',rar:1,w:1,desc:s=>`움직이는 방향으로 관통하는 창 ${s}개. 피해 ${R(20*M[s])}`},
  frostarmor:{name:'서리 갑옷',icon:'🛡️',trait:'frost',rar:1,w:0,desc:s=>`받는 피해 -${[0,12,22,35][s]}%`},
  chain:{name:'연쇄 번개',icon:'⚡',trait:'storm',rar:1,w:1,desc:s=>`번개가 적 ${2+s}명 사이를 튑니다. 피해 ${R(15*M[s])}`},
  whirl:{name:'회오리 부메랑',icon:'🌀',trait:'storm',rar:1,w:1,desc:s=>`날아갔다 돌아오는 회오리 ${s}개. 피해 ${R(12*M[s])}`},
  boots:{name:'바람 장화',icon:'👢',trait:'storm',rar:0,w:0,desc:s=>`이동 속도 +${[0,10,18,30][s]}%, 재사용 대기 -${[0,5,10,16][s]}%`},
  thorns:{name:'가시 덩굴',icon:'🌿',trait:'nature',rar:0,w:1,desc:s=>`주변 ${55+15*s} 거리 안의 적에게 지속 피해 ${R(5*M[s])}`},
  lifetree:{name:'생명 나무',icon:'🌳',trait:'nature',rar:0,w:0,desc:s=>`최대 체력 +${[0,25,50,90][s]}, 초당 회복 +${[0,.5,1.2,2.5][s]}`},
  sun:{name:'태양 강림',icon:'☀️',trait:'fire',rar:3,w:1,desc:s=>`3초마다 주변 ${150+20*s} 거리를 태양 폭발로 휩쓸어요. 피해 ${R(55*M[s])}`},
  zero:{name:'절대영도',icon:'💠',trait:'frost',rar:3,w:1,desc:s=>`6초마다 화면의 모든 적을 ${(1.2+.4*s).toFixed(1)}초 얼려요. 피해 ${R(20*M[s])}`},
  thunder:{name:'천둥신의 분노',icon:'🌩️',trait:'storm',rar:3,w:1,desc:s=>`1.2초마다 하늘에서 벼락 ${3+2*s}줄기가 떨어져요. 피해 ${R(28*M[s])}`},
  worldtree:{name:'세계수',icon:'🌲',trait:'nature',rar:3,w:0,desc:s=>`최대 체력 +${[0,60,120,200][s]}, 초당 회복 +${[0,2,4,7][s]}. 쓰러지면 부활 (게임당 ${s}번)`},
  acorn:{name:'황금 도토리',icon:'🌰',trait:'nature',rar:0,w:0,desc:s=>`줍는 범위 +${[0,40,80,140][s]}, 결정 획득 +${[0,20,45,80][s]}%`},
};
// special abilities unlocked by merging: [★2, ★3]
const SP={
  firebolt:['맞으면 작게 폭발','폭발 + 불씨 3개로 분열'],
  meteor:['떨어진 자리에 불바다','불바다 + 작은 운석 3개로 쪼개짐'],
  fireorb:['공격이 12% 확률로 적을 불태움','불태울 확률 25%'],
  frostring:['맞은 적을 25% 확률로 얼림','2초마다 조각마다 얼음 파편 발사'],
  lance:['끝까지 날아가면 파편 5개로 분열','파편 8개, 파편도 관통'],
  frostarmor:['맞으면 주변을 얼리는 서리 폭발','서리 폭발 + 때린 적에게 반격'],
  chain:['튈 때마다 전기 폭발','튀는 횟수 2배, 맞은 적 기절'],
  whirl:['돌아올 때 크기 1.6배','꼭짓점에 회오리를 남김'],
  boots:['움직이면 바람 칼날 자국','바람 칼날이 더 크고 강해짐'],
  thorns:['덩굴로 쓰러진 적이 가시 4개 발사','가시 8개 + 덩굴 안 적 둔화'],
  lifetree:['10초마다 회복 파동 (10%, 적 밀쳐냄)','회복 15% + 파동 피해'],
  acorn:['결정 20% 확률로 2배','결정 40% 확률로 2배'],
  sun:['폭발과 함께 불꽃 6발 사방 발사','불꽃 12발'],
  zero:['얼어 있다 쓰러진 적이 산산조각 폭발','얼어 있는 적이 받는 피해 +50%'],
  thunder:['벼락이 옆 적에게 한 번 더 튐','벼락 자리에 전기 폭발'],
  worldtree:['부활할 때 거대 폭발','부활 후 5초 무적'],
};
const IDS=Object.keys(ITEMS);
const EQN=5,BN=10;
const PRICE=[3,5,8,12];
const priceOf=id=>PRICE[ITEMS[id].rar];
const sellValue=it=>priceOf(it.id)*[0,1,3,9][it.star];

// ---------- dom ----------
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const el={xpbar:$('xpbar'),lvl:$('lvl'),hpbar:$('hpbar'),hptext:$('hptext'),timer:$('timer'),gems:$('gems'),kills:$('kills'),syn:$('syn'),slots:$('slots'),drawBtn:$('drawBtn'),cost:$('cost'),overlay:$('overlay'),toast:$('toast'),pop:$('pop'),pause:$('pauseBtn')};
let W=0,H=0,DPR=1,SC=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.max(1,R(W*DPR));cv.height=Math.max(1,R(H*DPR));SC=Math.max(.62,Math.min(1.25,Math.min(W,H)/520));}
window.addEventListener('resize',resize);resize();

let best=0;try{best=+localStorage.getItem('starSummonerBest')||0}catch(e){}

// ---------- state ----------
let S=null,st=null,mode='title',uid=1;
function newGame(){
  S={t:0,p:{x:0,y:0,hp:100,r:13,inv:0,fx:1,fy:0,maxhp:100},enemies:[],proj:[],gems:[],fx:[],texts:[],slots:Array(EQN).fill(null),bench:Array(BN).fill(null),eq:[],gem:6,draws:0,kills:0,spawnAcc:0,nextElite:75,ringA:0,thornT:0,won:false,shop:[],bought:[],locked:false,nextStock:RESTOCK,newStock:true,sel:null,blasts:[],zones:[],lv:1,xp:0,revUsed:0,items:[],nextItem:15};
  restock();
  S.slots[0]=mk('firebolt',1);
  for(let i=0;i<6;i++){const a=i/6*6.283;S.enemies.push({type:'slime',x:Math.cos(a)*260,y:Math.sin(a)*260,hp:12,max:12,sp:55,r:11,dmg:5,col:'#6bd36b',flash:0,slowT:0,ringT:0,thornT:0,wob:Math.random()*6});}
  recompute(true);renderSlots();
}
function mk(id,star){return{id,star,cd:.3,uid:uid++}}

const allItems=()=>S.slots.concat(S.bench).filter(Boolean);
function locOf(it){let i=S.slots.indexOf(it);if(i>=0)return[S.slots,i];i=S.bench.indexOf(it);return i>=0?[S.bench,i]:null;}
function emptyCell(){let i=S.slots.indexOf(null);if(i>=0)return[S.slots,i];i=S.bench.indexOf(null);return i>=0?[S.bench,i]:null;}
function traitCounts(){
  const c={fire:new Set(),frost:new Set(),storm:new Set(),nature:new Set()};
  for(const it of S.eq)c[ITEMS[it.id].trait].add(it.id);
  const o={};for(const k in c)o[k]=c[k].size;return o;
}
function recompute(init){
  S.eq=S.slots.filter(Boolean);
  const s={dmg:1,cd:1,speed:150,maxhp:100,regen:0,armor:0,pickup:70,gemMul:1,slow:0};
  const tc=traitCounts();
  s.blast=false;s.amp=1;s.echo=0;s.ignite=0;s.trail=0;s.armorNova=0;s.pulse=0;s.dbl=0;s.shatter=false;s.zeroAmp=false;s.reviveStar=0;
  if(tc.fire>=3){s.dmg*=1.6;s.blast=true;}else if(tc.fire>=2)s.dmg*=1.3;
  if(tc.frost>=3){s.slow=.6;s.amp=1.3;}else if(tc.frost>=2)s.slow=.4;
  if(tc.storm>=3){s.cd*=.6;s.echo=.25;}else if(tc.storm>=2)s.cd*=.75;
  if(tc.nature>=3){s.regen+=5;s.maxhp+=80;s.speed*=1.1;}else if(tc.nature>=2){s.regen+=2;s.maxhp+=30;}
  for(const it of S.eq){const k=it.star;switch(it.id){
    case'fireorb':s.dmg*=1+[0,.12,.25,.45][k];break;
    case'boots':s.speed*=1+[0,.1,.18,.3][k];s.cd*=1-[0,.05,.1,.16][k];break;
    case'frostarmor':s.armor=1-(1-s.armor)*(1-[0,.12,.22,.35][k]);break;
    case'lifetree':s.maxhp+=[0,25,50,90][k];s.regen+=[0,.5,1.2,2.5][k];break;
    case'worldtree':s.maxhp+=[0,60,120,200][k];s.regen+=[0,2,4,7][k];s.revives=Math.max(s.revives||0,k);s.reviveStar=Math.max(s.reviveStar,k);break;
    case'acorn':s.pickup+=[0,40,80,140][k];s.gemMul+=[0,.2,.45,.8][k];break;}}
  for(const it of S.eq){const k=it.star;if(k<2)continue;switch(it.id){
    case'fireorb':s.ignite=Math.max(s.ignite,k===3?.25:.12);break;
    case'boots':s.trail=Math.max(s.trail,k);break;
    case'frostarmor':s.armorNova=Math.max(s.armorNova,k);break;
    case'lifetree':s.pulse=Math.max(s.pulse,k);break;
    case'acorn':s.dbl=Math.max(s.dbl,k===3?.4:.2);break;
    case'zero':s.shatter=true;if(k===3)s.zeroAmp=true;break;}}
  const old=S.p.maxhp;S.p.maxhp=s.maxhp;
  if(init)S.p.hp=s.maxhp;else if(s.maxhp>old)S.p.hp+=s.maxhp-old;
  S.p.hp=Math.min(S.p.hp,S.p.maxhp);
  st=s;tcCache=tc;renderSyn();
}
let tcCache={};

// ---------- summon & merge ----------
// shop level odds [common, rare, legendary] and cost to reach the next level
// summoner level odds [common, rare, legendary, mythic]; level rises by picking up gems
const ODDS=[null,[90,10,0,0],[80,18,2,0],[70,25,5,0],[60,30,10,0],[51,33,15,1],[44,35,19,2],[37,37,23,3],[31,38,26,5],[25,39,29,7],[20,38,32,10]];
const MAXLV=10;
const xpNeed=lv=>Math.round(1.7*lv*lv);
function gainXp(v){
  if(S.lv>=MAXLV)return;S.xp+=v;
  while(S.lv<MAXLV&&S.xp>=xpNeed(S.lv)){S.xp-=xpNeed(S.lv);S.lv++;
    toast(`레벨 업! Lv.${S.lv} · 높은 등급이 더 자주 나와요`);burst(S.p.x,S.p.y,'storm',30);
    S.fx.push({k:'nova',x:S.p.x,y:S.p.y,r:90,life:.45,col:'143,208,255'});}
  if(S.lv>=MAXLV)S.xp=0;
}
function roll(){
  const o=ODDS[S.lv],r=Math.random()*100;
  let rar=0,acc=o[0];while(rar<3&&r>=acc){rar++;acc+=o[rar];}
  const pool=IDS.filter(id=>ITEMS[id].rar===rar);
  return pool[Math.floor(Math.random()*pool.length)];
}
function giveItem(id){
  const it=mk(id,1),cell=emptyCell();
  if(cell)cell[0][cell[1]]=it;else S.bench.push(it); // temporary 11th bench cell
  const merged=mergeAll();
  let sold=0;
  while(S.bench.length>BN){const x=S.bench.pop();if(x){const e=S.bench.indexOf(null);if(e>=0)S.bench[e]=x;else{sold=sellValue(x);S.gem+=sold;}}}
  recompute(false);renderSlots(merged.map(m=>m.uid));
  burst(S.p.x,S.p.y,ITEMS[id].trait,merged.length?40:18);
  return{merged,sold};
}
function freeSummon(){const id=roll(),r=giveItem(id);showPop(id,r.merged,r.sold);}

// ---------- shop ----------
const SHOP_N=4,REROLL=2,RESTOCK=30;
function restock(){S.shop=[];for(let i=0;i<SHOP_N;i++)S.shop.push(roll());S.bought=[];}
const owned1=id=>allItems().filter(x=>x.id===id&&x.star===1).length;
const willMerge=id=>owned1(id)>=2;
const canFit=id=>!!emptyCell()||willMerge(id);
function buy(i){
  const id=S.shop[i],c=id?priceOf(id):0;
  if(!id||S.gem<c||!canFit(id))return;
  S.gem-=c;S.draws++;S.shop[i]=null;
  const r=giveItem(id);
  const top=r.merged[r.merged.length-1];
  S.bought[i]=top?`합성! <b>${ITEMS[top.id].name} ${'★'.repeat(top.star)}</b><br>✨ ${SP[top.id][top.star-2]}`:`<b>${ITEMS[id].name}</b> 구매`;
  renderShop();
}
function tapCell(w,i){
  const it=S[w][i];
  if(!S.sel){if(it)S.sel={w,i};}
  else if(S.sel.w===w&&S.sel.i===i)S.sel=null;
  else{const a=S[S.sel.w],b=S[w],t=a[S.sel.i];a[S.sel.i]=b[i];b[i]=t;S.sel=null;recompute(false);renderSlots();}
  renderShop();
}
function reroll(){if(S.gem<REROLL)return;S.gem-=REROLL;restock();renderShop();}
function synHint(id){
  const tr=ITEMS[id].trait;
  if(S.eq.some(x=>x.id===id))return'';
  const n=(tcCache[tr]||0)+1;
  return n===2||n===3?`<div class="sy" style="color:${TRAITS[tr].color}">장착 시 ${TRAITS[tr].name} ${n}종!</div>`:'';
}
function showShop(){
  if(mode!=='play')return;
  mode='shop';S.newStock=false;S.sel=null;lastHud='';
  el.overlay.hidden=false;renderShop();focusMain();
}
function renderShop(){
  const g=Math.floor(S.gem),intr=Math.min(5,Math.floor(g/10)),left=Math.max(0,Math.ceil(S.nextStock-S.t));
  let offers='';
  for(let i=0;i<SHOP_N;i++){
    const id=S.shop[i];
    if(!id){offers+=`<div class="offer empty">${S.bought[i]||'품절'}</div>`;continue;}
    const I=ITEMS[id],tc=TRAITS[I.trait].color,n=owned1(id),mg=n>=2,fit=canFit(id),c=priceOf(id);
    const bd=mg?'사면 ★2 합성!':n?`보유 ${n}/3`:'새 마법';
    offers+=`<button class="offer${mg?' merge':''}${I.rar===3?' myth':''}" data-buy="${i}" style="--tc:${tc}" ${g<c||!fit?'disabled':''} aria-label="${I.name} 구매">
      <span class="ic">${I.icon}</span><span class="nm">${I.name}</span>
      <span class="meta"><span style="color:${RAR[I.rar].col}">${RAR[I.rar].name}</span> · <span style="color:${tc}">${TRAITS[I.trait].name}</span></span>
      <span class="bd">${fit?bd:'가방이 가득 찼어요'}</span>${synHint(id)}
      <span class="pr">◆ ${c}</span></button>`;
  }
  const cellBtn=(w,i)=>{const it=S[w][i],sel=S.sel&&S.sel.w===w&&S.sel.i===i,tg=S.sel?' target':'';
    if(!it)return`<button class="cell${tg}" data-w="${w}" data-i="${i}" aria-label="빈 칸"></button>`;
    const I=ITEMS[it.id];
    return`<button class="cell has${sel?' sel':''}${tg}" data-w="${w}" data-i="${i}" style="--tc:${TRAITS[I.trait].color}" aria-label="${I.name} ${it.star}성">${I.icon}<small>${'★'.repeat(it.star)}</small></button>`;};
  let eqH='',bnH='';for(let i=0;i<EQN;i++)eqH+=cellBtn('slots',i);for(let i=0;i<BN;i++)bnH+=cellBtn('bench',i);
  const selIt=S.sel?S[S.sel.w][S.sel.i]:null;
  const act=selIt?`<div class="act"><span>${ITEMS[selIt.id].icon} ${ITEMS[selIt.id].name} <span style="color:var(--gold)">${'★'.repeat(selIt.star)}</span><p class="small">다른 칸을 누르면 옮기거나 바꿔요</p></span><button class="ghost" id="sellSel">판매 ◆${sellValue(selIt)}</button></div>`
    :`<div class="act"><p class="small">마법을 누른 다음 다른 칸을 누르면 옮기거나 서로 바꿔요. 보관함에 있어도 합성은 돼요.</p></div>`;
  el.overlay.innerHTML=`<div class="card shop">
    <div class="shophead"><h2>상점 · 배치</h2><span class="bal">◆ ${g}</span></div>
    <div class="lvrow">
      <span class="lv">Lv.${S.lv}</span>
      <span class="odds">${ODDS[S.lv].map((v,k)=>`<span style="color:${RAR[k].col}">${RAR[k].name} ${v}%</span>`).join('')}</span>
      <span class="nx">${S.lv<MAXLV?`다음 레벨까지<br>결정 ${Math.ceil(xpNeed(S.lv)-S.xp)}개`:'최고 레벨'}</span>
    </div>
    <p class="small">일반 ◆3 · 희귀 ◆5 · 전설 ◆8 · 신화 ◆12 · ${left}초 뒤 · 이자 +${intr}</p>
    <div class="offers">${offers}</div>
    <div class="btns"><button class="ghost" id="rerollBtn" ${g<REROLL?'disabled':''}>새로고침 ◆${REROLL}</button><button class="ghost${S.locked?' on':''}" id="lockBtn">${S.locked?'잠금 중':'잠금'}</button></div>
    <div class="lbl">장착 <span>이 5칸만 싸우고 시너지에 들어가요</span></div>
    <div class="cells eq">${eqH}</div>
    <div class="lbl">보관함 <span>${S.bench.filter(Boolean).length}/${BN}</span></div>
    <div class="cells">${bnH}</div>
    ${act}
    <button class="big" id="closeShop">전투로 돌아가기</button>
  </div>`;
  el.overlay.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(+b.dataset.buy));
  el.overlay.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>tapCell(b.dataset.w,+b.dataset.i));
  const sb=$('sellSel');if(sb)sb.onclick=()=>{const it=S[S.sel.w][S.sel.i];S.sel=null;sell(it);renderShop();};
  $('rerollBtn').onclick=reroll;
  $('lockBtn').onclick=()=>{S.locked=!S.locked;renderShop();};
  $('closeShop').onclick=resume;
}
function mergeAll(){
  const out=[];let found=true;
  while(found){found=false;
    const g={};
    for(const it of allItems()){if(it.star>=3)continue;const k=it.id+'|'+it.star;(g[k]=g[k]||[]).push(it);}
    for(const k in g){if(g[k].length>=3){
      const three=g[k].slice(0,3),target=three.find(x=>S.slots.includes(x))||three[0],[arr,idx]=locOf(target);
      for(const x of three){const l=locOf(x);l[0][l[1]]=null;}
      const nw=mk(three[0].id,three[0].star+1);arr[idx]=nw;
      out.push(nw);found=true;break;}}
  }
  return out;
}
function sell(it){
  const l=locOf(it);if(!l)return;
  l[0][l[1]]=null;const v=sellValue(it);S.gem+=v;
  recompute(false);renderSlots();toast(`${ITEMS[it.id].name} 판매 ◆ +${v}`);
}

// ---------- ui ----------
let popT=0,toastT=0;
function showPop(id,merged,sold){
  const I=ITEMS[id],tc=TRAITS[I.trait].color;
  let extra='';
  if(merged.length){const top=merged[merged.length-1];extra=`<div class="mg">합성! ${ITEMS[top.id].name} ${'★'.repeat(top.star)}</div><div class="sub">✨ ${SP[top.id][top.star-2]}</div>`;}
  else if(sold)extra=`<div class="sub">가방이 가득 차서 판매 ◆ +${sold}</div>`;
  el.pop.style.setProperty('--tc',tc);
  el.pop.innerHTML=`<div class="ic">${I.icon}</div><div class="nm">${I.name}</div><div class="sub" style="color:${RAR[I.rar].col}">${RAR[I.rar].name} · <span style="color:${tc}">${TRAITS[I.trait].name}</span></div>${extra}`;
  el.pop.classList.add('show');popT=merged.length?1.8:1.2;
}
function toast(msg){el.toast.textContent=msg;el.toast.classList.add('show');toastT=1.8}
function renderSlots(popUids=[]){
  let h='';
  for(let i=0;i<EQN;i++){const it=S.slots[i];
    if(!it){h+=`<button class="slot" aria-label="빈 장착 칸"></button>`;continue;}
    const I=ITEMS[it.id];
    h+=`<button class="slot full${popUids.includes(it.uid)?' pop':''}" data-i="${i}" style="--tc:${TRAITS[I.trait].color}" aria-label="${I.name} ${it.star}성">${I.icon}<span class="rr" style="background:${RAR[I.rar].col}"></span><span class="st">${'★'.repeat(it.star)}</span></button>`;}
  el.slots.innerHTML=h;
}
function renderSyn(){
  let h='';
  for(const k in TRAITS){const n=tcCache[k]||0;if(!n)continue;
    h+=`<span class="pill${n>=2?' on':''}" style="color:${TRAITS[k].color}">${TRAITS[k].name} ${Math.min(n,3)}/3</span>`;}
  el.syn.innerHTML=h;
}
el.slots.addEventListener('click',e=>{
  const b=e.target.closest('.slot.full');if(!b||mode!=='play')return;
  showInfo(S.slots[+b.dataset.i]);
});
el.drawBtn.addEventListener('click',()=>{showShop();});
el.pause.addEventListener('click',()=>{if(mode==='play')showPause();});

function traitGuide(){
  return `<div class="traits">${Object.entries(TRAITS).map(([k,t])=>`<div style="color:${t.color}">${t.name} 시너지<small>2종: ${t.fx[0]}</small><small>3종: ${t.fx[1]}</small></div>`).join('')}</div>`;
}
function showTitle(){
  mode='title';
  el.overlay.hidden=false;
  el.overlay.innerHTML=`<div class="card">
    <h1>별빛 소환사</h1>
    <p>밤의 초원에서 몬스터 떼를 10분 동안 버티세요.</p>
    <div class="how">
      <div><span>👆</span><span>화면을 끌어서 움직이세요. 공격은 자동이에요. (PC: WASD·방향키, 상점은 스페이스)</span></div>
      <div><span>◆</span><span>쓰러뜨린 적이 마나 결정을 떨어뜨려요. <b style="color:var(--gold)">상점</b>을 열면 게임이 멈추고, 진열된 마법 4개 중 골라 살 수 있어요.</span></div>
      <div><span>🔄</span><span>◆2로 새로고침, 잠금으로 진열 유지. 30초마다 새 물건이 들어오고 남은 ◆에 이자가 붙어요.</span></div>
      <div><span>⬆️</span><span>결정을 주울수록 <b>소환사 레벨</b>이 올라서 희귀·전설 마법이 더 자주 나와요. Lv.5부터는 <b style="color:#ff6bd6">신화</b>도 나와요.</span></div>
      <div><span>🎁</span><span>필드에 가끔 아이템이 생겨요. ❤️ 회복 · 🧲 결정 끌어오기 · 💣 화면 폭발 · 💰 결정 주머니</span></div>
      <div><span>★</span><span>같은 마법 3개가 모이면 자동으로 합쳐져서 ★2, ★2 셋은 ★3이 돼요. 별이 오르면 <b style="color:var(--gold)">특수능력</b>이 해금돼요. (분열, 폭발, 빙결…)</span></div>
      <div><span>🎒</span><span><b>장착 5칸</b>만 싸우고 시너지에 들어가요. 나머지는 <b>보관함 10칸</b>에 모아서 합성하세요. 상점 화면에서 마법을 눌러 옮기거나 바꿀 수 있어요.</span></div>
    </div>
    ${traitGuide()}
    ${best?`<p>최고 기록 ${fmt(best)}</p>`:''}
    <button class="big" id="startBtn">시작하기</button>
  </div>`;
  $('startBtn').onclick=start;focusMain();
}
function focusMain(){const b=el.overlay.querySelector('.big');if(b)b.focus({preventScroll:true});}
function blurAll(){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}
function start(){newGame();mode='play';el.overlay.hidden=true;blurAll();last=performance.now();}
function showPause(){
  mode='pause';el.overlay.hidden=false;
  el.overlay.innerHTML=`<div class="card"><h2>일시정지</h2>${traitGuide()}<div class="btns"><button class="ghost" id="quitBtn">처음으로</button><button class="big" id="resBtn">계속하기</button></div></div>`;
  $('resBtn').onclick=resume;$('quitBtn').onclick=showTitle;focusMain();
}
function resume(){mode='play';el.overlay.hidden=true;blurAll();last=performance.now();}
function spList(id,star){return SP[id].map((t,i)=>{const need=i+2,on=star>=need;return`<div class="spl${on?' on':''}">${on?'✨':'🔒'} ★${need} ${t}</div>`;}).join('');}
function showInfo(it){
  mode='pause';const I=ITEMS[it.id],t=TRAITS[I.trait];
  el.overlay.hidden=false;
  el.overlay.innerHTML=`<div class="card">
    <div class="info-ic">${I.icon}</div>
    <h2>${I.name} <span style="color:var(--gold)">${'★'.repeat(it.star)}</span></h2>
    <div><span class="tag" style="color:${RAR[I.rar].col}">${RAR[I.rar].name}</span><span class="tag" style="color:${t.color}">${t.name}</span><span class="tag" style="color:var(--muted)">${I.w?'공격 마법':'보조 유물'}</span></div>
    <div class="desc">${I.desc(it.star)}${spList(it.id,it.star)}${it.star<3?`<div class="nx">다음 ★${it.star+1}: ${I.desc(it.star+1)}</div>`:''}</div>
    <div class="btns"><button class="ghost" id="sellBtn">판매 ◆ +${sellValue(it)}</button><button class="big" id="closeBtn">닫기</button></div>
  </div>`;
  $('closeBtn').onclick=resume;$('sellBtn').onclick=()=>{sell(it);resume();};
}
function showEnd(won){
  mode='end';
  const newBest=S.t>best;if(newBest){best=S.t;try{localStorage.setItem('starSummonerBest',String(best))}catch(e){}}
  el.overlay.hidden=false;
  el.overlay.innerHTML=`<div class="card">
    <h1>${won?'새벽이 밝았어요!':'쓰러졌어요'}</h1>
    <p>${won?'10분을 버텨냈어요. 초원이 지켜졌어요.':'다음엔 시너지와 이자를 노려보세요.'}${newBest?' 최고 기록 갱신!':''}</p>
    <div class="statsgrid">
      <div><b>${fmt(S.t)}</b><span>생존 시간</span></div>
      <div><b>${S.kills}</b><span>처치</span></div>
      <div><b>Lv.${S.lv}</b><span>소환사 레벨</span></div>
      <div><b>${Math.max(0,...allItems().map(i=>i.star))}★</b><span>최고 등급</span></div>

// ---------- helpers ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
const d2=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy};
const CELL=64;let grid=new Map();
function buildGrid(){grid=new Map();for(const e of S.enemies){const k=((e.x/CELL)|0)+','+((e.y/CELL)|0);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(e);}}
function near(x,y,r){
  const out=[],x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let i=x0;i<=x1;i++)for(let j=y0;j<=y1;j++){
    // match truncation used in buildGrid for negatives
    const a=grid.get(i+','+j);if(a)for(const e of a)out.push(e);}
  return out;
}
// buildGrid uses |0 (truncate); use floor everywhere instead for consistency
function cellKey(x,y){return Math.floor(x/CELL)+','+Math.floor(y/CELL)}
buildGrid=function(){grid=new Map();for(const e of S.enemies){if(e.dead)continue;const k=cellKey(e.x,e.y);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(e);}};

function nearestEnemies(n,maxR){
  const p=S.p,m2=maxR*maxR,arr=[];
  for(const e of S.enemies){if(e.dead)continue;const q=d2(e,p);if(q<m2)arr.push([q,e]);}
  arr.sort((a,b)=>a[0]-b[0]);return arr.slice(0,n).map(a=>a[1]);
}
function inView(){const hw=W/2/SC,hh=H/2/SC,p=S.p;return S.enemies.filter(e=>!e.dead&&Math.abs(e.x-p.x)<hw&&Math.abs(e.y-p.y)<hh);}
function addText(x,y,txt,col){if(S.texts.length>70)S.texts.shift();S.texts.push({x:x+rnd(-6,6),y,txt,col,life:.7});}
function burst(x,y,trait,n){const c=TRAITS[trait].color;for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(60,220);S.fx.push({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,.7),col:c});}}

function hurt(e,dmg,col){
  if(e.dead)return false;
  dmg*=st.dmg;if(e.slowT>0)dmg*=st.amp;if(e.frozenT>0&&st.zeroAmp)dmg*=1.5;e.hp-=dmg;e.flash=.08;
  if(st.slow)e.slowT=1.2;
  if(st.ignite&&Math.random()<st.ignite){e.burnT=3;e.burnD=Math.max(e.burnD||0,dmg*.35);}
  addText(e.x,e.y-e.r,R(dmg),col);
  if(e.hp<=0){kill(e);return true;}
  return false;
}
const scale=()=>1+S.t/150;
function boom(x,y,r,dmg,col){if(S.blasts.length<150)S.blasts.push({x,y,r,dmg,col});}
function shards(x,y,n,dmg,col,pierce=0,a0=Math.random()*6.283){
  for(let i=0;i<n;i++){const a=a0+i*6.283/n;S.proj.push({k:'shard',x,y,vx:Math.cos(a)*360,vy:Math.sin(a)*360,r:5,dmg,life:.7,pierce,hit:new Set(),col});}
}
function zone(x,y,r,life,dmg,col,kind){if(S.zones.length<60)S.zones.push({x,y,r,life,max:life,dmg,col,tick:0,kind});}
function freezeIn(x,y,r,t){for(const e of near(x,y,r+30)){if(e.dead)continue;if(d2(e,{x,y})<(r+e.r)**2)e.frozenT=Math.max(e.frozenT||0,t);}}
function kill(e){
  e.dead=true;S.kills++;
  if(st.shatter&&e.frozenT>0)boom(e.x,e.y,55,16*scale(),'#bdf0ff');
  if(st.blast&&S.blasts.length<120)S.blasts.push({x:e.x,y:e.y});
  if(e.type==='elite'){S.gems.push({x:e.x,y:e.y,chest:true});burst(e.x,e.y,'fire',30);}
  else{const dp=Math.max(.02,.3*Math.exp(-S.t/150)); // drop chance falls as hordes grow
    if(e.type==='golem'){if(Math.random()<Math.min(1,dp*1.5))S.gems.push({x:e.x,y:e.y,v:3,big:true});}
    else if(Math.random()<dp)S.gems.push({x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),v:1});}
  if(S.gems.length>500){ // fold oldest gems into one to keep things fast
    let sum=0;const keep=[];for(let i=0;i<S.gems.length;i++){const g=S.gems[i];if(i<200&&!g.chest)sum+=g.v;else keep.push(g);}
    keep.push({x:S.p.x+rnd(-200,200),y:S.p.y+rnd(-200,200),v:sum,big:true});S.gems=keep;}
}

// ---------- weapons ----------
function fireWeapon(it){
  const s=it.star,m=M[s],p=S.p;
  switch(it.id){
    case'firebolt':{const ts=nearestEnemies(s,520);if(!ts.length)return false;
      for(const e of ts){const a=Math.atan2(e.y-p.y,e.x-p.x);S.proj.push({k:'bolt',x:p.x,y:p.y,vx:Math.cos(a)*430,vy:Math.sin(a)*430,r:6,dmg:13*m,life:1.5,pierce:0,hit:new Set(),col:'#ff7a45',star:s});}return true;}
    case'lance':{const base=Math.atan2(p.fy,p.fx);
      for(let i=0;i<s;i++){const a=base+(i-(s-1)/2)*.18;S.proj.push({k:'lance',x:p.x,y:p.y,vx:Math.cos(a)*540,vy:Math.sin(a)*540,r:8,dmg:20*m,life:1.1,pierce:99,hit:new Set(),col:'#6fd3ff',a,star:s});}return true;}
    case'chain':{const v=inView();if(!v.length)return false;
      let cur=v[Math.floor(Math.random()*v.length)],from={x:p.x,y:p.y};const hit=new Set();
      const jumps=(2+s)*(s>=3?2:1);
      for(let i=0;i<jumps&&cur;i++){S.fx.push({k:'zap',x1:from.x,y1:from.y,x2:cur.x,y2:cur.y,life:.18});hit.add(cur);
        if(s>=3)cur.frozenT=Math.max(cur.frozenT||0,.4);if(s>=2)boom(cur.x,cur.y,40,6*m,'#c79bff');
        hurt(cur,15*m,'#c79bff');from=cur;
        let nb=null,bd=170*170;for(const e of near(cur.x,cur.y,170)){if(hit.has(e)||e.dead)continue;const q=d2(e,cur);if(q<bd){bd=q;nb=e;}}cur=nb;}return true;}
    case'whirl':{const t=nearestEnemies(1,500)[0];const base=t?Math.atan2(t.y-p.y,t.x-p.x):Math.atan2(p.fy,p.fx);
      for(let i=0;i<s;i++){const a=base+(i-(s-1)/2)*.5;S.proj.push({k:'boom',x:p.x,y:p.y,vx:Math.cos(a)*380,vy:Math.sin(a)*380,r:15,dmg:12*m,life:2.2,age:0,pierce:999,hitT:new Map(),col:'#c79bff',star:s});}return true;}
    case'sun':{const rad=150+20*s,hits=near(p.x,p.y,rad+30).filter(e=>!e.dead&&d2(e,p)<(rad+e.r)**2);if(!hits.length)return false;
      S.fx.push({k:'nova',x:p.x,y:p.y,r:rad,life:.45});for(const e of hits)hurt(e,55*m,'#ffd23f');
      if(s>=2)shards(p.x,p.y,s>=3?12:6,15*m,'#ffb04a',1);return true;}
    case'zero':{const v=inView();if(!v.length)return false;S.fx.push({k:'chill',life:.5});
      for(const e of v){e.frozenT=1.2+.4*s;hurt(e,20*m,'#bdf0ff');}return true;}
    case'thunder':{const v=inView();if(!v.length)return false;
      for(let i=0;i<3+2*s;i++){const e=v[Math.floor(Math.random()*v.length)];if(e.dead)continue;S.fx.push({k:'zap',x1:e.x+rnd(-40,40),y1:e.y-320,x2:e.x,y2:e.y,life:.25});
        if(s>=2){let nb=null,bd=150*150;for(const o of near(e.x,e.y,150)){if(o===e||o.dead)continue;const q=d2(o,e);if(q<bd){bd=q;nb=o;}}
          if(nb){S.fx.push({k:'zap',x1:e.x,y1:e.y,x2:nb.x,y2:nb.y,life:.2});hurt(nb,17*m,'#e3c6ff');}}
        if(s>=3)boom(e.x,e.y,50,12*m,'#e3c6ff');
        hurt(e,28*m,'#e3c6ff');}return true;}
    case'meteor':{const v=inView();
      for(let i=0;i<s;i++){const e=v.length?v[Math.floor(Math.random()*v.length)]:null;
        S.fx.push({k:'meteor',x:e?e.x:p.x+rnd(-200,200),y:e?e.y:p.y+rnd(-200,200),t:.7,max:.7,r:75,dmg:45*m,star:s});}return true;}
  }
  return false;
}
const BASECD={firebolt:.8,lance:1.3,chain:1.5,whirl:2.2,meteor:2.6,sun:3,zero:6,thunder:1.2};

// ---------- update ----------
function update(dt){
  S.t+=dt;const p=S.p;
  // move
  let mx=0,my=0;
  if(keys['a']||keys['arrowleft'])mx--;if(keys['d']||keys['arrowright'])mx++;
  if(keys['w']||keys['arrowup'])my--;if(keys['s']||keys['arrowdown'])my++;
  if(joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>6){const k=Math.min(1,l/50);mx=dx/l*k;my=dy/l*k;}}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  if(ml>.05){p.fx=mx/Math.max(ml,1e-6);p.fy=my/Math.max(ml,1e-6);const n=Math.hypot(p.fx,p.fy);p.fx/=n;p.fy/=n;}
  p.x+=mx*st.speed*dt;p.y+=my*st.speed*dt;
  p.inv=Math.max(0,p.inv-dt);
  p.hp=Math.min(p.maxhp,p.hp+st.regen*dt);

  // spawn
  S.spawnAcc+=dt*(1.8+S.t/22);
  while(S.spawnAcc>=1){S.spawnAcc--;if(S.enemies.length<320)spawn();}
  if(S.t>=S.nextStock){S.nextStock+=RESTOCK;const intr=Math.min(5,Math.floor(S.gem/10));S.gem+=intr;
    if(!S.locked){restock();S.newStock=true;}
    toast(`${S.locked?'상점 잠금 유지':'상점에 새 물건이 들어왔어요'}${intr?` · 이자 ◆+${intr}`:''}`);}
  if(S.t>=S.nextItem){S.nextItem+=rnd(16,24);spawnItem();}
  if(S.t>=S.nextElite){S.nextElite+=75;spawn('elite');toast('강한 적이 나타났어요! 쓰러뜨리면 보물상자');}

  buildGrid();

  // weapons
  for(const it of S.eq){const I=ITEMS[it.id];if(!I.w||!BASECD[it.id])continue;
    it.cd-=dt;if(it.cd<=0){if(fireWeapon(it)){it.cd=BASECD[it.id]*st.cd;if(st.echo&&Math.random()<st.echo){fireWeapon(it);addText(S.p.x,S.p.y-34,'연속 발동!','#c79bff');}}else it.cd=.15;}}
  // fire 3: kill explosions (queued so chains don't recurse)
  for(let n=0;n<60&&S.blasts.length;n++){const b=S.blasts.shift(),r=b.r||55,col=b.col||'#ffb04a';S.fx.push({k:'blast',x:b.x,y:b.y,life:.3,r,col});
    for(const e of near(b.x,b.y,r+30)){if(e.dead)continue;const rr=r+e.r;if(d2(e,b)<rr*rr)hurt(e,b.dmg||12*scale(),col);}}
  // passive specials
  if(st.trail&&ml>.05){S.trailT=(S.trailT||0)-dt;if(S.trailT<=0){S.trailT=.3;zone(p.x,p.y,st.trail>=3?30:22,1.6,st.trail>=3?9:5,'199,155,255','wind');}}
  if(st.pulse){S.pulseT=(S.pulseT||10)-dt;if(S.pulseT<=0){S.pulseT=10;const v=R(p.maxhp*(st.pulse>=3?.15:.1));p.hp=Math.min(p.maxhp,p.hp+v);addText(p.x,p.y-30,'+'+v,'#7ee08a');
    S.fx.push({k:'nova',x:p.x,y:p.y,r:160,life:.5,col:'126,224,138'});
    for(const e of near(p.x,p.y,190)){if(e.dead)continue;const dx=e.x-p.x,dy=e.y-p.y,l=Math.hypot(dx,dy)||1;if(l<160+e.r){e.x+=dx/l*70;e.y+=dy/l*70;if(st.pulse>=3)hurt(e,30*scale(),'#7ee08a');}}}}
  // zones (burning ground, wind trail, twisters)
  for(const z of S.zones){z.life-=dt;z.tick-=dt;if(z.tick<=0){z.tick=.3;for(const e of near(z.x,z.y,z.r+30)){if(e.dead)continue;if(d2(e,z)<(z.r+e.r)**2)hurt(e,z.dmg,`rgb(${z.col})`);}}}
  S.zones=S.zones.filter(z=>z.life>0);
  // continuous weapons
  S.ringA+=dt*3.2;
  for(const it of S.eq){
    if(it.id==='frostring'){const n=2+it.star,rad=78;
      for(let i=0;i<n;i++){const a=S.ringA+i*6.283/n,ox=p.x+Math.cos(a)*rad,oy=p.y+Math.sin(a)*rad;
        for(const e of near(ox,oy,30)){if(e.dead||e.ringT>S.t)continue;const rr=e.r+10;if((e.x-ox)**2+(e.y-oy)**2<rr*rr){e.ringT=S.t+.45;if(it.star>=2&&Math.random()<.25)e.frozenT=Math.max(e.frozenT||0,.6);hurt(e,7*M[it.star],'#6fd3ff');}}}
      if(it.star>=3){it.shT=(it.shT||0)-dt;if(it.shT<=0){it.shT=2;for(let i=0;i<n;i++){const a=S.ringA+i*6.283/n;shards(p.x+Math.cos(a)*rad,p.y+Math.sin(a)*rad,1,8*M[3],'#bdf0ff',0,a);}}}}
    if(it.id==='thorns'){const rad=55+15*it.star;
      for(const e of near(p.x,p.y,rad+30)){if(e.dead||e.thornT>S.t)continue;const rr=rad+e.r;if(d2(e,p)<rr*rr){e.thornT=S.t+.35;if(it.star>=3)e.slowT=Math.max(e.slowT,.5);if(hurt(e,5*M[it.star],'#7ee08a')&&it.star>=2)shards(e.x,e.y,it.star>=3?8:4,6*M[it.star],'#7ee08a');}}}
  }

  // projectiles
  for(const b of S.proj){
    b.life-=dt;
    if(b.k==='boom'){b.age+=dt;if(b.age>.55&&!b.turned){b.turned=true;if(b.star>=2)b.r*=1.6;if(b.star>=3)zone(b.x,b.y,34,2,b.dmg*.5,'199,155,255','twister');}
      if(b.age>.55){const a=Math.atan2(p.y-b.y,p.x-b.x),sp=Math.min(520,380+b.age*200);b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;if(b.age>.7&&d2(b,p)<400)b.life=0;}}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.life<=0){if(b.k==='lance'&&b.star>=2&&!b.split){b.split=true;shards(b.x,b.y,b.star>=3?8:5,b.dmg*.4,'#bdf0ff',b.star>=3?2:0);}continue;}
    for(const e of near(b.x,b.y,b.r+30)){
      if(e.dead)continue;const rr=e.r+b.r;if(d2(e,b)>rr*rr)continue;
      if(b.hitT){const t=b.hitT.get(e)||0;if(t>S.t)continue;b.hitT.set(e,S.t+.3);hurt(e,b.dmg,b.col);continue;}
      if(b.hit.has(e))continue;b.hit.add(e);hurt(e,b.dmg,b.col);
      if(b.k==='bolt'){burst(b.x,b.y,'fire',4);if(b.star>=2)boom(b.x,b.y,42,b.dmg*.4,'#ff9a55');if(b.star>=3)shards(b.x,b.y,3,b.dmg*.35,'#ff7a45');}
      if(--b.pierce<0){b.life=0;break;}
    }
  }
  S.proj=S.proj.filter(b=>b.life>0);

  // enemies
  for(const e of S.enemies){
    if(e.dead)continue;
    e.flash=Math.max(0,e.flash-dt);e.slowT=Math.max(0,e.slowT-dt);
    if(e.burnT>0){e.burnT-=dt;e.hp-=e.burnD*dt;if(e.hp<=0){kill(e);continue;}}
    if(e.frozenT>0){e.frozenT-=dt;e.slowT=Math.max(e.slowT,.2);continue;}
    const dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;
    const sp=e.sp*(e.slowT>0?1-st.slow:1);
    e.x+=dx/l*sp*dt;e.y+=dy/l*sp*dt;
    if(l<e.r+p.r&&p.inv<=0){if(st.armorNova&&S.t>(S.armorCD||0)){S.armorCD=S.t+3;freezeIn(p.x,p.y,120,1);S.fx.push({k:'nova',x:p.x,y:p.y,r:120,life:.4,col:'160,225,255'});if(st.armorNova>=3)hurt(e,40*scale(),'#bdf0ff');}
      p.hp-=e.dmg*(1-st.armor);p.inv=.7;addText(p.x,p.y-20,'-'+R(e.dmg*(1-st.armor)),'#ff5d7a');}
    if(l>1600){e.dead=true;} // far away stragglers are dropped (respawned by flow)
  }
  // light separation
  for(const [,a] of grid){if(a.length<2)continue;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length&&j<i+6;j++){const e=a[i],f=a[j];const dx=f.x-e.x,dy=f.y-e.y,q=dx*dx+dy*dy,rr=e.r+f.r;if(q>0&&q<rr*rr){const l=Math.sqrt(q),push=(rr-l)/2/l;e.x-=dx*push;e.y-=dy*push;f.x+=dx*push;f.y+=dy*push;}}}
  S.enemies=S.enemies.filter(e=>!e.dead);

  // gems
  const pr=st.pickup;
  for(const g of S.gems){
    const q=d2(g,p);
    if(g.mag||q<pr*pr){g.mag=true;const l=Math.sqrt(q)||1,sp=Math.max(260,600-l);g.x+=(p.x-g.x)/l*sp*dt;g.y+=(p.y-g.y)/l*sp*dt;}
    if(q<22*22){g.got=true;
      if(g.chest){S.gem+=20;gainXp(20);toast('보물상자! 무료 마법 + ◆20');freeSummon();}
      else{const v=g.v*(st.dbl&&Math.random()<st.dbl?2:1);S.gem+=v*st.gemMul;gainXp(v);}}
  }
  S.gems=S.gems.filter(g=>!g.got);
  for(const f of S.items){f.life-=dt;if(d2(f,p)<(p.r+16)**2){f.life=0;useItem(f);}}
  S.items=S.items.filter(f=>f.life>0);

  // fx
  for(const f of S.fx){
    if(f.k==='meteor'){f.t-=dt;if(f.t<=0&&!f.done){f.done=true;f.life=.35;
      for(const e of near(f.x,f.y,f.r+30)){const rr=f.r+e.r;if(d2(e,f)<rr*rr)hurt(e,f.dmg,'#ffb04a');}
      burst(f.x,f.y,'fire',22);
      if(!f.mini&&f.star>=2)zone(f.x,f.y,62,2.5,f.dmg*.12,'255,120,40','fire');
      if(!f.mini&&f.star>=3)for(let i=0;i<3;i++){const a=i*2.094+rnd(0,1);S.fx.push({k:'meteor',mini:true,x:f.x+Math.cos(a)*90,y:f.y+Math.sin(a)*90,t:.4,max:.4,r:42,dmg:f.dmg*.35});}}
      if(f.done)f.life-=dt;}
    else{f.life-=dt;if(f.k==='spark'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92;}}
  }
  S.fx=S.fx.filter(f=>f.k==='meteor'?(!f.done||f.life>0):f.life>0);
  for(const t of S.texts){t.life-=dt;t.y-=40*dt;}
  S.texts=S.texts.filter(t=>t.life>0);

  if(p.hp<=0&&(st.revives||0)>S.revUsed){S.revUsed++;p.hp=p.maxhp*.5;p.inv=2.5;
    for(const e of near(p.x,p.y,220)){const dx=e.x-p.x,dy=e.y-p.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*140;e.y+=dy/l*140;}
    S.fx.push({k:'nova',x:p.x,y:p.y,r:220,life:.6,col:'126,224,138'});burst(p.x,p.y,'nature',50);toast('세계수의 가호로 부활했어요!');
    if(st.reviveStar>=2)for(const e of near(p.x,p.y,290)){if(!e.dead&&d2(e,p)<290*290)hurt(e,100*scale(),'#7ee08a');}
    if(st.reviveStar>=3)p.inv=5;}
  if(p.hp<=0){p.hp=0;showEnd(false);}
  else if(S.t>=600){S.won=true;showEnd(true);}
}

// ---------- render ----------
function hash(i,j){let h=(i*374761393+j*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967295;}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0f1226';ctx.fillRect(0,0,W,H);
  if(!S){drawTitleBg();return;}
  const p=S.p,hw=W/2/SC,hh=H/2/SC;
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*(W/2-SC*p.x),DPR*(H/2-SC*p.y));
  // ground: grass tufts + flowers on a stable hash
  const G=48,i0=Math.floor((p.x-hw)/G)-1,i1=Math.floor((p.x+hw)/G)+1,j0=Math.floor((p.y-hh)/G)-1,j1=Math.floor((p.y+hh)/G)+1;
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){
    const h=hash(i,j),x=i*G+h*G,y=j*G+hash(j,i)*G;
    if(h<.35){ctx.fillStyle='rgba(120,140,255,.10)';ctx.fillRect(x,y,2,2);}
    else if(h<.42){ctx.strokeStyle='rgba(110,200,130,.22)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y-7);ctx.moveTo(x,y);ctx.lineTo(x+3,y-8);ctx.stroke();}
    else if(h<.44){ctx.fillStyle='rgba(255,220,140,.35)';ctx.beginPath();ctx.arc(x,y,2.2,0,6.283);ctx.fill();}
  }
  // thorns aura
  for(const it of S.eq)if(it.id==='thorns'){const rad=55+15*it.star;ctx.fillStyle='rgba(126,224,138,.08)';ctx.strokeStyle='rgba(126,224,138,.35)';ctx.lineWidth=2;ctx.setLineDash([6,8]);ctx.lineDashOffset=-S.t*20;ctx.beginPath();ctx.arc(p.x,p.y,rad,0,6.283);ctx.fill();ctx.stroke();ctx.setLineDash([]);}
  // zones
  for(const z of S.zones){const k=Math.min(1,z.life/z.max*2);
    if(z.kind==='twister'){ctx.save();ctx.translate(z.x,z.y);ctx.rotate(S.t*10);ctx.strokeStyle=`rgba(${z.col},${.8*k})`;ctx.lineWidth=3;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,0,z.r*(.4+i*.3),i,i+3.6);ctx.stroke();}ctx.restore();}
    else{ctx.fillStyle=`rgba(${z.col},${(z.kind==='fire'?.28:.16)*k})`;ctx.beginPath();ctx.arc(z.x,z.y,z.r*(z.kind==='fire'?1+Math.sin(S.t*12+z.x)*.04:1),0,6.283);ctx.fill();}}
  // meteor markers
  for(const f of S.fx)if(f.k==='meteor'&&!f.done){const k=1-f.t/f.max;ctx.strokeStyle='rgba(255,140,60,.7)';ctx.fillStyle=`rgba(255,120,40,${.08+.15*k})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();ctx.stroke();
    const mx=f.x+90*(1-k),my=f.y-260*(1-k);ctx.fillStyle='#ffb04a';ctx.beginPath();ctx.arc(mx,my,10,0,6.283);ctx.fill();ctx.strokeStyle='rgba(255,176,74,.5)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx+30,my-80);ctx.stroke();}
  // gems
  for(const g of S.gems){
    if(g.chest){ctx.fillStyle='#b4621a';ctx.fillRect(g.x-11,g.y-8,22,16);ctx.fillStyle='#ffcf5a';ctx.fillRect(g.x-11,g.y-3,22,3);ctx.fillRect(g.x-2,g.y-4,4,6);continue;}
    const s=g.big?8:4.5;ctx.fillStyle=g.big?'#ffe08a':'#ffcf5a';ctx.beginPath();ctx.moveTo(g.x,g.y-s);ctx.lineTo(g.x+s*.7,g.y);ctx.lineTo(g.x,g.y+s);ctx.lineTo(g.x-s*.7,g.y);ctx.closePath();ctx.fill();}
  // field items
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='20px system-ui, sans-serif';
  for(const f of S.items){const bob=Math.sin(S.t*3+f.t)*3,blink=f.life<6&&Math.floor(f.life*6)%2===0;if(blink)continue;
    const c=FIELD[f.k].col;ctx.fillStyle=`rgba(${c},.18)`;ctx.strokeStyle=`rgba(${c},.8)`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(f.x,f.y+bob,15+Math.sin(S.t*5+f.t)*1.5,0,6.283);ctx.fill();ctx.stroke();ctx.fillText(FIELD[f.k].icon,f.x,f.y+bob+1);}
  ctx.textBaseline='alphabetic';
  // enemies
  for(const e of S.enemies){
    const bob=Math.sin(S.t*6+e.wob)*1.5;
    ctx.fillStyle=e.flash>0?'#ffffff':e.frozenT>0?'#cfefff':(e.slowT>0?mix(e.col,'#9fe6ff'):e.col);
    ctx.beginPath();
    if(e.type==='bat'){ctx.ellipse(e.x,e.y+bob,e.r,e.r*.8,0,0,6.283);ctx.fill();const w=Math.sin(S.t*20+e.wob)*4;ctx.beginPath();ctx.moveTo(e.x-e.r,e.y+bob);ctx.lineTo(e.x-e.r-9,e.y+bob-6+w);ctx.lineTo(e.x-e.r+2,e.y+bob+4);ctx.moveTo(e.x+e.r,e.y+bob);ctx.lineTo(e.x+e.r+9,e.y+bob-6+w);ctx.lineTo(e.x+e.r-2,e.y+bob+4);ctx.fill();}
    else if(e.type==='golem'){ctx.roundRect?ctx.roundRect(e.x-e.r,e.y-e.r+bob*.5,e.r*2,e.r*2,6):ctx.rect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);ctx.fill();}
    else{ctx.ellipse(e.x,e.y+bob*.6,e.r*1.1,e.r*(.9+Math.sin(S.t*5+e.wob)*.06),0,0,6.283);ctx.fill();}
    ctx.fillStyle='#14102a';const ey=e.y-e.r*.15+bob*.5;ctx.beginPath();ctx.arc(e.x-e.r*.35,ey,Math.max(1.6,e.r*.14),0,6.283);ctx.arc(e.x+e.r*.35,ey,Math.max(1.6,e.r*.14),0,6.283);ctx.fill();
    if(e.type==='elite'||e.type==='golem'){const w=e.r*2;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(e.x-e.r,e.y-e.r-9,w,4);ctx.fillStyle='#ff5d7a';ctx.fillRect(e.x-e.r,e.y-e.r-9,w*Math.max(0,e.hp/e.max),4);}
    if(e.type==='elite'){ctx.strokeStyle='rgba(255,93,122,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+5+Math.sin(S.t*6)*2,0,6.283);ctx.stroke();}
  }
  // frost ring
  for(const it of S.eq)if(it.id==='frostring'){const n=2+it.star;for(let i=0;i<n;i++){const a=S.ringA+i*6.283/n,ox=p.x+Math.cos(a)*78,oy=p.y+Math.sin(a)*78;
    ctx.save();ctx.translate(ox,oy);ctx.rotate(a*2);ctx.fillStyle='#bdf0ff';ctx.shadowColor='#6fd3ff';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(5,0);ctx.lineTo(0,9);ctx.lineTo(-5,0);ctx.closePath();ctx.fill();ctx.restore();}}
  // projectiles
  for(const b of S.proj){
    if(b.k==='bolt'){ctx.fillStyle='#ffd27a';ctx.shadowColor='#ff7a45';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();ctx.shadowBlur=0;}
    else if(b.k==='lance'){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a);ctx.fillStyle='#d6f6ff';ctx.shadowColor='#6fd3ff';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-12,-4);ctx.lineTo(-12,4);ctx.closePath();ctx.fill();ctx.restore();}
    else if(b.k==='shard'){ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();}
    else if(b.k==='boom'){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(S.t*14);ctx.strokeStyle='#d9bcff';ctx.lineWidth=3;ctx.shadowColor='#c79bff';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,0,b.r,0,4.2);ctx.stroke();ctx.beginPath();ctx.arc(0,0,b.r*.55,2,5.6);ctx.stroke();ctx.restore();}
  }
  // player
  const blink=p.inv>0&&Math.floor(S.t*20)%2===0;
  if(!blink){
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(p.x,p.y+13,12,4,0,0,6.283);ctx.fill();
    ctx.fillStyle='#3b3f9e';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
    ctx.fillStyle='#ffe2c4';ctx.beginPath();ctx.arc(p.x+p.fx*2,p.y-2,7,0,6.283);ctx.fill();
    ctx.fillStyle='#5b5fd6';ctx.beginPath();ctx.moveTo(p.x-13,p.y-6);ctx.lineTo(p.x+13,p.y-6);ctx.lineTo(p.x+4-p.fx*2,p.y-30);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffcf5a';ctx.beginPath();ctx.arc(p.x+4-p.fx*2,p.y-30,3,0,6.283);ctx.fill();
  }
  // zaps
  for(const f of S.fx)if(f.k==='zap'){ctx.strokeStyle=`rgba(220,190,255,${f.life/.18})`;ctx.lineWidth=3;ctx.shadowColor='#c79bff';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(f.x1,f.y1);const sg=5;for(let i=1;i<sg;i++){const k=i/sg;ctx.lineTo(f.x1+(f.x2-f.x1)*k+rnd(-8,8),f.y1+(f.y2-f.y1)*k+rnd(-8,8));}ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.shadowBlur=0;}
  // explosions + sparks
  for(const f of S.fx){
    if(f.k==='nova'){const k=f.life/.45;ctx.fillStyle=`rgba(${f.col||'255,200,70'},${.28*Math.min(1,k)})`;ctx.strokeStyle=`rgba(${f.col||'255,220,120'},${Math.min(1,k)})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.05-.35*Math.min(1,k)),0,6.283);ctx.fill();ctx.stroke();}
    else if(f.k==='blast'){const k=f.life/.3;ctx.globalAlpha=k;ctx.strokeStyle=f.col||'#ff9640';ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,(f.r||55)*(1.1-k*.5),0,6.283);ctx.stroke();ctx.globalAlpha=1;}
    else if(f.k==='meteor'&&f.done){const k=f.life/.35;ctx.fillStyle=`rgba(255,160,60,${.5*k})`;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.2-k*.2),0,6.283);ctx.fill();}
    else if(f.k==='spark'){ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.col;ctx.fillRect(f.x-2,f.y-2,4,4);ctx.globalAlpha=1;}
  }
  // damage text
  ctx.font='bold 13px Jua, system-ui, sans-serif';ctx.textAlign='center';
  for(const t of S.texts){ctx.globalAlpha=Math.min(1,t.life*2);ctx.fillStyle='#000';ctx.fillText(t.txt,t.x+1,t.y+1);ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,t.y);}
  ctx.globalAlpha=1;
  // joystick (screen space)
  ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const f of S.fx)if(f.k==='chill'){ctx.fillStyle=`rgba(${f.col||'160,225,255'},${.35*f.life/.5})`;ctx.fillRect(0,0,W,H);}
  if(joy.on&&mode==='play'){const r=cv.getBoundingClientRect(),ox=joy.ox-r.left,oy=joy.oy-r.top;let dx=joy.x-joy.ox,dy=joy.y-joy.oy;const l=Math.hypot(dx,dy);if(l>50){dx=dx/l*50;dy=dy/l*50;}
    ctx.strokeStyle='rgba(236,233,255,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ox,oy,50,0,6.283);ctx.stroke();ctx.fillStyle='rgba(236,233,255,.35)';ctx.beginPath();ctx.arc(ox+dx,oy+dy,20,0,6.283);ctx.fill();}
}
function mix(a,b){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=((pa>>16)+(pb>>16))>>1,g=(((pa>>8)&255)+((pb>>8)&255))>>1,bl=((pa&255)+(pb&255))>>1;return`rgb(${r},${g},${bl})`;}
function drawTitleBg(){
  const t=performance.now()/1000;
  for(let i=0;i<70;i++){const x=hash(i,1)*W,y=hash(i,2)*H,tw=.3+.7*Math.abs(Math.sin(t*(.5+hash(i,3))+i));ctx.fillStyle=`rgba(255,240,200,${.5*tw})`;ctx.fillRect(x,y,2,2);}
}

// ---------- hud ----------
let lastHud='';
function hud(){
  if(!S)return;
  const p=S.p,g=Math.floor(S.gem),c=Math.min(...S.shop.filter(Boolean).map(priceOf),99);
  const key=[R(p.hp),R(p.maxhp),Math.floor(S.t),g,S.kills,c,S.newStock,S.lv,Math.floor(S.xp)].join('|');
  if(key===lastHud)return;lastHud=key;
  el.hpbar.style.width=(100*p.hp/p.maxhp)+'%';
  el.xpbar.style.width=(S.lv>=MAXLV?100:100*S.xp/xpNeed(S.lv))+'%';
  el.lvl.textContent=`Lv.${S.lv}`;
  el.hptext.textContent=`${R(p.hp)} / ${R(p.maxhp)}`;
  el.timer.textContent=fmt(S.t);
  el.gems.textContent=`◆ ${g}`;
  el.kills.textContent=`처치 ${S.kills}`;
  el.cost.textContent=c<99?`◆ ${c}~`:'품절';
  el.drawBtn.classList.toggle('poor',g<c);
  let dot=el.drawBtn.querySelector('.dot');
  if(S.newStock&&!dot){dot=document.createElement('span');dot.className='dot';el.drawBtn.appendChild(dot);}
  else if(!S.newStock&&dot)dot.remove();
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
  if(mode==='play')update(dt);
  if(popT>0){popT-=dt;if(popT<=0)el.pop.classList.remove('show');}
  if(toastT>0){toastT-=dt;if(toastT<=0)el.toast.classList.remove('show');}
  render();hud();
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
})();
</script>
