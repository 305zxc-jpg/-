/* Layout: full-bleed pixel canvas, HUD pinned top, spell tray + shop pinned bottom. One fixed 25-colour palette shared with the sprites; single deliberate night theme. */
:root{
  --ink:#f4f4f4;
  --muted:#94b0c2;
  --dark:#1a1c2c;
  --panel:#262b44;
  --panel2:#333c57;
  --edge:#566c86;
  --gold:#ffcd75;
  --gold2:#f2a93b;
  --hp:#b13e53;
  --font:"Galmuri11","Galmuri14",monospace;
  --font14:"Galmuri14","Galmuri11",monospace;
  --notch:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--dark);color:var(--ink);font-family:var(--font14);font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;font-smooth:never}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;font-size:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pxi{image-rendering:pixelated;width:36px;height:36px;display:block}
.pxi.sm{width:24px;height:24px;display:inline-block;vertical-align:middle}
.pxi.lg{width:48px;height:48px;margin:0 auto}
.pxi.xl{width:72px;height:72px;margin:0 auto}
/* shared pixel frame: dark outer line, lighter inner bevel, notched corners */
.card,#pop,#toast,.stat,#pauseBtn,.slot,.offer,.cell,.ghost,.big,#drawBtn,.lvrow,.act,.desc,.pill,.traits div,.statsgrid div,.hpwrap,.xpwrap,.rules summary,.tag{clip-path:var(--notch);border:3px solid var(--dark)}

#hud{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.row{display:flex;align-items:center;gap:8px}
.bars{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.hpwrap{position:relative;height:22px;background:var(--dark);box-shadow:inset 0 0 0 2px var(--panel2)}
.hpwrap::before{content:"♥";position:absolute;left:6px;top:50%;transform:translateY(-50%);font-family:var(--font);font-size:11px;color:var(--ink);z-index:2}
#hpbar{position:absolute;left:2px;top:2px;bottom:2px;width:100%;max-width:calc(100% - 4px);background:var(--hp);box-shadow:inset 0 3px 0 #ef7d57,inset 0 -3px 0 #6e1f3a;transition:width .1s steps(3)}
#hptext{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font);font-size:11px;z-index:2;text-shadow:1px 1px 0 var(--dark)}
.xpwrap{height:12px;background:var(--dark);border-width:2px}
#xpbar{height:100%;width:0;background:#41a6f6;box-shadow:inset 0 2px 0 #73eff7;transition:width .15s steps(3)}
#timer{font-size:28px;min-width:76px;text-align:center;font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 var(--dark)}
#pauseBtn{pointer-events:auto;width:40px;height:40px;background:var(--panel2);box-shadow:inset 0 -4px 0 var(--panel),inset 0 3px 0 var(--edge);font-family:var(--font);font-size:11px}
.stat{font-family:var(--font);font-size:11px;padding:3px 8px;background:var(--panel);box-shadow:inset 0 2px 0 var(--panel2);font-variant-numeric:tabular-nums}
#lvl{color:#73eff7}
#gems{color:var(--gold)}
#kills{color:var(--muted)}
#syn{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-family:var(--font);font-size:11px;padding:2px 6px;background:var(--dark);opacity:.6;border-color:currentColor;border-width:2px}
.pill.max{background:var(--gold)!important;color:var(--dark)!important;border-color:var(--dark);animation:pmax .5s steps(2) infinite}
@keyframes pmax{0%{filter:none}100%{filter:brightness(1.25)}}
.traits .t5{color:var(--gold)}
.pill.on{opacity:1;background:var(--panel);box-shadow:inset 0 2px 0 rgba(244,244,244,.15)}

#tray{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:stretch;justify-content:center;background:linear-gradient(to top,rgba(26,28,44,.97) 70%,rgba(26,28,44,0))}
#slots{display:grid;grid-template-columns:repeat(var(--eq,5),minmax(0,54px));gap:5px;min-width:0;align-content:center}
.slot{position:relative;aspect-ratio:1;max-width:100%;background:rgba(38,43,68,.85);box-shadow:inset 0 0 0 2px var(--panel2);display:grid;place-items:center;padding:0}
.slot.full,.cell.has{background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 22%,var(--dark)) 50%,color-mix(in srgb,var(--tc2,var(--tc)) 22%,var(--dark)) 50%);box-shadow:inset 3px 3px 0 var(--tc),inset -3px -3px 0 var(--tc2,var(--tc)),inset 0 -8px 0 rgba(0,0,0,.25)}
.slot .st{position:absolute;bottom:2px;left:0;right:0;font-family:var(--font);font-size:11px;line-height:1;color:var(--gold);text-shadow:1px 1px 0 var(--dark);letter-spacing:-2px;text-align:center}
.slot .rr{position:absolute;top:4px;right:4px;width:5px;height:5px}
.slot.pop{animation:pop .4s steps(4)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
#drawBtn{position:relative;min-width:80px;background:var(--gold);color:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 -6px 0 var(--gold2),inset 0 3px 0 #fff2c8;font-size:18px;padding:6px 8px 9px}
#drawBtn b{font-family:var(--font);font-size:11px;font-weight:normal;background:var(--dark);color:var(--gold);padding:2px 6px}
#drawBtn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--gold2),inset 0 3px 0 #fff2c8}
#drawBtn.poor{filter:saturate(.35) brightness(.75)}
#drawBtn .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--hp);box-shadow:0 0 0 2px var(--dark)}

#pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;background:var(--panel);box-shadow:inset 0 0 0 3px var(--tc,var(--edge));padding:14px 22px;text-align:center;min-width:170px;display:flex;flex-direction:column;gap:4px}
#pop.show{opacity:1;animation:popin .25s steps(3)}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(.6)}100%{transform:translate(-50%,-50%) scale(1)}}
#pop .nm{font-size:20px}
#pop .sub{font-family:var(--font);font-size:11px;color:var(--muted)}
#pop .mg{font-size:14px;color:var(--gold)}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 118px);transform:translateX(-50%);font-family:var(--font);font-size:11px;background:var(--panel);box-shadow:inset 0 2px 0 var(--panel2);padding:7px 12px;opacity:0;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}

#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(26,28,44,.82);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#overlay.title{background:none}
#app.titlemode #hud,#app.titlemode #tray{visibility:hidden}
.card{background:var(--panel);box-shadow:inset 0 0 0 3px var(--panel2),inset 0 6px 0 rgba(244,244,244,.05);padding:20px 18px;width:min(380px,100%);max-height:calc(100% - 40px);overflow:auto;display:flex;flex-direction:column;gap:12px;text-align:center;box-sizing:border-box}
.titlecard{align-self:end;margin-bottom:max(28px,env(safe-area-inset-bottom,0px));background:rgba(38,43,68,.94)}
.card h1{margin:0;font-size:42px;font-weight:normal;color:var(--gold);text-shadow:3px 3px 0 #b13e53,6px 6px 0 var(--dark);line-height:1.2;text-wrap:balance}
.card h2{margin:0;font-size:28px;font-weight:normal;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.card p.small{font-family:var(--font);font-size:11px;line-height:1.5}
.kicker{font-family:var(--font);font-size:11px;letter-spacing:.2em;color:#73eff7}
.best{color:var(--gold)!important}
.rules{text-align:left;display:flex;flex-direction:column;gap:10px}
.rules summary{cursor:pointer;color:var(--ink);text-align:center;list-style:none;padding:8px;background:var(--panel2);box-shadow:inset 0 -4px 0 var(--panel)}
.rules summary::-webkit-details-marker{display:none}
.rules[open] summary{margin-bottom:10px}
.how{display:grid;gap:9px;text-align:left;font-family:var(--font);font-size:11px;line-height:1.6}
.how div{display:flex;gap:8px;align-items:flex-start}
.how .bul{color:var(--gold);flex:none;width:14px}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left;font-family:var(--font);font-size:11px;margin-top:10px}
.traits div{padding:6px 8px;line-height:1.5;background:var(--dark);border-color:currentColor;border-width:2px}
.traits small{color:var(--ink);display:block;font-size:11px}
.big{font-size:20px;padding:12px;background:var(--gold);color:var(--dark);box-shadow:inset 0 -6px 0 var(--gold2),inset 0 3px 0 #fff2c8}
.big:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--gold2),inset 0 3px 0 #fff2c8}
.ghost{font-size:14px;padding:9px;background:var(--panel2);box-shadow:inset 0 -4px 0 var(--panel),inset 0 3px 0 var(--edge)}
.ghost.on{color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold),inset 0 -4px 0 var(--panel)}
.ghost:disabled{opacity:.45}
.btns{display:flex;gap:8px}
.btns button{flex:1}
.statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statsgrid div{background:var(--dark);padding:8px;font-variant-numeric:tabular-nums}
.statsgrid b{display:block;font-weight:normal;font-size:20px}
.statsgrid span{font-family:var(--font);font-size:11px;color:var(--muted)}
.endicons{display:flex;justify-content:center;gap:6px}
.info-ic{line-height:0}
.tag{display:inline-block;font-family:var(--font);font-size:11px;padding:2px 7px;margin:2px;border-color:currentColor;border-width:2px;background:var(--dark)}
.desc{background:var(--dark);padding:10px;font-family:var(--font);font-size:11px;line-height:1.6;text-align:left}
.desc .nx{color:var(--muted)}
.spl{color:var(--muted);margin-top:4px}
.spl.on{color:var(--gold)}

.perks{display:flex;flex-direction:column;gap:8px}
.perk{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;background:var(--panel2);border:3px solid var(--dark);clip-path:var(--notch);box-shadow:inset 0 -5px 0 var(--panel),inset 0 3px 0 var(--edge)}
.perk:active,.perk:focus-visible{box-shadow:inset 0 0 0 3px var(--gold),inset 0 -5px 0 var(--panel)}
.perk span{display:flex;flex-direction:column;gap:3px}
.perk b{font-weight:normal;font-size:14px;color:var(--gold)}
.perk small{font-family:var(--font);font-size:11px;color:var(--muted)}
.perk .pkn{color:var(--ink)}
.shop{gap:9px}
.shop h2{font-size:22px}
.shophead{display:flex;justify-content:space-between;align-items:center}
.bal{color:var(--gold);font-size:22px;font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 var(--dark)}
.lvrow{display:flex;align-items:center;gap:8px;background:var(--dark);padding:6px 8px;text-align:left}
.lvrow .lv{font-size:16px;color:#73eff7;flex:none}
.lvrow .odds{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 8px;font-family:var(--font);font-size:11px;font-variant-numeric:tabular-nums}
.lvrow .nx{flex:none;font-family:var(--font);font-size:11px;color:var(--muted);text-align:right;line-height:1.4}
.offers{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px}
.offer{position:relative;padding:7px 2px 6px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 18%,var(--dark)) 50%,color-mix(in srgb,var(--tc2,var(--tc)) 18%,var(--dark)) 50%);box-shadow:inset 2px 2px 0 var(--tc),inset -2px -2px 0 var(--tc2,var(--tc)),inset 0 -5px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:112px;min-width:0;font-family:var(--font);font-size:11px}
.offer .ic{line-height:0}
.offer .nm{font-size:11px;line-height:1.3;word-break:keep-all}
.offer .meta,.offer .bd,.offer .sy{font-size:11px;line-height:1.3;word-break:keep-all;transform:scale(.9)}
.offer .bd{color:var(--muted)}
.offer.myth{background:color-mix(in srgb,#ff8fc8 22%,var(--dark));box-shadow:inset 0 0 0 2px #ff8fc8,inset 0 -5px 0 rgba(0,0,0,.3);animation:myth 1s steps(2) infinite}
@keyframes myth{0%{box-shadow:inset 0 0 0 2px #ff8fc8,inset 0 -5px 0 rgba(0,0,0,.3)}100%{box-shadow:inset 0 0 0 2px #73eff7,inset 0 -5px 0 rgba(0,0,0,.3)}}
.offer.merge{box-shadow:inset 0 0 0 3px var(--gold),inset 0 -5px 0 rgba(0,0,0,.3)}
.offer.merge .bd{color:var(--gold)}
.offer .pr{margin-top:auto;background:var(--dark);color:var(--gold);padding:2px 6px}
.offer:disabled{opacity:.45;cursor:default}
.offer.empty{background:var(--dark);box-shadow:inset 0 0 0 2px var(--panel2);color:var(--muted);justify-content:center;word-break:keep-all;padding:4px}
.offer.empty b{color:var(--gold);font-weight:normal}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.cell{aspect-ratio:1;background:var(--dark);box-shadow:inset 0 0 0 2px var(--panel2);position:relative;padding:0;max-width:100%;display:grid;place-items:center}
.cell.sel{box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 6px var(--dark)!important;transform:translateY(-3px)}
.cell.target:not(.sel):not(.has){box-shadow:inset 0 0 0 2px rgba(255,205,117,.5)}
.cell small{position:absolute;bottom:2px;left:0;right:0;font-family:var(--font);font-size:11px;line-height:1;color:var(--gold);letter-spacing:-2px;text-shadow:1px 1px 0 var(--dark)}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;text-align:left;margin-bottom:-4px}
.lbl span{font-family:var(--font);font-size:11px;color:var(--muted)}
.act{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--dark);padding:6px 6px 6px 10px;text-align:left;min-height:46px;box-sizing:border-box;font-family:var(--font);font-size:11px}
.act .ghost{padding:7px 10px;font-size:11px;font-family:var(--font);flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="row">
      <div class="bars"><div class="hpwrap"><div id="hpbar"></div><span id="hptext">100 / 100</span></div><div class="xpwrap"><div id="xpbar"></div></div></div>
      <div id="timer">00:00</div>
      <button id="pauseBtn" aria-label="일시정지">II</button>
    </div>
    <div class="row"><span class="stat" id="lvl">Lv.1</span><span class="stat" id="gems">◆ 0</span><span class="stat" id="kills">처치 0</span></div>

    <div id="slots"></div>

  </div>

</div>

<script>
(()=>{
'use strict';
// ---------- data ----------
const TRAITS={
  fire:{name:'화염',color:'#ff7a45',fx:['모든 피해 +40%','피해 +100%, 처치한 적이 크게 폭발','피해 ×1.5 추가, 모든 공격이 불태움']},
  frost:{name:'냉기',color:'#6fd3ff',fx:['45% 둔화, 둔화된 적 받는 피해 +20%','65% 둔화, 둔화된 적 받는 피해 +50%','피해 ×2, 받는 피해 ×2, 3초마다 화면 전체 빙결']},
  storm:{name:'폭풍',color:'#c79bff',fx:['재사용 대기 -30%, 피해 +15%','-45%, 피해 +35%, 40% 확률로 한 번 더','피해 ×1.5, 대기 -30%, 70% 두 번 발동, 매초 벼락']},
  nature:{name:'자연',color:'#7ee08a',fx:['초당 3 회복, 체력 +50, 피해 +10%','초당 8 회복, 체력 +150, 피해 +25%, 이동 +15%','피해 +50%, 받는 피해 -40%, 초당 20 회복, 가시 폭풍']},
};
const RAR=[{name:'일반',col:'#a9a6d0'},{name:'희귀',col:'#5aa8ff'},{name:'전설',col:'#ffcf5a'},{name:'신화',col:'#ff6bd6'},{name:'복합',col:'#7ee8c8'}];
const M=[0,1,2,4]; // star power: 9 copies for ★3 should feel huge
const R=n=>Math.round(n);
const ITEMS={
  firebolt:{name:'불꽃탄',trait:'fire',rar:0,w:1,desc:s=>`가장 가까운 적 ${s}명에게 불꽃을 쏩니다. 피해 ${R(13*M[s])}`},
  meteor:{name:'운석 낙하',trait:'fire',rar:2,w:1,desc:s=>`적 무리 위에 운석 ${s}개를 떨어뜨립니다. 범위 피해 ${R(45*M[s])}`},
  fireorb:{name:'화염 구슬',trait:'fire',rar:2,w:0,desc:s=>`모든 피해 +${[0,12,25,45][s]}%`},
  frostring:{name:'서리 고리',trait:'frost',rar:0,w:1,desc:s=>`얼음 조각 ${2+s}개가 주위를 돕니다. 피해 ${R(7*M[s])}`},
  lance:{name:'얼음 창',trait:'frost',rar:1,w:1,desc:s=>`움직이는 방향으로 관통하는 창 ${s}개. 피해 ${R(20*M[s])}`},
  frostarmor:{name:'서리 갑옷',trait:'frost',rar:1,w:0,desc:s=>`받는 피해 -${[0,12,22,35][s]}%`},
  chain:{name:'연쇄 번개',trait:'storm',rar:1,w:1,desc:s=>`번개가 적 ${3+s}명 사이를 튑니다. 피해 ${R(22*M[s])}`},
  whirl:{name:'회오리 부메랑',trait:'storm',rar:1,w:1,desc:s=>`날아갔다 돌아오는 회오리 ${s}개. 피해 ${R(18*M[s])}`},
  boots:{name:'바람 장화',trait:'storm',rar:0,w:0,desc:s=>`이동 속도 +${[0,10,18,30][s]}%, 재사용 대기 -${[0,5,10,16][s]}%`},
  thorns:{name:'가시 덩굴',trait:'nature',rar:0,w:1,desc:s=>`주변 ${55+15*s} 거리 안의 적에게 지속 피해 ${R(5*M[s])}`},
  lifetree:{name:'생명 나무',trait:'nature',rar:0,w:0,desc:s=>`최대 체력 +${[0,25,50,90][s]}, 초당 회복 +${[0,.5,1.2,2.5][s]}`},
  sun:{name:'태양 강림',trait:'fire',rar:3,w:1,desc:s=>`1.8초마다 주변 ${180+25*s} 거리를 태양 폭발로 휩쓸어요. 피해 ${R(130*M[s])}`},
  zero:{name:'절대영도',trait:'frost',rar:3,w:1,desc:s=>`4초마다 화면의 모든 적을 ${(1.5+.5*s).toFixed(1)}초 얼려요. 피해 ${R(90*M[s])}`},
  thunder:{name:'천둥신의 분노',trait:'storm',rar:3,w:1,desc:s=>`0.7초마다 하늘에서 벼락 ${4+3*s}줄기가 떨어져요. 피해 ${R(70*M[s])}`},
  worldtree:{name:'세계수',trait:'nature',rar:3,w:0,desc:s=>`모든 피해 +${[0,20,40,70][s]}%, 최대 체력 +${[0,60,120,200][s]}, 초당 회복 +${[0,2,4,7][s]}. 쓰러지면 부활 (게임당 ${s}번)`},
  breath:{name:'화염 숨결',trait:'fire',rar:1,w:1,desc:s=>`바라보는 방향으로 불길 ${5+2*s}줄기를 내뿜어요. 피해 ${R(11*M[s])}`},
  blizzard:{name:'눈보라',trait:'frost',rar:1,w:1,desc:s=>`적 무리 위에 눈보라 ${s>=3?2:1}개를 3초간 일으켜요. 초당 피해 ${R(14*M[s])}, 둔화`},
  stormorb:{name:'폭풍 구슬',trait:'storm',rar:2,w:1,desc:s=>`천천히 나아가며 주변 적을 감전시키는 구슬 ${s>=3?2:1}개. 피해 ${R(16*M[s])}`},
  spore:{name:'포자 지뢰',trait:'nature',rar:1,w:1,desc:s=>`적이 닿으면 터지는 버섯 지뢰를 ${s}개씩 심어요. 폭발 피해 ${R(30*M[s])}`},
  steam:{name:'증기 폭발',trait:'fire',trait2:'frost',rar:4,w:1,desc:s=>`증기탄 ${s>=3?2:1}발. 폭발 피해 ${R(30*M[s])}, 얼었거나 둔화된 적이면 2.5배`},
  firestorm:{name:'화염 번개',trait:'fire',trait2:'storm',rar:4,w:1,desc:s=>`1초마다 가까운 적 ${2+s}명에게 벼락, 피해 ${R(35*M[s])}. 맞은 자리에 불바다`},
  bloom:{name:'불꽃 꽃',trait:'fire',trait2:'nature',rar:4,w:1,desc:s=>`적 무리에 씨앗 ${2+s}개를 심어 꽃처럼 터뜨려요. 피해 ${R(40*M[s])}`},

// ---------- helpers ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
const d2=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy};
const CELL=64;let grid=new Map();
function buildGrid(){grid=new Map();for(const e of S.enemies){const k=((e.x/CELL)|0)+','+((e.y/CELL)|0);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(e);}}
function near(x,y,r){
  const out=[],x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let i=x0;i<=x1;i++)for(let j=y0;j<=y1;j++){
    // match truncation used in buildGrid for negatives
    const a=grid.get(i+','+j);if(a)for(const e of a)out.push(e);}
  return out;
}
// buildGrid uses |0 (truncate); use floor everywhere instead for consistency
function cellKey(x,y){return Math.floor(x/CELL)+','+Math.floor(y/CELL)}
buildGrid=function(){grid=new Map();for(const e of S.enemies){if(e.dead)continue;const k=cellKey(e.x,e.y);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(e);}};

function nearestEnemies(n,maxR){
  const p=S.p,m2=maxR*maxR,arr=[];
  for(const e of S.enemies){if(e.dead)continue;const q=d2(e,p);if(q<m2)arr.push([q,e]);}
  arr.sort((a,b)=>a[0]-b[0]);return arr.slice(0,n).map(a=>a[1]);
}
function inView(){const hw=W/2/SC,hh=H/2/SC,p=S.p;return S.enemies.filter(e=>!e.dead&&Math.abs(e.x-p.x)<hw&&Math.abs(e.y-p.y)<hh);}
function addText(x,y,txt,col){if(S.texts.length>70)S.texts.shift();S.texts.push({x:x+rnd(-6,6),y,txt,col,life:.7,big:typeof txt==='number'&&txt>=40});}
function burst(x,y,trait,n){const c=TRAITS[trait].color;for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(60,220);S.fx.push({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,.7),col:c});}}

function hurt(e,dmg,col,quiet){
  if(e.dead)return false;
  dmg*=st.dmg;if(e.slowT>0)dmg*=st.amp;if(e.frozenT>0&&st.zeroAmp)dmg*=1.5;e.hp-=dmg;e.flash=.08;
  if(st.slow)e.slowT=1.2;
  if(st.ignite&&Math.random()<st.ignite){e.burnT=3;e.burnD=Math.max(e.burnD||0,dmg*.35);}
  if(!quiet)addText(e.x,e.y-e.r,R(dmg),col);
  if(e.hp<=0){kill(e);return true;}
  return false;
}
const scale=()=>1+S.t/150;
function boom(x,y,r,dmg,col){if(S.blasts.length<150)S.blasts.push({x,y,r,dmg,col});}
function shards(x,y,n,dmg,col,pierce=0,a0=Math.random()*6.283){
  for(let i=0;i<n;i++){const a=a0+i*6.283/n;S.proj.push({k:'shard',x,y,vx:Math.cos(a)*360,vy:Math.sin(a)*360,r:5,dmg,life:.7,pierce,hit:new Set(),col});}
}
function zone(x,y,r,life,dmg,col,kind){if(S.zones.length<60)S.zones.push({x,y,r,life,max:life,dmg,col,tick:0,kind});}
function freezeIn(x,y,r,t){for(const e of near(x,y,r+30)){if(e.dead)continue;if(d2(e,{x,y})<(r+e.r)**2)e.frozenT=Math.max(e.frozenT||0,t);}}
function kill(e){
  e.dead=true;S.kills++;
  if(S.fx.length<700){S.fx.push({k:'puff',x:e.x,y:e.y,r:e.r,life:.35,col:ETYPES[e.type].col});for(let i=0;i<4;i++){const a=rnd(0,6.283),v=rnd(40,140);S.fx.push({k:'spark',x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.25,.5),col:ETYPES[e.type].col});}}
  if(e.type==='elite')shake(7);
  if(st.shatter&&e.frozenT>0)boom(e.x,e.y,55,16*scale(),'#bdf0ff');
  if(st.blast&&S.blasts.length<120)S.blasts.push({x:e.x,y:e.y,r:65,dmg:22*scale()});
  if(e.type==='elite'){S.gems.push({x:e.x,y:e.y,chest:true});burst(e.x,e.y,'fire',30);}
  else{const dp=Math.max(.02,.3*Math.exp(-S.t/150))*(1+.3*pk('drop')); // drop chance falls as hordes grow
    if(e.type==='golem'){if(Math.random()<Math.min(1,dp*1.5))S.gems.push({x:e.x,y:e.y,v:3,big:true});}
    else if(Math.random()<dp)S.gems.push({x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),v:1});}
  if(S.gems.length>500){ // fold oldest gems into one to keep things fast
    let sum=0;const keep=[];for(let i=0;i<S.gems.length;i++){const g=S.gems[i];if(i<200&&!g.chest)sum+=g.v;else keep.push(g);}
    keep.push({x:S.p.x+rnd(-200,200),y:S.p.y+rnd(-200,200),v:sum,big:true});S.gems=keep;}
}

  if(S.t>=S.nextStock){S.nextStock+=restockT();const intr=Math.min(intCap(),Math.floor(S.gem/10));S.gem+=intr;
    if(!S.locked){restock();S.newStock=true;}

    it.cd-=dt;if(it.cd<=0){if(fireWeapon(it)){it.cd=BASECD[it.id]*st.cd;if(st.echo&&Math.random()<st.echo){fireWeapon(it);addText(S.p.x,S.p.y-34,'연속 발동!','#c79bff');}}else it.cd=.15;}}

      if(--b.pierce<0){b.life=0;break;}
    }
  }
  S.proj=S.proj.filter(b=>b.life>0);

  // enemies
  for(const e of S.enemies){
    if(e.dead)continue;
    e.flash=Math.max(0,e.flash-dt);e.slowT=Math.max(0,e.slowT-dt);
    if(e.burnT>0){e.burnT-=dt;e.hp-=e.burnD*dt;if(e.hp<=0){kill(e);continue;}}
    if(e.frozenT>0){e.frozenT-=dt;e.slowT=Math.max(e.slowT,.2);continue;}
    const dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;
    const sp=e.sp*(e.slowT>0?1-st.slow:1);
    e.x+=dx/l*sp*dt;e.y+=dy/l*sp*dt;
    if(l<e.r+p.r&&p.inv<=0){if(st.armorNova&&S.t>(S.armorCD||0)){S.armorCD=S.t+3;freezeIn(p.x,p.y,120,1);S.fx.push({k:'nova',x:p.x,y:p.y,r:120,life:.4,col:'160,225,255'});if(st.armorNova>=3)hurt(e,40*scale(),'#bdf0ff');}
      p.hp-=e.dmg*(1-st.armor);p.inv=.7;shake(2.5);addText(p.x,p.y-20,'-'+R(e.dmg*(1-st.armor)),'#ff5d7a');}
    if(l>1600){e.dead=true;} // far away stragglers are dropped (respawned by flow)
  }
  // light separation
  for(const [,a] of grid){if(a.length<2)continue;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length&&j<i+6;j++){const e=a[i],f=a[j];const dx=f.x-e.x,dy=f.y-e.y,q=dx*dx+dy*dy,rr=e.r+f.r;if(q>0&&q<rr*rr){const l=Math.sqrt(q),push=(rr-l)/2/l;e.x-=dx*push;e.y-=dy*push;f.x+=dx*push;f.y+=dy*push;}}}
  S.enemies=S.enemies.filter(e=>!e.dead);

  // gems
  const pr=st.pickup;
  for(const g of S.gems){
    const q=d2(g,p);
    if(g.mag||q<pr*pr){g.mag=true;const l=Math.sqrt(q)||1,sp=Math.max(260,600-l);g.x+=(p.x-g.x)/l*sp*dt;g.y+=(p.y-g.y)/l*sp*dt;}
    if(q<22*22){g.got=true;
      if(g.chest){S.gem+=20;gainXp(20);toast('보물상자! 무료 마법 + ◆20');freeSummon();}
      else{const v=g.v*(st.dbl&&Math.random()<st.dbl?2:1);S.gem+=v*st.gemMul;gainXp(v);}}
  }
  S.gems=S.gems.filter(g=>!g.got);
  for(const f of S.items){f.life-=dt;if(d2(f,p)<(p.r+16)**2){f.life=0;useItem(f);}}
  S.items=S.items.filter(f=>f.life>0);

  // fx
  for(const f of S.fx){
    if(f.k==='meteor'){f.t-=dt;if(f.t<=0&&!f.done){f.done=true;f.life=.35;
      for(const e of near(f.x,f.y,f.r+30)){const rr=f.r+e.r;if(d2(e,f)<rr*rr)hurt(e,f.dmg,'#ffb04a');}
      burst(f.x,f.y,'fire',22);shake(f.mini?1.5:3.5);
      if(!f.mini&&f.star>=2)zone(f.x,f.y,62,2.5,f.dmg*.12,'255,120,40','fire');
      if(!f.mini&&f.star>=3)for(let i=0;i<3;i++){const a=i*2.094+rnd(0,1);S.fx.push({k:'meteor',mini:true,x:f.x+Math.cos(a)*90,y:f.y+Math.sin(a)*90,t:.4,max:.4,r:42,dmg:f.dmg*.35});}}
      if(f.done)f.life-=dt;}
    else if(f.k==='dboom'){f.t-=dt;if(f.t<=0&&!f.done){f.done=true;f.life=.3;
      for(const e of near(f.x,f.y,f.r+30)){if(e.dead||d2(e,f)>(f.r+e.r)**2)continue;if(f.spike)e.slowT=Math.max(e.slowT,1.2);if(f.freeze)e.frozenT=Math.max(e.frozenT||0,.7);hurt(e,f.dmg,f.col);}
      S.fx.push({k:'blast',x:f.x,y:f.y,life:.3,r:f.r,col:f.col});if(f.heal){p.hp=Math.min(p.maxhp,p.hp+f.heal);}if(f.petals)shards(f.x,f.y,6,f.dmg*.3,'#ffcd75');}
      if(f.done)f.life-=dt;}
    else{f.life-=dt;if(f.k==='spark'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92;}}
  }
  S.fx=S.fx.filter(f=>(f.k==='meteor'||f.k==='dboom')?(!f.done||f.life>0):f.life>0);
  for(const t of S.texts){t.life-=dt;t.y-=40*dt;}
  S.texts=S.texts.filter(t=>t.life>0);

  if(p.hp<=0&&(st.revives||0)>S.revUsed){S.revUsed++;p.hp=p.maxhp*.5;p.inv=2.5;
    for(const e of near(p.x,p.y,220)){const dx=e.x-p.x,dy=e.y-p.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*140;e.y+=dy/l*140;}
    S.fx.push({k:'nova',x:p.x,y:p.y,r:220,life:.6,col:'126,224,138'});burst(p.x,p.y,'nature',50);toast('세계수의 가호로 부활했어요!');shake(8);
    if(st.reviveStar>=2)for(const e of near(p.x,p.y,290)){if(!e.dead&&d2(e,p)<290*290)hurt(e,100*scale(),'#7ee08a');}
    if(st.reviveStar>=3)p.inv=5;}
  if(p.hp<=0){p.hp=0;showEnd(false);}
  else if(S.t>=600){S.won=true;showEnd(true);}
}

function render(){

  let camX=p.x+(S.shake>0?rnd(-1,1)*S.shake:0),camY=p.y+(S.shake>0?rnd(-1,1)*S.shake:0);

  // base fx
  for(const f of S.fx){
    if(f.k==='puff'){const q=f.life/.35;pxRing(f.x,f.y,f.r*(1.5-q*.6),f.col,q,PX*1.5);}
    else if(f.k==='meteor'&&f.done){const q=f.life/.35;pxDisc(f.x,f.y,f.r*.9,'#1a1c2c',.5*q);}
  }
  // ===== light pass =====
  ctx.globalCompositeOperation='lighter';
  glow(p.x,p.y,100,RGB.moon,.13);
  for(const [x,y,c] of glowDeco)glow(x,y,22,c,.35);
  for(const z of S.zones){const kz=Math.min(1,z.life/z.max*2);if(z.kind==='fire')glow(z.x,z.y,z.r*1.3,RGB.fire,.45*kz);else glow(z.x,z.y,z.r,z.col,.2*kz);}
  for(const g of S.gems){if(g.chest){glow(g.x,g.y,36,RGB.gold,.5);continue;}if((Math.floor(t*2+g.x*.13+g.y*.07)%5)===0)glow(g.x,g.y,10,RGB.gold,.5);}
  for(const f of S.items)glow(f.x,f.y,28,FIELD[f.k].col,.35);
  for(const e of S.enemies){
    if(e.burnT>0){glow(e.x,e.y-e.r*.3,e.r*1.6,RGB.fire,.55);ctx.globalAlpha=1;ctx.fillStyle='#ffcd75';ctx.fillRect(Math.round(e.x+rnd(-e.r,e.r)*.6),Math.round(e.y-e.r-rnd(0,8)),PX,PX*2);}
    if(e.frozenT>0)glow(e.x,e.y,e.r*1.4,RGB.frost,.35);
    if(e.type==='elite')glow(e.x,e.y,e.r*2.3,RGB.red,.35+.15*(Math.floor(t*4)%2));}
  for(const it of S.eq)if(it.id==='frostring'){const n=2+it.star;for(let q=0;q<n;q++){const a=S.ringA+q*6.283/n;glow(p.x+Math.cos(a)*78,p.y+Math.sin(a)*78,14,RGB.frost,.55);}}
  for(const b of S.proj){
    if(b.k==='bolt'){glow(b.x,b.y,16,RGB.fire,.8);ctx.globalAlpha=.7;ctx.fillStyle='#ef7d57';ctx.fillRect(Math.round(b.x-b.vx*.03)-2,Math.round(b.y-b.vy*.03)-2,4,4);ctx.globalAlpha=.4;ctx.fillRect(Math.round(b.x-b.vx*.055)-1,Math.round(b.y-b.vy*.055)-1,3,3);}
    else if(b.k==='lance')glow(b.x,b.y,16,RGB.frost,.6);
    else if(b.k==='shard')glow(b.x,b.y,9,rgbOf(b.col),.7);
    else if(b.k==='boom')glow(b.x,b.y,b.r*1.6,RGB.storm,.45);
    else if(b.k==='flame')glow(b.x,b.y,12,RGB.fire,.5*b.life/b.max);
    else if(b.k==='orb')glow(b.x,b.y,30,RGB.storm,.6);
    else if(b.k==='steam')glow(b.x,b.y,18,'244,244,244',.6);}
  for(const tr of S.turrets)glow(tr.x,tr.y-20,26,RGB.storm,.4+.2*(Math.floor(t*4)%2));
  if(S.set5)glow(p.x,p.y,60,rgbOf(TRAITS[S.set5].color),.3+.15*(Math.floor(t*4)%2));
  {const fs=S.face||1;glow(p.x+fs*11,p.y-19,14,RGB.frost,.6+.25*(Math.floor(t*4)%2));}
  for(const f of S.fx){
    if(f.k==='zap'){const a=Math.min(1,f.life/.18),pts=[[f.x1,f.y1]];for(let q=1;q<6;q++){const kq=q/6;pts.push([f.x1+(f.x2-f.x1)*kq+rnd(-9,9),f.y1+(f.y2-f.y1)*kq+rnd(-9,9)]);}pts.push([f.x2,f.y2]);
      ctx.globalAlpha=a*.6;pxLine(pts,'#6b3e9e',PX*3);ctx.globalAlpha=a;pxLine(pts,'#a77bf3',PX*2);pxLine(pts,'#f4f4f4',PX);glow(f.x2,f.y2,20,RGB.storm,.7*a);}
    else if(f.k==='nova'){const q=Math.min(1,f.life/.45),c=f.col||'255,205,117',rr=f.r*(1.05-.35*q);pxRing(f.x,f.y,rr,`rgb(${c})`,q,PX*2);pxRing(f.x,f.y,rr*.92,'#f4f4f4',q*.7,PX);glow(f.x,f.y,rr,c,.3*q);}
    else if(f.k==='blast'){const q=f.life/.3,r=(f.r||55),c=rgbOf(f.col||'#ef7d57');glow(f.x,f.y,r*1.2,c,.7*q);pxRing(f.x,f.y,r*(1.1-q*.5),`rgb(${c})`,q,PX*1.5);}
    else if(f.k==='meteor'&&!f.done){const q=1-f.t/f.max,mx=f.x+90*(1-q),my=f.y-260*(1-q),sz=f.mini?.6:1;
      for(let i=4;i>=1;i--){ctx.globalAlpha=.7-i*.12;ctx.fillStyle=i>2?'#b13e53':'#ef7d57';const s=Math.round((10-i*1.6)*sz)*2;ctx.fillRect(Math.round(mx+i*7*sz-s/2),Math.round(my-i*20*sz-s/2),s,s);}
      ctx.globalAlpha=1;const rk=art('rock',()=>fromGrid(GRID.rock));ctx.drawImage(rk,Math.round(mx-rk.width*sz),Math.round(my-rk.height*sz),rk.width*PX*sz,rk.height*PX*sz);glow(mx,my,16*sz,RGB.fire,.7);}
    else if(f.k==='meteor'&&f.done){const q=f.life/.35;glow(f.x,f.y,f.r*1.4,RGB.fire,.9*q);pxRing(f.x,f.y,f.r*(1.2-q*.4),'#ffcd75',q,PX*2);}
    else if(f.k==='spark'){ctx.globalAlpha=Math.min(1,f.life*2.2);ctx.fillStyle=f.col;ctx.fillRect(Math.round(f.x)-2,Math.round(f.y)-2,4,4);}
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // damage numbers (pixel font)
  ctx.textAlign='center';ctx.lineJoin='miter';
  for(const tx of S.texts){const pop=tx.life>.55?1.25:1,big=tx.big;ctx.font=`${big?22:11}px Galmuri11, monospace`;
    ctx.globalAlpha=tx.life<.2?.5:1;const x=Math.round(tx.x),y=Math.round(tx.y);ctx.save();ctx.translate(x,y);ctx.scale(pop,pop);
    ctx.fillStyle='#1a1c2c';for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1]])ctx.fillText(tx.txt,dx,dy);ctx.fillStyle=big?'#ffcd75':tx.col;ctx.fillText(tx.txt,0,0);ctx.restore();}
  ctx.globalAlpha=1;
  // ===== screen space =====
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
  drawFireflies(camX,camY,t,SC);
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.72);vg.addColorStop(0,'rgba(26,28,44,0)');vg.addColorStop(1,'rgba(14,15,28,.6)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(p.hp/p.maxhp<.3&&Math.floor(t*3)%2===0){ctx.strokeStyle='rgba(177,62,83,.55)';ctx.lineWidth=10;ctx.strokeRect(5,5,W-10,H-10);}
  for(const f of S.fx)if(f.k==='chill'){ctx.fillStyle=`rgba(${f.col||'115,239,247'},${f.life>.25?.28:.14})`;ctx.fillRect(0,0,W,H);}
  if(joy.on&&mode==='play'){const r=cv.getBoundingClientRect(),ox=joy.ox-r.left,oy=joy.oy-r.top;let dx=joy.x-joy.ox,dy=joy.y-joy.oy;const l=Math.hypot(dx,dy);if(l>50){dx=dx/l*50;dy=dy/l*50;}
    ctx.fillStyle='rgba(244,244,244,.45)';const n=24;for(let q=0;q<n;q++){const a=q/n*6.283;ctx.fillRect(Math.round(ox+Math.cos(a)*52)-2,Math.round(oy+Math.sin(a)*52)-2,4,4);}
    ctx.globalAlpha=.85;ctx.drawImage(discSpr(6),Math.round(ox+dx-18),Math.round(oy+dy-18),36,36);ctx.globalAlpha=1;}
}
// title scene drawn at quarter resolution, then scaled up crisp
let titleCv=null;
function drawTitleBg(){
  const t=performance.now()/1000,q=4,w=Math.ceil(W/q),h=Math.ceil(H/q);
  if(!titleCv||titleCv.width!==w||titleCv.height!==h)titleCv=newCanvas(w,h);
  const g=titleCv.getContext('2d');
  const bands=['#0f1024','#141631','#1a1c3a','#202448','#262b56','#2c3263'];
  for(let i=0;i<bands.length;i++){g.fillStyle=bands[i];g.fillRect(0,Math.floor(h*.62*i/bands.length),w,Math.ceil(h*.62/bands.length)+1);}
  for(let i=0;i<90;i++){const x=Math.floor(hash(i,1)*w),y=Math.floor(hash(i,2)*h*.55),on=Math.sin(t*(.6+hash(i,3)*1.5)+i)>-.3;if(!on)continue;g.fillStyle=hash(i,4)<.2?'#ffcd75':'#f4f4f4';g.fillRect(x,y,1,1);if(hash(i,5)<.08){g.fillRect(x-1,y,3,1);g.fillRect(x,y-1,1,3);}}
  const mx=Math.floor(w*.78),my=Math.floor(h*.15),mr=Math.max(5,Math.floor(Math.min(w,h)*.075));
  g.fillStyle='rgba(59,93,201,.18)';for(let r=mr*3;r>mr;r-=Math.max(2,Math.floor(mr*.5))){g.beginPath();g.arc(mx,my,r,0,6.283);g.fill();}
  for(let y=-mr;y<=mr;y++)for(let x=-mr;x<=mr;x++){const d=x*x+y*y;if(d<=mr*mr){g.fillStyle=d>(mr-1)*(mr-1)?'#94b0c2':'#f4f4f4';g.fillRect(mx+x,my+y,1,1);}}
  g.fillStyle='#94b0c2';g.fillRect(mx-Math.floor(mr*.4),my-Math.floor(mr*.2),2,2);g.fillRect(mx+Math.floor(mr*.3),my+Math.floor(mr*.3),2,1);
  const hill=(base,amp,col,f,ph)=>{g.fillStyle=col;for(let x=0;x<w;x++){const y=Math.floor(h*base+Math.sin(x*f*q+ph)*amp/q+Math.sin(x*f*q*2.3+ph*1.7)*amp*.4/q);g.fillRect(x,y,1,h-y);}};
  hill(.5,22,'#29366f',.006,1);hill(.57,18,'#1f2944',.009,4);
  g.fillStyle='#1f2944';for(let i=0;i<14;i++){const x=Math.floor(hash(i,9)*w),base=Math.floor(h*.57+Math.sin(x*q*.009+4)*18/q+Math.sin(x*q*.009*2.3+6.8)*7.2/q),th=Math.floor((26+hash(i,8)*30)/q);for(let yy=0;yy<th;yy++){const hw2=Math.floor(yy*.32);g.fillRect(x-hw2,base-th+yy,hw2*2+1,1);}}
  hill(.64,12,'#1a1c2c',.012,2);
  for(let i=0;i<9;i++){if(Math.sin(t*1.5+i)<-.5)continue;g.fillStyle='#ffcd75';g.fillRect(Math.floor(hash(i,61)*w),Math.floor(h*.6+hash(i,62)*h*.08),1,1);}
  for(const f of FF){const x=Math.floor(((f.x*w+Math.sin(t*f.sp+f.ph)*6+t*3)%w+w)%w),y=Math.floor(f.y*h*.9),on=Math.sin(t*2*f.sp+f.ph);if(on<0)continue;g.fillStyle=on>.5?'#a7f070':'#38b764';g.fillRect(x,y,1,1);}
  ctx.imageSmoothingEnabled=false;ctx.drawImage(titleCv,0,0,w*q,h*q);
}

// ---------- hud ----------
let lastHud='';
function hud(){
  if(!S)return;
  const p=S.p,g=Math.floor(S.gem),c=Math.min(...S.shop.filter(Boolean).map(priceOf),99);
  const key=[R(p.hp),R(p.maxhp),Math.floor(S.t),g,S.kills,c,S.newStock,S.lv,Math.floor(S.xp)].join('|');
  if(key===lastHud)return;lastHud=key;
  el.hpbar.style.width=(100*p.hp/p.maxhp)+'%';
  el.xpbar.style.width=(100*S.xp/xpNeed(S.lv))+'%';
  el.lvl.textContent=`Lv.${S.lv}`;
  el.hptext.textContent=`${R(p.hp)} / ${R(p.maxhp)}`;
  el.timer.textContent=fmt(S.t);
  el.gems.textContent=`◆ ${g}`;
  el.kills.textContent=`처치 ${S.kills}`;
  el.cost.textContent=c<99?`◆ ${c}~`:'품절';
  el.drawBtn.classList.toggle('poor',g<c);
  let dot=el.drawBtn.querySelector('.dot');
  if(S.newStock&&!dot){dot=document.createElement('span');dot.className='dot';el.drawBtn.appendChild(dot);}
  else if(!S.newStock&&dot)dot.remove();
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
  if(mode==='play')update(dt);
  if(mode==='play'&&S&&S.perkQ>0)showPerk();
  if(popT>0){popT-=dt;if(popT<=0)el.pop.classList.remove('show');}
  if(toastT>0){toastT-=dt;if(toastT<=0)el.toast.classList.remove('show');}
  render();hud();
  el.overlay.classList.toggle('title',mode==='title');
  $('app').classList.toggle('titlemode',mode==='title');
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
})();
</script>
