/* Layout: full-bleed pixel canvas, HUD pinned top, spell tray + shop pinned bottom. One fixed 25-colour palette shared with the sprites; single deliberate night theme. */
:root{
  --ink:#f4f4f4;
  --muted:#94b0c2;
  --dark:#1a1c2c;
  --panel:#262b44;
  --panel2:#333c57;
  --edge:#566c86;
  --gold:#ffcd75;
  --gold2:#f2a93b;
  --hp:#b13e53;
  --font:"Galmuri11","Galmuri14",monospace;
  --font14:"Galmuri14","Galmuri11",monospace;
  --notch:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--dark);color:var(--ink);font-family:var(--font14);font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;font-smooth:never}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;font-size:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pxi{image-rendering:pixelated;width:36px;height:36px;display:block}
.pxi.sm{width:24px;height:24px;display:inline-block;vertical-align:middle}
.pxi.lg{width:48px;height:48px;margin:0 auto}
.pxi.xl{width:72px;height:72px;margin:0 auto}
/* shared pixel frame: dark outer line, lighter inner bevel, notched corners */
.card,#pop,#toast,.stat,#pauseBtn,.slot,.offer,.cell,.ghost,.big,#drawBtn,.lvrow,.act,.desc,.pill,.traits div,.statsgrid div,.hpwrap,.xpwrap,.rules summary,.tag{clip-path:var(--notch);border:3px solid var(--dark)}

#hud{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.row{display:flex;align-items:center;gap:8px}
.bars{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.hpwrap{position:relative;height:22px;background:var(--dark);box-shadow:inset 0 0 0 2px var(--panel2)}
.hpwrap::before{content:"♥";position:absolute;left:6px;top:50%;transform:translateY(-50%);font-family:var(--font);font-size:11px;color:var(--ink);z-index:2}
#hpbar{position:absolute;left:2px;top:2px;bottom:2px;width:100%;max-width:calc(100% - 4px);background:var(--hp);box-shadow:inset 0 3px 0 #ef7d57,inset 0 -3px 0 #6e1f3a;transition:width .1s steps(3)}
#shbar{position:absolute;left:2px;top:2px;height:6px;width:0;max-width:calc(100% - 4px);background:#73eff7;z-index:1}
#hptext{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font);font-size:11px;z-index:2;text-shadow:1px 1px 0 var(--dark)}
.xpwrap{height:12px;background:var(--dark);border-width:2px}
#xpbar{height:100%;width:0;background:#41a6f6;box-shadow:inset 0 2px 0 #73eff7;transition:width .15s steps(3)}
#timer{font-size:28px;min-width:76px;text-align:center;font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 var(--dark)}

<script>
(()=>{
'use strict';
// ---------- data ----------
const TRAITS={
  fire:{name:'화염',color:'#ff7a45',fx:['모든 피해 +60%','피해 +160%, 처치 폭발, 처치 시 체력 흡수','피해 추가 ×2, 모든 공격이 불태움, 흡수 2배']},

  light:{name:'빛',color:'#fff1b0',fx:['피해 +20%, 초당 1.5 회복, 받는 피해 -10%','피해 +50%, 초당 3 회복, 받는 피해 -20%, 4초마다 빛 보호막','피해 추가 ×2, 받는 피해 -30%, 맞으면 빛 폭발로 반격']},

const RAR=[{name:'일반',col:'#a9a6d0'},{name:'희귀',col:'#5aa8ff'},{name:'전설',col:'#ffcf5a'},{name:'신화',col:'#ff6bd6'},{name:'복합',col:'#7ee8c8'}];
const M=[0,1,2,4]; // star power: 9 copies for ★3 should feel huge
const R=n=>Math.round(n);
const POW={blizzard:0.55,bloom:0.183,breath:0.702,chain:1.315,curse:1.945,eclipse:0.233,eruption:0.196,field:2.409,firebolt:2.912,firestorm:0.084,frostmine:2.056,frostring:2.195,frostwhirl:0.204,holybolt:1.534,holywater:0.45,icethorn:0.532,judgment:0.304,lance:1.485,lightshot:2.869,meteor:0.406,pillar:0.541,pollen:0.216,reaper:0.127,salamander:2.055,shadowbolt:6.942,shadowclone:5.058,shadowflame:0.576,snare:2.757,spore:2.237,steam:0.465,stormeye:0.341,stormorb:1.685,sun:0.057,thorns:0.735,thunder:0.127,thundertree:1.543,vampbat:5.976,voidorb:0.724,whirl:0.564,zero:0.169};let _pw=1;const Mp=s=>M[s]*_pw;

function roll(){
  // no rarity: every spell is equally likely; dual-trait spells half as often; the summoner's favourite trait twice as often
  const fav=summ().fav,w=IDS.map(id=>{const I=ITEMS[id];if(I.grow&&(allItems().some(x=>x.id===id)||(S.shop||[]).includes(id)))return 0;return (I.trait2?.5:1)*(fav&&(I.trait===fav||I.trait2===fav)?2:1);}),tot=w.reduce((a,b)=>a+b,0);
  let r2=Math.random()*tot;for(let i=0;i<IDS.length;i++){r2-=w[i];if(r2<0)return IDS[i];}
  return IDS.find(id=>!ITEMS[id].grow);
}
function giveItem(id){
  if(ITEMS[id].grow&&allItems().some(x=>x.id===id)){const v=priceOf(id);S.gem+=v;return{merged:[],sold:v};}
  const it=mk(id,1),cell=emptyCell();
  if(cell)cell[0][cell[1]]=it;else S.bench.push(it); // temporary 11th bench cell
  const merged=mergeAll();
  let sold=0;
  while(S.bench.length>benchN()){const x=S.bench.pop();if(x){const e=S.bench.indexOf(null);if(e>=0)S.bench[e]=x;else{sold=sellValue(x);S.gem+=sold;}}}
  recompute(false);renderSlots(merged.map(m=>m.uid));
  burst(S.p.x,S.p.y,ITEMS[id].trait,merged.length?40:18);
  return{merged,sold};
}

const willMerge=id=>owned1(id)>=2;
const canFit=id=>!!emptyCell()||willMerge(id);
function buy(i){
  const id=S.shop[i],c=id?priceOf(id):0;
  if(!id||S.gem<c||!canFit(id))return;
  S.gem-=c;S.draws++;S.shop[i]=null;
  const r=giveItem(id);
  const top=r.merged[r.merged.length-1];
  S.bought[i]=top?`합성! <b>${ITEMS[top.id].name} ${'★'.repeat(top.star)}</b><br>특수능력: ${SP[top.id][top.star-2]}`:`<b>${ITEMS[id].name}</b> 구매`;
  renderShop();
}
function tapCell(w,i){
  const it=S[w][i];
  if(!S.sel){if(it)S.sel={w,i};}
  else if(S.sel.w===w&&S.sel.i===i)S.sel=null;
  else{const a=S[S.sel.w],b=S[w],t=a[S.sel.i];a[S.sel.i]=b[i];b[i]=t;S.sel=null;recompute(false);renderSlots();}
  renderShop();
}

  if(!pool.length){S.perkQ=0;if(mode==='perk'){el.overlay.innerHTML='';resume();}return;}
  const pick=[];const nPick=S.summ==='archmage'?4:3;while(pick.length<nPick&&pool.length)pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);

function takePerk(k){
  if(mode!=='perk'||S.perkQ<=0||pk(k)>=PERKS[k].max)return;
  S.perks[k]=pk(k)+1;S.perkQ--;
  if(k==='slot')while(S.slots.length<eqN())S.slots.push(null);
  if(k==='bench')while(S.bench.length<benchN())S.bench.push(null);
  if(k==='shop')S.shop.push(roll());
  const hp0=S.p.maxhp;recompute(false);if(k==='hp')S.p.hp+=S.p.maxhp-hp0;
  renderSlots();toast(`특성 획득: ${PERKS[k].name}`);
  if(S.perkQ>0)showPerk();else{el.overlay.innerHTML='';resume();}
}

function mergeAll(){
  const out=[];let found=true;
  while(found){found=false;
    const g={};
    for(const it of allItems()){if(it.star>=3||it.glv)continue;const k=it.id+'|'+it.star;(g[k]=g[k]||[]).push(it);}
    for(const k in g){if(g[k].length>=3){
      const three=g[k].slice(0,3),target=three.find(x=>S.slots.includes(x))||three[0],[arr,idx]=locOf(target);
      for(const x of three){const l=locOf(x);l[0][l[1]]=null;}
      const nw=mk(three[0].id,three[0].star+1);arr[idx]=nw;
      out.push(nw);found=true;break;}}
  }
  return out;
}
function sell(it){
  const l=locOf(it);if(!l)return;
  l[0][l[1]]=null;const v=sellValue(it);S.gem+=v;
  recompute(false);renderSlots();toast(`${ITEMS[it.id].name} 판매 ◆ +${v}`);
}

function inView(){if(S.mode==='dungeon')return S.enemies.filter(e=>!e.dead);const hw=W/2/SC,hh=H/2/SC,p=S.p;return S.enemies.filter(e=>!e.dead&&Math.abs(e.x-p.x)<hw&&Math.abs(e.y-p.y)<hh);}

function burst(x,y,trait,n){const c=TR(trait).color;for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(60,220);S.fx.push({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,.7),col:c});}}

function hurt(e,dmg,col,quiet){
  if(e.dead)return false;
  dmg*=st.dmg;if(e.slowT>0)dmg*=st.amp;if(e.frozenT>0&&st.zeroAmp)dmg*=1.5;if(e.frozenT>0&&st.frost6)dmg*=3;if(e.weakT>0)dmg*=1.2;if(e.curseT>0&&st.curseAmp)dmg*=st.curseAmp;if(e.nightT>0)dmg*=2;S.dealt=(S.dealt||0)+Math.min(dmg,Math.max(0,e.hp));e.hp-=dmg;e.flash=.08;
  if(st.slow)e.slowT=1.2;

  return false;
}
const scale=()=>S.mode==='dungeon'?FLOOR_HP[S.floor]*1.2:1+S.t/150;

    else toast(`별의 씨앗 성장 Lv${it.glv}`);}
  if(it.glv>=SEED_MAX)it.gxp=0;

function boom(x,y,r,dmg,col){if(S.blasts.length<150)S.blasts.push({x,y,r,dmg,col});}
function shards(x,y,n,dmg,col,pierce=0,a0=Math.random()*6.283){

function freezeIn(x,y,r,t){for(const e of near(x,y,r+30)){if(e.dead)continue;if(d2(e,{x,y})<(r+e.r)**2)e.frozenT=Math.max(e.frozenT||0,t);}}
function doScythe(dmg,thr){const p=S.p,R2=140;S.fx.push({k:'scythe',x:p.x,y:p.y,r:R2,life:.3});shake(3);

function doBeam(a,dmg,w){const p=S.p,L=700,ux=Math.cos(a),uy=Math.sin(a);S.fx.push({k:'beam',x:p.x,y:p.y,a,len:L,w,life:.35});shake(2);

function doEclipse(dmg,r,white){const p=S.p;S.fx.push({k:'nova',x:p.x,y:p.y,r,life:.45,col:white?'255,241,176':'93,39,93'});

// ---------- boss patterns (one moveset per map, enraged below 50% hp) ----------
function tele(x,y,r,t,dmg,o={}){S.atk.push(Object.assign({k:'tele',x,y,r,t,max:t,dmg},o));}
function bossAI(e,dx,dy,l,sp,dt){
  const p=S.p,mp=S.map,dgb=S.mode==='dungeon';S.bhz=S.bhz||[];S.blines=S.blines||[];
  if(!e.p2&&e.hp<e.max*.5){e.p2=true;e.patT=Math.min(e.patT??0,1.2);toast(`${mapOf().boss}이(가) 분노했어요!`);shake(10);S.fx.push({k:'nova',x:e.x,y:e.y,r:220,life:.6,col:'177,62,83'});if(mp==='castle'){e.r=Math.round(e.r*1.2);e.dmg*=1.15;}}
  const B=e.dmg,rate=e.p2?1.4:1;
  const ring=(n=16,v=130,slow=false)=>{const o=Math.random()*6.283;for(let i=0;i<n;i++){const a=o+i/n*6.283;S.eproj.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:6,dmg:B*.5,life:4,big:true,slow});}};
  const spiral=()=>{e.spA=(e.spA||0)+.42;for(const o of (e.p2?[0,Math.PI*2/3,Math.PI*4/3]:[0,Math.PI])){const a=e.spA+o;S.eproj.push({x:e.x,y:e.y,vx:Math.cos(a)*140,vy:Math.sin(a)*140,r:6,dmg:B*.4,life:4,big:true});}};
  const blink=(fire)=>{const a=rnd(0,6.283),tx=p.x+Math.cos(a)*130,ty=p.y+Math.sin(a)*130;tele(tx,ty,e.r+10,.8,B*.6,{col:'#a77bf3'});e.wind=.8;e.after=()=>{S.fx.push({k:'puff',x:e.x,y:e.y,r:e.r,life:.35,col:'#a77bf3'});e.x=tx;e.y=ty;S.fx.push({k:'nova',x:e.x,y:e.y,r:90,life:.4,col:'167,123,243'});fire();};};
  // movement: dash > wind-up (stand still) > walk
  if(e.dash>0){e.dash-=dt;e.x+=e.ddx*560*dt;e.y+=e.ddy*560*dt;if(e.dash<=0&&e.after){const f=e.after;e.after=null;f();}}
  else if(e.wind>0){e.wind-=dt;e.flash=Math.floor(e.wind*12)%2?.05:0;if(e.wind<=0&&e.after){const f=e.after;e.after=null;f();}}
  else{e.x+=dx/l*sp*dt;e.y+=dy/l*sp*dt;}
  if(dgb){const hx=RW/2-WALL-e.r,hy=RH/2-WALL-e.r;e.x=Math.max(-hx,Math.min(hx,e.x));e.y=Math.max(-hy,Math.min(hy,e.y));}
  if(e.spT>0){e.spT-=dt;e.shT-=dt;if(e.shT<=0){e.shT=.13;spiral();}}
  e.bgT=(e.bgT??3)-dt*rate;if(e.bgT<=0&&!(e.spT>0)){ // light background pressure between patterns
    if(mp==='meadow'||mp==='ice'){e.bgT=4.2;ring(14,120,mp==='ice');}
    else{e.bgT=2.4;const a0=Math.atan2(p.y-e.y,p.x-e.x);for(let i=-2;i<=2;i++){const a=a0+i*.22;S.eproj.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,r:6,dmg:B*.45,life:4,big:true});}}}
  e.patT=(e.patT??2.5)-dt*rate;
  if(e.patT<=0&&!(e.wind>0)&&!(e.dash>0)){e.patT=3.4;const k=(e.pi=(e.pi||0)+1)%3;
    if(mp==='desert'){ // pharaoh
      if(k===0){e.spT=3;e.shT=0;toast('파라오: 나선 탄막');}
      else if(k===1){const n=e.p2?5:3;for(let i=0;i<n;i++){const a=i/n*6.283;S.bhz.push({k:'twister',x:e.x+Math.cos(a)*50,y:e.y+Math.sin(a)*50,t:7,max:7,r:20,tick:0,dmg:B*.35});}toast('모래 회오리가 쫓아와요!');}
      else blink(()=>{ring(14,150);if(e.p2){e.spT=1.5;e.shT=0;}});}
    else if(mp==='ice'){ // frost giant
      if(k===0){ring(18,120,true);if(e.p2)setTimeout0(()=>ring(18,120,true),.6,e);}
      else if(k===1){tele(p.x,p.y,75,1.3,B*.6,{col:'#73eff7',frz:true});toast('얼음 감옥! 빨리 빠져나가세요');}
      else{const n=e.p2?11:7;for(let i=0;i<n;i++){const a=rnd(0,6.283),d=i===0?0:rnd(30,180);tele(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,34,.8+i*.08,B*.5,{col:'#73eff7'});}}}
    else if(mp==='castle'){ // demon king
      if(k===0){e.spT=3;e.shT=0;}
      else if(k===1){const a=Math.atan2(p.y-e.y,p.x-e.x);for(let i=1;i<=7;i++){const d=i*48;tele(e.x+Math.cos(a)*d,e.y+Math.sin(a)*d,36,.6+i*.14,B*.7,{lava:true});}toast('지옥불 기둥!');}
      else blink(()=>{ring(16,140);if(e.p2)ring(16,95);});
      if(e.p2)for(let i=0;i<4;i++){const a=rnd(0,6.283),d=rnd(40,170);tele(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,50,1.4,B*.6);}}
    else{ // golem king
      if(k===0){const n=e.p2?5:3;for(let i=0;i<n;i++)setTimeout0(()=>tele(S.p.x,S.p.y,55,.9,B*.8),i*.45,e);toast('골렘 왕: 지면 강타');}
      else if(k===1){const dash=(again)=>{const a=Math.atan2(S.p.y-e.y,S.p.x-e.x);S.blines.push({x1:e.x,y1:e.y,x2:e.x+Math.cos(a)*300,y2:e.y+Math.sin(a)*300,t:.8,max:.8,w:e.r*2});e.wind=.8;e.after=()=>{e.ddx=Math.cos(a);e.ddy=Math.sin(a);e.dash=.5;shake(4);if(again)e.after=()=>{dash(false);};};};dash(e.p2);}
      else{ring();if(e.p2)setTimeout0(()=>ring(16,100),.5,e);}}}
  // delayed actions owned by this boss
  if(e.later){for(const q of e.later)q.t-=dt;const due=e.later.filter(q=>q.t<=0);e.later=e.later.filter(q=>q.t>0);for(const q of due)q.f();}
  e.smT=(e.smT??6)-dt;if(e.smT<=0){e.smT=dgb?9:7;const kind=mp==='castle'?'imp':mp==='desert'?'scorpion':mp==='ice'?'snowball':'slime';const nk=dgb?4:6;for(let i=0;i<nk;i++){const m=spawn(kind);if(m){const a=i/nk*6.283;m.x=e.x+Math.cos(a)*60;m.y=e.y+Math.sin(a)*60;}}}
}
function setTimeout0(f,t,e){(e.later=e.later||[]).push({f,t});}
function bossHazards(dt){const p=S.p;
  if(S.blines){for(const b of S.blines)b.t-=dt;S.blines=S.blines.filter(b=>b.t>0);}
  if(!S.bhz)return;
  for(const h of S.bhz){h.t-=dt;
    if(h.k==='twister'){const a=Math.atan2(p.y-h.y,p.x-h.x);h.x+=Math.cos(a)*62*dt;h.y+=Math.sin(a)*62*dt;h.tick-=dt;if(h.tick<=0&&d2(h,p)<(h.r+p.r)**2){h.tick=.6;hitPlayer(h.dmg,2);S.pslow=Math.max(S.pslow||0,.6);}}
    if(h.k==='blava'){h.tick-=dt;if(h.tick<=0&&d2(h,p)<(h.r+p.r*.5)**2){h.tick=.5;hitPlayer(h.dmg,0);}}}
  S.bhz=S.bhz.filter(h=>h.t>0);}
function hitPlayer(v,shk){const p=S.p;if(p.inv>0)return; // brief i-frames so a bullet ring can't land all at once
  if(st.dodge&&Math.random()<st.dodge){addText(p.x,p.y-24,'회피','#a77bf3');p.inv=Math.max(p.inv,.1);return;}
  if(st.light5&&S.t>(S.l5CD||0)){S.l5CD=S.t+.6;boom(p.x,p.y,90,30*scale(),'#fff1b0');}
  v*=1-st.armor;if(S.shield>0){const a=Math.min(S.shield,v);S.shield-=a;v-=a;if(S.shield<=0&&st.shieldBurst)boom(p.x,p.y,110,40*scale(),'#fff1b0');if(v<=0){addText(p.x,p.y-24,'막음','#73eff7');return;}}p.hp-=v;p.inv=Math.max(p.inv,.15);if(shk)shake(shk);addText(p.x,p.y-20,'-'+R(v),'#ff5d7a');}
function kill(e){
  e.dead=true;S.kills++;
  for(const it of S.eq)if(it.glv&&it.glv<SEED_MAX)seedXp(it,DG()?3:1);
  if(e.curseT>0&&st.curseSpread){let n=0;for(const o of near(e.x,e.y,120)){if(o.dead||o===e||o.curseT>0)continue;o.curseT=3;o.curseD=e.curseD;if(++n>=2)break;}}
  if(st.soul){S.p.hp=Math.min(S.p.maxhp,S.p.hp+.3);S.souls=(S.souls||0)+1;if(S.souls>=[0,25,18,15][st.soul]){S.souls=0;boom(S.p.x,S.p.y,130,45*scale(),'#d0507a');S.fx.push({k:'nova',x:S.p.x,y:S.p.y,r:130,life:.45,col:'208,80,122'});}}
  if(st.soulBlast&&S.blasts.length<120)S.blasts.push({x:e.x,y:e.y,r:55,dmg:18*scale(),col:'#d0507a'});
  if(st.wingHeal)S.p.hp=Math.min(S.p.maxhp,S.p.hp+.5);
  if(e.type==='snowball')for(let i=0;i<2;i++){const m=spawn('snowlet');if(m){m.x=e.x+rnd(-14,14);m.y=e.y+rnd(-14,14);}}
  if(st.leech)S.p.hp=Math.min(S.p.maxhp,S.p.hp+st.leech);
  if(S.fx.length<700){S.fx.push({k:'puff',x:e.x,y:e.y,r:e.r,life:.35,col:ETYPES[e.type].col});for(let i=0;i<4;i++){const a=rnd(0,6.283),v=rnd(40,140);S.fx.push({k:'spark',x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.25,.5),col:ETYPES[e.type].col});}}
  if(e.type==='elite')shake(7);
  if(st.shatter&&e.frozenT>0)boom(e.x,e.y,55,16*scale(),'#bdf0ff');
  if(st.blast&&S.blasts.length<120)S.blasts.push({x:e.x,y:e.y,r:st.fire6?130:65,dmg:22*scale()});
  if(e.type==='goldgob'){const total=Math.round(20+S.t/6),n=6;for(let i=0;i<n;i++){const a=i/n*6.283;S.gems.push({x:e.x+Math.cos(a)*24,y:e.y+Math.sin(a)*24,v:total/n,big:true});}
    S.fx.push({k:'nova',x:e.x,y:e.y,r:80,life:.5,col:'255,205,117'});burst(e.x,e.y,'fire',24);shake(4);toast(`황금 고블린 처치! 결정 ◆${total}`);}
  if(S.mode==='dungeon'&&(e.type==='boss'||!['elite','goldgob'].includes(e.type))){
    if(e.type==='boss'){S.gems.push({x:e.x,y:e.y,chest:true});for(let i=0;i<8;i++)S.gems.push({x:e.x+rnd(-40,40),y:e.y+rnd(-40,40),v:2+S.floor,big:true});S.boss=null;S.bossKilled=true;shake(10);}
    else if(Math.random()<.35*(1+.3*pk('drop')+.1*up('drop')))S.gems.push({x:e.x,y:e.y,v:1});}
  else if(e.type==='boss'){for(let i=0;i<3;i++)S.gems.push({x:e.x+rnd(-30,30),y:e.y+rnd(-30,30),chest:true});for(let i=0;i<12;i++)S.gems.push({x:e.x+rnd(-50,50),y:e.y+rnd(-50,50),v:3,big:true});toast(`${mapOf().boss}을(를) 쓰러뜨렸어요!`);shake(12);S.boss=null;S.bossKilled=true;}
  else if(e.type==='elite'){S.gems.push({x:e.x,y:e.y,chest:true});burst(e.x,e.y,'fire',30);}
  else{const dp=Math.max(.02,.3*Math.exp(-S.t/150))*(1+.3*pk('drop')+.1*up('drop')); // drop chance falls as hordes grow
    if(e.type==='golem'){if(Math.random()<Math.min(1,dp*1.5))S.gems.push({x:e.x,y:e.y,v:3,big:true});}
    else if(Math.random()<dp)S.gems.push({x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),v:1});}
  if(S.gems.length>500){ // fold oldest gems into one to keep things fast
    let sum=0;const keep=[];for(let i=0;i<S.gems.length;i++){const g=S.gems[i];if(i<200&&!g.chest)sum+=g.v;else keep.push(g);}
    keep.push({x:S.p.x+rnd(-200,200),y:S.p.y+rnd(-200,200),v:sum,big:true});S.gems=keep;}
}

const ETYPES={
  slime:{hp:12,sp:55,r:11,dmg:5,col:'#6bd36b'},
  bat:{hp:7,sp:105,r:8,dmg:4,col:'#b07cff'},

  elite:{hp:450,sp:62,r:26,dmg:22,col:'#ff5d7a'},
  eye:{hp:18,sp:50,r:10,dmg:6,col:'#a77bf3'},
  shroom:{hp:26,sp:72,r:11,dmg:0,col:'#ff8fc8'},
  boss:{hp:2600,sp:40,r:34,dmg:30,col:'#b13e53'},
  scorpion:{hp:30,sp:55,r:11,dmg:9,col:'#f2a93b'},
  snowball:{hp:40,sp:48,r:13,dmg:8,col:'#f4f4f4'},
  snowlet:{hp:14,sp:80,r:8,dmg:5,col:'#c8e6f5'},
  imp:{hp:24,sp:95,r:9,dmg:8,col:'#b13e53'},
  goldgob:{hp:70,sp:120,r:10,dmg:0,col:'#ffcd75'},
  troll:{hp:130,sp:30,r:16,dmg:14,col:'#38b764'},
  charger:{hp:95,sp:40,r:15,dmg:18,col:'#94b0c2'},
  archer:{hp:28,sp:48,r:10,dmg:8,col:'#f4f4f4'},
  turtle:{hp:75,sp:30,r:13,dmg:9,col:'#257179'},
};
// enemy growth accelerates late so stacked multipliers can't outscale it forever
const hpScale=t=>1+t/70+Math.pow(t/200,2.3);
const dmgScale=t=>1+t/200;
function spawn(type){
  const t=S.t;
  if(!type){const r=Math.random();
    type=t<45?'slime':t<120?(r<.7?'slime':'bat'):t<180?(r<.45?'slime':r<.75?'bat':'golem'):t<240?(r<.35?'slime':r<.6?'bat':r<.82?'golem':'eye'):(r<.28?'slime':r<.5?'bat':r<.7?'golem':r<.85?'eye':'shroom');}
  if(arguments.length===0&&t>=200&&Math.random()<Math.min(.24,.08+(t-200)/1500)){const pool=t>=300?['archer','turtle','troll','charger']:['archer','turtle'];type=pool[Math.floor(Math.random()*pool.length)];}
  const MP=mapOf();if(MP.uniq&&!['boss','elite'].includes(type)&&t>=50&&Math.random()<.28&&arguments.length===0)type=MP.uniq;
  const T=ETYPES[type],a=rnd(0,6.283),dist=Math.hypot(W,H)/2/SC+40;
  const N=nmOf(),dgm=S.mode==='dungeon',sc=(dgm?FLOOR_HP[S.floor]*(1+.04*S.dg.cleared):hpScale(t)*MP.hp)*N.hp,ds=(dgm?FLOOR_DMG[S.floor]:dmgScale(t)*MP.dmg)*N.dmg;
  const e={type,x:S.p.x+Math.cos(a)*dist,y:S.p.y+Math.sin(a)*dist,hp:T.hp*sc,max:T.hp*sc,sp:T.sp*(type==='bat'?1+t/1500:1+t/700)*N.sp,r:T.r,dmg:T.dmg*ds,col:T.col,flash:0,slowT:0,ringT:0,thornT:0,wob:rnd(0,6),hitCD:0,shT:rnd(1,2.5)};
  if(type==='shroom')e.bomb=16*ds;
  if(type==='boss')e.max=e.hp=T.hp*sc*(S.map==='castle'?1.5:1)*N.boss;
  e.cd=rnd(1,3);e.tp=rnd(2,4);
  if(dgm){const q=dgPos(80);e.x=q[0];e.y=q[1];}

  const others=rooms.filter(r=>r!==st0).sort((a,b)=>dist.get(ckey(b.x,b.y))-dist.get(ckey(a.x,a.y)));

  const boss=deads[0]||others[0];boss.type='boss';

      if(g.chest){S.gem+=20;gainXp(20);toast('보물상자! 무료 마법 + ◆20');freeSummon();}
      else{const v=g.v*(st.dbl&&Math.random()<st.dbl?2:1);S.gem+=v*st.gemMul;gainXp(v);}}
  }
  S.gems=S.gems.filter(g=>!g.got);
  for(const f of S.items){f.life-=dt;if(d2(f,p)<(p.r+16)**2){f.life=0;useItem(f);}}
  S.items=S.items.filter(f=>f.life>0);

  // fx
  for(const f of S.fx){
    if(f.k==='meteor'){f.t-=dt;if(f.t<=0&&!f.done){f.done=true;f.life=.35;
      for(const e of near(f.x,f.y,f.r+30)){const rr=f.r+e.r;if(d2(e,f)<rr*rr)hurt(e,f.dmg,'#ffb04a');}
      burst(f.x,f.y,'fire',22);shake(f.mini?1.5:3.5);
      if(!f.mini&&f.star>=2)zone(f.x,f.y,62,2.5,f.dmg*.12,'255,120,40','fire');
      if(!f.mini&&f.star>=3)for(let i=0;i<3;i++){const a=i*2.094+rnd(0,1);S.fx.push({k:'meteor',mini:true,x:f.x+Math.cos(a)*90,y:f.y+Math.sin(a)*90,t:.4,max:.4,r:42,dmg:f.dmg*.35});}}
      if(f.done)f.life-=dt;}
    else if(f.k==='dboom'){f.t-=dt;if(f.t<=0&&!f.done){f.done=true;f.life=.3;
      if(f.scythe)doScythe(f.scythe,f.thr);if(f.eclipse)doEclipse(f.eclipse,f.er,f.white);
      for(const e of near(f.x,f.y,f.r+30)){if(e.dead||d2(e,f)>(f.r+e.r)**2)continue;if(f.spike)e.slowT=Math.max(e.slowT,1.2);if(f.freeze)e.frozenT=Math.max(e.frozenT||0,.7);hurt(e,f.dmg,f.col);}
      S.fx.push({k:'blast',x:f.x,y:f.y,life:.3,r:f.r,col:f.col});if(f.heal){p.hp=Math.min(p.maxhp,p.hp+f.heal);}if(f.petals)shards(f.x,f.y,6,f.dmg*.3,'#ffcd75');}
      if(f.done)f.life-=dt;}
    else{f.life-=dt;if(f.k==='spark'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92;}}
  }
  S.fx=S.fx.filter(f=>(f.k==='meteor'||f.k==='dboom')?(!f.done||f.life>0):f.life>0);
  for(const t of S.texts){t.life-=dt;t.y-=40*dt;}
  S.texts=S.texts.filter(t=>t.life>0);

  if(p.hp<=0&&(st.revives||0)>S.revUsed){S.revUsed++;p.hp=p.maxhp*.5;p.inv=2.5;
    for(const e of near(p.x,p.y,220)){const dx=e.x-p.x,dy=e.y-p.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*140;e.y+=dy/l*140;}
    S.fx.push({k:'nova',x:p.x,y:p.y,r:220,life:.6,col:'126,224,138'});burst(p.x,p.y,'nature',50);toast('세계수의 가호로 부활했어요!');shake(8);
    if(st.reviveStar>=2)for(const e of near(p.x,p.y,290)){if(!e.dead&&d2(e,p)<290*290)hurt(e,100*scale(),'#7ee08a');}
    if(st.reviveStar>=3)p.inv=5;}
  if(nmOf().heal<1&&p.hp>hp0&&p.maxhp===mh0&&!(p.inv>2))p.hp=hp0+(p.hp-hp0)*nmOf().heal;
  if(p.hp<=0){p.hp=0;showEnd(false);}
  else if(!dgm&&S.t>=600){S.won=true;showEnd(true);}
}

// title scene drawn at quarter resolution, then scaled up crisp
let titleCv=null;
function drawTitleBg(){
  const t=performance.now()/1000,q=4,w=Math.ceil(W/q),h=Math.ceil(H/q);
  if(!titleCv||titleCv.width!==w||titleCv.height!==h)titleCv=newCanvas(w,h);
  const g=titleCv.getContext('2d');
  const bands=['#0f1024','#141631','#1a1c3a','#202448','#262b56','#2c3263'];
  for(let i=0;i<bands.length;i++){g.fillStyle=bands[i];g.fillRect(0,Math.floor(h*.62*i/bands.length),w,Math.ceil(h*.62/bands.length)+1);}
  for(let i=0;i<90;i++){const x=Math.floor(hash(i,1)*w),y=Math.floor(hash(i,2)*h*.55),on=Math.sin(t*(.6+hash(i,3)*1.5)+i)>-.3;if(!on)continue;g.fillStyle=hash(i,4)<.2?'#ffcd75':'#f4f4f4';g.fillRect(x,y,1,1);if(hash(i,5)<.08){g.fillRect(x-1,y,3,1);g.fillRect(x,y-1,1,3);}}
  const mx=Math.floor(w*.78),my=Math.floor(h*.15),mr=Math.max(5,Math.floor(Math.min(w,h)*.075));
  g.fillStyle='rgba(59,93,201,.18)';for(let r=mr*3;r>mr;r-=Math.max(2,Math.floor(mr*.5))){g.beginPath();g.arc(mx,my,r,0,6.283);g.fill();}
  for(let y=-mr;y<=mr;y++)for(let x=-mr;x<=mr;x++){const d=x*x+y*y;if(d<=mr*mr){const fl=performance.now()-moonFlash<160;g.fillStyle=d>(mr-1)*(mr-1)?(fl?'#f2a93b':'#94b0c2'):(fl?'#ffcd75':'#f4f4f4');g.fillRect(mx+x,my+y,1,1);}}
  g.fillStyle='#94b0c2';g.fillRect(mx-Math.floor(mr*.4),my-Math.floor(mr*.2),2,2);g.fillRect(mx+Math.floor(mr*.3),my+Math.floor(mr*.3),2,1);
  const hill=(base,amp,col,f,ph)=>{g.fillStyle=col;for(let x=0;x<w;x++){const y=Math.floor(h*base+Math.sin(x*f*q+ph)*amp/q+Math.sin(x*f*q*2.3+ph*1.7)*amp*.4/q);g.fillRect(x,y,1,h-y);}};
  hill(.5,22,'#29366f',.006,1);hill(.57,18,'#1f2944',.009,4);
  g.fillStyle='#1f2944';for(let i=0;i<14;i++){const x=Math.floor(hash(i,9)*w),base=Math.floor(h*.57+Math.sin(x*q*.009+4)*18/q+Math.sin(x*q*.009*2.3+6.8)*7.2/q),th=Math.floor((26+hash(i,8)*30)/q);for(let yy=0;yy<th;yy++){const hw2=Math.floor(yy*.32);g.fillRect(x-hw2,base-th+yy,hw2*2+1,1);}}
  hill(.64,12,'#1a1c2c',.012,2);
  for(let i=0;i<9;i++){if(Math.sin(t*1.5+i)<-.5)continue;g.fillStyle='#ffcd75';g.fillRect(Math.floor(hash(i,61)*w),Math.floor(h*.6+hash(i,62)*h*.08),1,1);}
  for(const f of FF){const x=Math.floor(((f.x*w+Math.sin(t*f.sp+f.ph)*6+t*3)%w+w)%w),y=Math.floor(f.y*h*.9),on=Math.sin(t*2*f.sp+f.ph);if(on<0)continue;g.fillStyle=on>.5?'#a7f070':'#38b764';g.fillRect(x,y,1,1);}
  ctx.imageSmoothingEnabled=false;ctx.drawImage(titleCv,0,0,w*q,h*q);

// ---------- hud ----------
let lastHud='';
function hud(){
  if(!S)return;
  const p=S.p,g=Math.floor(S.gem),c=Math.min(...S.shop.filter(Boolean).map(priceOf),99);
  const key=[DG()?S.floor:0,R(S.shield||0),R(p.maxhp),Math.floor(S.t),g,S.kills,c,S.newStock,S.lv,Math.floor(S.xp)].join('|');
  if(key===lastHud)return;lastHud=key;
  el.hpbar.style.width=(100*p.hp/p.maxhp)+'%';
  el.shbar.style.width=(100*Math.min(1,(S.shield||0)/p.maxhp))+'%';
  el.xpbar.style.width=(100*S.xp/xpNeed(S.lv))+'%';
  el.lvl.textContent=`Lv.${S.lv}`;
  el.hptext.textContent=`${R(p.hp)} / ${R(p.maxhp)}`;
  el.timer.textContent=DG()?`${S.floor+1}층`:fmt(S.t);
  el.gems.textContent=`◆ ${g}`;
  el.kills.textContent=`처치 ${S.kills}${S.nm?` · 악몽${S.nm}`:''}`;
  el.cost.textContent=DG()?'배치':c<99?`◆ ${c}~`:'품절';el.drawBtn.querySelector('span').textContent=DG()?'가방':'상점';
  el.drawBtn.classList.toggle('poor',g<c);
  let dot=el.drawBtn.querySelector('.dot');
  if(S.newStock&&!dot){dot=document.createElement('span');dot.className='dot';el.drawBtn.appendChild(dot);}
  else if(!S.newStock&&dot)dot.remove();
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
  if(mode==='play')for(let i=0;i<speedMul&&mode==='play';i++)update(dt);
  if(mode==='play'&&S&&S.perkQ>0)showPerk();
  if(popT>0){popT-=dt;if(popT<=0)el.pop.classList.remove('show');}
  if(toastT>0){toastT-=dt;if(toastT<=0)el.toast.classList.remove('show');}
  render();hud();
  el.overlay.classList.toggle('title',mode==='title');
  $('app').classList.toggle('titlemode',mode==='title');
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
})();
